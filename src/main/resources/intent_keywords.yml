# ==================== 意图识别配置 ====================
# 本配置文件用于意图分类器，基于 BM25 语义评分区分普通对话与技能意图
# 支持使用 /kilacraft reload 命令热重载
# 修改后无需重启服务器，立即生效

# ==================== BM25 评分阈值 ====================
# 用户输入与 Skill 描述的 BM25 相关性得分超过此阈值时判定为技能意图
# 开启 debug_mode 可在控制台查看实际得分来调优
# - 值越高：越严格，只拦截明确的技能请求，更多请求走普通 AI 对话
# - 值越低：越宽松，更多请求会被送去 LLM 意图识别
#
# 设计原则：宁可误判为技能意图，不可误判为普通对话
# - 误判为技能 → LLM 识别无匹配技能 → 自动回退普通对话（无害）
# - 误判为普通对话 → 直接跳过 LLM → 永远无法执行技能（致命）
#
# 预分类不依赖此阈值过滤普通对话，前两层防线已处理：
#   第1层：normal_chat 关键词快速短路（"你好"、"hello"等）
#   第2层：chat_patterns 闲聊句式（"你觉得"、"什么是"等）
# 此阈值仅处理经过前两层后仍不确定的灰色地带
skill_match_threshold: 5.0

# 祈使句式匹配时额外加的分数
imperative_bonus: 10.0

# ==================== 祈使句式 ====================
# 用户输入包含这些词时额外加分，增加技能意图判定概率
imperative_patterns:
  - "帮我"
  - "给我"
  - "查一下"
  - "看一下"
  - "告诉我"
  - "看看"
  - "查查"
  - "我要"

# ==================== 闲聊句式 ====================
# 用户输入包含这些词时强制判定为普通对话（优先级最高）
chat_patterns:
  - "你觉得"
  - "你认为"
  - "什么是"
  - "为什么"
  - "介绍一下"
  - "讲一讲"

# ============================================
# 普通对话关键词（快速短路，检测到即跳过 BM25 评分直接走普通 AI 对话）
# ============================================
normal_chat:
  keywords:
    - "你好"
    - "在吗"
    - "在不在"
    - "有人吗"
    - "喂"
