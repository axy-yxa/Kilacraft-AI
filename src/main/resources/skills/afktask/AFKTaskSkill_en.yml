# AFKTaskSkill Configuration (English)
# This file is auto-generated by the plugin and can be modified
#
# This description is sent to the LLM to help it understand when to use this skill
description: 'AFK task system: continuously monitors an event condition in the background, automatically executing a complete multi-step callback task when the condition is met. Use this skill when users mention "background monitoring", "watch", "once...then...", "keep an eye on", "when..." and other continuous monitoring needs. Typical scenarios: player online/offline alerts, death notifications, teleport/level change monitoring, weather changes, item breakage, fishing, chat keywords, block breaking, entity spawn/death/explosion, furnace smelting, crop growth, custom condition polling. Keywords: online, offline, disconnected, died, death, health drop, balance low, time up, watch, monitor, once, when, fish, chat, mine, explode, smelt, grow. This skill focuses on event monitoring; callback tasks are completed by multi-step task chains (can include any Skill combination), and execution results are notified to the player after LLM secondary analysis.'

# Action descriptions (Map format, key=action name, value=action description)
# Each action description is sent to the LLM to help it select the correct action and extract parameters
action_descriptions:
  create_task: 'Create a new AFK task (all types use this same action; task_type parameter determines the specific monitoring type). Required parameters: task_type (monitoring type), target_player (target player name to monitor, **never empty**). target_player semantic rules: (1) When user says "tell me when I die", "watch myself" etc. referring to themselves, fill in the current player name; (2) When user explicitly mentions another player name, fill in that name directly; (3) When user says "watch him" but context cannot determine who, ask the user first. Optional parameter: callback (callback task configuration, only when user explicitly requests additional operations after event trigger). If user only requests "watch for xxx online", "tell me when xxx is online" etc. pure notification needs, do not provide callback parameter. **Only accepts one-time tasks (trigger once then end), does not accept "every", "periodically", "scheduled", "daily" etc. long-term recurring tasks**'
  cancel_task: 'Cancel the player currently running AFK task. When a player already has an AFK task and wants to create a new one, proactively cancel the old task first then create the new one. You can also call query_task first to view current task info, then decide whether to cancel.'
  query_task: "Query the player current AFK task status, including task ID, type, status, etc."

# Additional hints (for guiding LLM to use skills correctly)
hints:
  - '**Output format**: cancel_task and query_task return as single intent JSON. create_task has two forms: (1) All parameters known (e.g. "watch my health drop below 5") → single intent JSON; (2) Parameters need to be queried first (e.g. "watch for someone selling my held item on the market" - "my held item" needs querying first) → **must** return as multi-step TaskPlan (step_0 query parameter → step_1 create task). callback is a field in entities whose value is an inline JSON object (not a string), not a separate step.'
  - '**target_player rule**: never empty/omitted/filled with placeholder. When referring to self, fill current player name; when explicitly mentioning another player name, fill it directly; when reference is unclear, ask user first.'
  - '**Pure notification no callback**: when user only says "watch for xxx online", entities only has task_type and target_player'
  - '**callback format**: callback is a field in entities whose value is an inline JSON object (not a string). JSON object contains callback_task (goal+steps) and notify_target (string, default "{creator}"). **notify_target must be a plain string value**, such as "{creator}" or a specific player name. **Never output as a JSON object** (e.g. {"player":"xxx"} or {"target":"xxx"} are wrong formats). callback_task steps is a **self-contained** multi-step task chain, executed only when condition triggers, with **completely isolated** execution context from outer TaskPlan. Constraints: (1) skill_name cannot be AFKTask (no recursion); (2) steps id starts from step_0 with consecutive numbering, depends_on referenced step ids must exist **within the callback steps list**, **never reference outer TaskPlan step ids**; (3) step entities placeholders can only reference prerequisite steps within callback steps, **absolutely no self-reference** (e.g. step_0 cannot reference {step_0.xxx}), also **cannot reference not-yet-executed steps**; (4) when callback needs to query data (e.g. teleport_home needs home_name), the query step (e.g. query_homes) **must be placed inside callback steps** as a prerequisite step, **never in outer TaskPlan** (because callback executes later, outer step data is unavailable at trigger time); (5) **callback steps must never reference outer steps via depends_on**, callback depends_on can only reference steps within callback; (6) **JSON bracket closing must be precise**: callback nesting is deep (entities{callback{callback_task{steps[step{entities{}}]}}}}), each layer must close exactly. After output, **count brackets layer by layer** to confirm closure, **never write extra or missing `}`**. Common error: writing extra `}` after notify_target value, causing depends_on to appear at wrong level. Correct example: `"notify_target":"{creator}"} } } ] } ] }` (inside-out: close callback_task→close callback→close entities→close step→close steps array→close outer entities→close step→close outer steps array→close entire JSON)'
  - '**task_type selection rules (important)**：task_type has two categories: **event-driven** and **condition-polling (CUSTOM)**, must be chosen based on the essence of user intent. **Event-driven** (PLAYER_*_WATCH, BLOCK_BREAK_WATCH, ENTITY_*_WATCH, etc.): automatically triggered by server events, only notifies when a specific action occurs (e.g. player comes online, block is mined, entity dies); selection condition: user intent can be precisely described by a single event, no need to periodically query any API. **Condition-polling** (CUSTOM): system periodically calls a specified API to get a return value and compares it with a threshold; selection condition: user intent involves "a value reaches/drops below/is not X", requiring periodic API query for condition checking. **Common misjudgment scenarios**: (1) "watch block under feet", "foot block is not grass" → needs to poll GenericBukkitAPI.get_player_feet_block for block_type, **must use CUSTOM**, NOT BLOCK_BREAK_WATCH (latter only triggers on block **mining/destruction**, does not detect foot block); (2) "health drops below 5" → needs to poll get_player_health return value, **must use CUSTOM**, NOT PLAYER_DEATH_WATCH (latter is player **death** event); (3) "watch block being broken" → block mining/destruction event, use BLOCK_BREAK_WATCH; (4) "watch xxx come online" → player online event, use PLAYER_ONLINE_WATCH.'
  - '**task_type types**: PLAYER_ONLINE_WATCH=online, PLAYER_OFFLINE_WATCH=offline, PLAYER_DEATH_WATCH=death, PLAYER_TELEPORT_WATCH=teleport, PLAYER_LEVEL_CHANGE_WATCH=level change, PLAYER_CHANGED_WORLD_WATCH=world change, WEATHER_CHANGE_WATCH=weather change, PLAYER_BED_ENTER_WATCH=enter bed, PLAYER_BED_LEAVE_WATCH=leave bed, PLAYER_RESPAWN_WATCH=respawn, PLAYER_ITEM_BREAK_WATCH=item break, PLAYER_FISH_WATCH=fishing, PLAYER_CHAT_WATCH=chat(optional keyword param for keyword filtering), BLOCK_BREAK_WATCH=block mined/destroyed(optional block_type param for block filtering), ENTITY_DEATH_WATCH=entity death(optional entity_type param, radius 64 blocks from creator), ENTITY_SPAWN_WATCH=entity spawn(optional entity_type param, radius 64 blocks from creator), ENTITY_EXPLODE_WATCH=entity explosion(radius 64 blocks from creator), FURNACE_SMELT_WATCH=furnace smelt complete(optional result_type param, radius 16 blocks from creator), BLOCK_GROW_WATCH=crop/block grow(optional block_type param, radius 32 blocks from creator), CUSTOM=custom condition polling(poll API return values for condition checking). Note: when target player is already online, suggest PLAYER_OFFLINE_WATCH and vice versa.'
  - '**Callback placeholders**: TELEPORT_WATCH can use {from_world}/{to_world}/{from_x}/{from_y}/{from_z}/{to_x}/{to_y}/{to_z}; LEVEL_CHANGE_WATCH can use {old_level}/{new_level}/{direction}; CHANGED_WORLD_WATCH can use {from_world}/{to_world}; WEATHER_CHANGE_WATCH can use {world_name}/{weather_state}/{weather_type}; BED_ENTER/LEAVE/RESPAWN can use {x}/{y}/{z}/{world}; ITEM_BREAK can use {item_name}/{item_type}; FISH_WATCH can use {caught_item}; CHAT_WATCH can use {chat_message}/{triggered_player}; BLOCK_BREAK_WATCH can use {block_type}/{triggered_player}; ENTITY_DEATH_WATCH can use {entity_type}; ENTITY_SPAWN_WATCH can use {entity_type}; ENTITY_EXPLODE_WATCH can use {entity_type}/{block_count}; FURNACE_SMELT_WATCH can use {result_type}/{result_amount}; BLOCK_GROW_WATCH can use {block_type}'
  - '**Callback skill selection**: callback steps should prioritize using specialized skills rather than command general-purpose skill. Specialized skills encapsulate permission checks and business logic, while directly executing commands may fail due to insufficient permissions (normal players usually do not have admin-level command permissions)'
  - '**CUSTOM type**: Required task_type=CUSTOM, condition_plan (a single JSON string parameter in entities, NOT separate top-level fields). condition_plan value structure: {"condition_skill":"skill_name","condition_action":"action_name","result_path":"return_field_name","operator":"comparison_operator","threshold":value}. operator supports less_than/less_than_or_equal/greater_than/greater_than_or_equal/equal/not_equal. **threshold must be a concrete number (no placeholder expressions like {step_0.health}-5, compute the value yourself based on the prerequisite step result)**. Example: user says "health drops by 5", if prerequisite step returns health=20, then threshold=15 operator=less_than_or_equal. threshold also supports booleans (true→1.0, false→0.0) and strings (only for equal/not_equal, e.g. block type "GRASS_BLOCK"). If condition skill needs extra parameters (e.g. market_query.query_availability needs item), must add condition_params field (JSON object). condition_params values must be concrete values or outer TaskPlan prerequisite step placeholders. Only supports single condition, not multi-condition combinations.'
  - '**One-time task**: only supports trigger once then end, does not accept "every", "periodically", "scheduled", "daily" etc. recurring tasks'
  - '**utility skills in callback**: callback steps can use utility.delay_wait to insert delays between steps, and utility.notify_player to insert AI output midway (see AFK Task Decision Rules for detailed usage constraints)'
  - '**Concurrency and commands**: each person can only have one AFK task at a time. In-game commands: /kilacraft afk (query), /kilacraft afk cancel (cancel). **Only when the player already has a running task and needs to create a new one**, first cancel_task then create_task (as multi-step TaskPlan). If the player has no running task, just create_task directly — do NOT add a cancel_task prerequisite step'
