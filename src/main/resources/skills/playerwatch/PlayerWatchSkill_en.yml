# PlayerWatchSkill configuration
# This file is auto-generated; modify as needed
#
# This description is sent to the LLM to help it understand when to invoke this skill
description: 'Cross-player online/offline subscription skill. Players can subscribe to other players'' join/quit notifications; when a subscribed player''s status changes, the AI will proactively alert the subscriber. Subscriptions are only valid while the subscriber is online — they are cleared on logout (not persisted, not restored on restart).'

# Action descriptions (Map format: key=action name, value=description)
action_descriptions:
  subscribe: 'Subscribe to a player''s join/quit notifications. Params: target_player (required, the player name to watch), trigger_event (optional, JOIN=only online, QUIT=only offline, BOTH=both, default BOTH), note (optional, a note shown with the notification). The returned data contains target_player, trigger_event, subscription_count fields, which can be referenced by subsequent steps.'
  unsubscribe: 'Cancel subscriptions to a player. Params: target_player (the player name), trigger_event (optional, defaults to canceling all subscriptions for that player). The returned data contains target_player, removed_count fields, which can be referenced by subsequent steps.'
  list: 'Query all active subscriptions for the current player. No params. The returned data contains subscriptions (list of {target_player, trigger_event, note, created_at}) and total fields, which can be referenced by subsequent steps.'
  unsubscribe_all: 'Cancel all subscriptions for the current player. No params. The returned data contains removed_count field, which can be referenced by subsequent steps.'

# Additional hints
hints:
  - 'Use subscribe when the player says things like "tell me when Steve comes online", "alert me when Alex logs in", "I want to know when a player goes online", "watch someone''s online status"'
  - 'Use unsubscribe when the player says "cancel my subscription to Steve", "stop watching Alex", "don''t track that player anymore"'
  - 'Use list when the player says "who am I subscribed to", "my subscription list", "show me who I''m watching"'
  - 'Use unsubscribe_all when the player says "cancel everything", "clear my subscriptions", "stop watching everyone"'
