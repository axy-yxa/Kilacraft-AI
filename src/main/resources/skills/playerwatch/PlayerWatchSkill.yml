# PlayerWatchSkill 跨玩家上下线订阅技能配置
# 此文件由插件自动生成，可根据需要修改
#
# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '跨玩家上下线订阅技能，玩家可以订阅其他玩家的上线/下线通知，当被订阅玩家状态变化时，AI 会主动提醒订阅者。订阅仅在玩家在线期间有效，订阅者下线后所有订阅自动清除（不持久化、重启不恢复）。'

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  subscribe: '订阅指定玩家的上线/下线通知。参数：target_player（必需，被订阅玩家名）、trigger_event（可选，JOIN=仅上线、QUIT=仅下线、BOTH=两者，默认 BOTH）、note（可选，订阅备注，会随通知一同显示）。返回的 data 中包含 target_player、trigger_event、subscription_count 字段，可供后续步骤引用。'
  unsubscribe: '取消对指定玩家的订阅。参数：target_player（被订阅玩家名）、trigger_event（可选，默认取消该玩家的全部订阅）。返回的 data 中包含 target_player、removed_count 字段，可供后续步骤引用。'
  list: '查询当前玩家名下所有活跃订阅。无参数。返回的 data 中包含 subscriptions（订阅列表，每项含 target_player/trigger_event/note/created_at）、total 字段，可供后续步骤引用。'
  unsubscribe_all: '取消当前玩家的所有订阅。无参数。返回的 data 中包含 removed_count 字段，可供后续步骤引用。'

# 额外提示信息
hints:
  - '当玩家说"盯 Steve 上线"、"Alex 上线告诉我"、"我想知道某玩家什么时候上线"、"监视某某的上下线"等订阅其他玩家状态变化的请求时使用 subscribe'
  - '当玩家说"取消对 Steve 的订阅"、"别盯了 Alex"、"不再监视某玩家"等取消订阅请求时使用 unsubscribe'
  - '当玩家说"我订阅了谁"、"我的订阅列表"、"查下我的盯人列表"、"我现在在盯谁"时使用 list'
  - '当玩家说"全部取消"、"清空订阅列表"、"别盯任何人了"、"取消所有订阅"时使用 unsubscribe_all'
