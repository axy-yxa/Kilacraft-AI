# BukkitFXSkill 技能配置
# 音效与粒子效果技能：播放音效或显示粒子效果（仅调用者听到/看到）
# 用于：任务完成庆祝、警告提示、氛围营造

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '播放音效或显示粒子效果（仅自己听到/看到）。完整枚举列表已写入知识库，系统会在意图识别阶段自动检索提供参考。用于任务完成庆祝、警告提示、氛围营造等场景。'

# 动作描述（Map 格式，key=动作名称，value=动作描述）
# 每个动作的描述会发送给LLM，帮助其选择正确的action并提取参数
action_descriptions:
  play_sound: '播放Minecraft音效（仅自己听到）。需要参数：sound（音效枚举名称）、volume（音量0.0-1.0，默认1.0）、pitch（音调0.5-2.0，默认1.0）。音效枚举名称会通过知识库检索提供参考。'
  spawn_particle: '显示粒子效果（仅自己看到）。需要参数：particle（粒子枚举名称）、count（数量1-100，默认10）、offset_x/y/z（扩散范围0.0-2.0，默认0.5）。粒子枚举名称会通过知识库检索提供参考。'

# 额外提示信息（用于指导 LLM 正确使用技能）
hints:
  - "**枚举获取**：音效和粒子枚举名称已通过知识库检索提供，直接使用检索结果中的枚举值即可。"
  - "**参数范围**：音量0.0-1.0，音调0.5-2.0，粒子数量1-100，扩散范围0.0-2.0。"

