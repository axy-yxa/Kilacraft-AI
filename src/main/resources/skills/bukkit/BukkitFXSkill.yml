# BukkitFXSkill 技能配置
# 音效与粒子效果技能：播放音效或显示粒子效果（仅调用者听到/看到）
# 用于：任务完成庆祝、警告提示、氛围营造

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '播放音效或显示粒子效果（仅自己听到/看到）。支持音效名/粒子名精确匹配和中文描述模糊匹配。用于任务完成庆祝、警告提示、氛围营造等场景。'

# 动作描述
action_descriptions:
  play_sound: '播放Minecraft音效（仅自己听到）。需要参数：sound（音效枚举名称或中文描述，如村民叫声、升级音）、volume（音量0.0-1.0，默认1.0）、pitch（音调0.5-2.0，默认1.0）。'
  spawn_particle: '显示粒子效果（仅自己看到）。需要参数：particle（粒子枚举名称或中文描述，如爱心、烟花）、count（数量1-100，默认10）、offset_x/y/z（扩散范围0.0-2.0，默认0.5）。'

# 额外提示信息
hints:
  - "**枚举参数**：sound和particle参数支持精确枚举名（如ENTITY_VILLAGER_YES）或中文描述（如村民叫声、爱心粒子），系统自动匹配最接近的枚举值。"
  - "**参数范围**：音量0.0-1.0，音调0.5-2.0，粒子数量1-100，扩散范围0.0-2.0。"

