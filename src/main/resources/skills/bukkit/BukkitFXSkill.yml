# ═══════════════════════════════════════════════════════════
# 音效与粒子效果技能（BukkitFXSkill）
# 在调用者自身位置播放 Minecraft 音效或显示粒子效果（仅自己听到/看到）。
# 用于任务完成庆祝、警告提示、氛围营造等场景。
# ═══════════════════════════════════════════════════════════

description: |
  在调用者自身位置播放 Minecraft 音效或显示粒子效果（仅自己听到/看到），用于任务完成庆祝、警告提示、氛围营造等纯表现类场景。
  触发场景：玩家想给自己加点反馈效果时，如「放个升级音」「来点爱心粒子庆祝一下」「播放警告音」。
  反向边界：不用于任何游戏玩法机制（加血/传送/给予物品等走对应技能），也不用于查询统计或实时状态。

action_descriptions:
  play_sound: |
    功能：在玩家自身位置播放 Minecraft 音效（仅自己听到）。
    参数：
      - sound（必填，枚举名）：音效枚举名（如 ENTITY_VILLAGER_YES）或中文描述（如村民叫声、升级音），系统自动匹配最接近的枚举值。
      - volume（可选，默认 1.0，数值（小数））：音量，合法范围 0.0-1.0，超出会被自动裁剪。
      - pitch（可选，默认 1.0，数值（小数））：音调，合法范围 0.5-2.0，超出会被自动裁剪。
    返回 data 字段：无（仅 message 回显音效、音量、音调与播放位置）。
  spawn_particle: |
    功能：在玩家自身位置显示粒子效果（仅自己看到）。
    参数：
      - particle（必填，枚举名）：粒子枚举名或中文描述（如爱心、烟花），系统自动匹配最接近的枚举值。
      - count（可选，默认 10，数值（整数））：粒子数量，合法范围 1-100，超出会被自动裁剪。
      - offset_x（可选，默认 0.5，数值（小数））：X 轴扩散范围。
      - offset_y（可选，默认 0.5，数值（小数））：Y 轴扩散范围。
      - offset_z（可选，默认 0.5，数值（小数））：Z 轴扩散范围。
    返回 data 字段：无（仅 message 回显粒子、数量、扩散范围与播放位置）。

hints:
  - |
    两个动作都是「自我表现」效果，只作用于调用者本人、不影响其他玩家，也不产生任何玩法影响（不改血量/物品/位置）。需要影响他人或全服时不要用本技能。
