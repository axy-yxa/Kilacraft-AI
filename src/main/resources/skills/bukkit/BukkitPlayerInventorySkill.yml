# ═══════════════════════════════════════════════════════════
# 玩家物品栏与装备查询技能（BukkitPlayerInventorySkill）
# 查询玩家自身的物品栏、手持物品、盔甲、末影箱、当前打开的容器内容。
# 仅查询自己（SkillSecurityFilter 会拦截跨玩家参数）；查询实时状态（血量/饱食度）请用 player_status。
# ═══════════════════════════════════════════════════════════

description: |
  查询玩家自己的物品栏与装备信息：主手/副手物品详情、背包占用格数、背包/末影箱物品摘要、穿戴的盔甲、当前打开的界面与容器内容。
  触发场景：玩家问「我手上拿的是什么」「背包里有什么」「背包快满了吗」「末影箱里有钻石吗」「穿的什么盔甲」「打开的箱子里有什么」等物品栏相关查询时使用。
  反向边界：不用于查询实时状态（血量/饱食度/坐标/经验等走 player_status），不用于查询基础信息（位置/游戏模式等走 player_info），也不用于市场/交易操作。

action_descriptions:
  get_player_hand_item: |
    功能：获取玩家主手持有的物品详情（类型、数量、附魔、耐久等）。
    参数：无。
    返回 data 字段：item_type（物品材质枚举名）、item_name（物品自定义名，仅物品有自定义名时存在）、item_amount（数量）、enchantments（附魔列表，Map<附魔名, 等级>）、damage（损伤值）、max_durability（最大耐久度）、remaining_durability（剩余耐久度）、unbreakable（是否不可破坏）、lore（描述列表）、attributes（属性修饰词，仅 Folia 端）、custom_model_data（自定义模型数据）、item_flags（物品标志）。空手时无这些字段。
  get_player_offhand_item: |
    功能：获取玩家副手（盾牌槽）持有的物品详情。
    参数：无。
    返回 data 字段：同 get_player_hand_item。
  get_player_inventory_usage: |
    功能：【极轻量】获取玩家背包（快捷栏+主背包，共36格）的占用格数和空格数，不读取物品详情。
    参数：无。
    返回 data 字段：item_count（已占用格数）、empty_slots（空格数）。适合 WatchSkill 轮询监控背包是否快满。
  get_player_inventory: |
    功能：获取玩家背包（共36格）中所有物品的摘要列表（仅物品名称和数量，不含附魔/耐久详情）。
    参数：无。
    返回 data 字段：item_count（已占用格数）、empty_slots（空格数）、items（物品摘要列表，每项含 slot/item_type/item_amount、item_name 仅物品有自定义名时存在）。如需物品详情请用 get_player_hand_item。
  get_player_ender_chest: |
    功能：获取玩家末影箱中所有物品的摘要列表（仅物品名称和数量）。
    参数：无。
    返回 data 字段：item_count（已占用格数）、empty_slots（空格数）、items（物品摘要列表，每项含 slot/item_name/item_type/item_amount）。
  get_player_armor: |
    功能：获取玩家当前穿戴的全套盔甲（头盔、胸甲、护腿、靴子）及附魔和耐久度。
    参数：无。
    返回 data 字段：对每个非空槽位返回 helmet_*/chestplate_*/leggings_*/boots_* 系列字段，含 _type（材质枚举名）、_name（自定义名，仅有自定义名时存在）、_amount（数量）、_enchantments（附魔 Map）、_max_durability（最大耐久）、_remaining_durability（剩余耐久）。
  get_player_open_inventory: |
    功能：获取玩家当前正在查看的界面类型（如箱子、熔炉、附魔台、玩家背包等）。
    参数：无。
    返回 data 字段：raw_result（界面类型枚举原始值）。仅查询界面类型，不查询容器内物品。
  get_player_open_container: |
    功能：获取玩家当前正在查看的容器（箱子、熔炉、附魔台、潜影盒等）中的所有物品摘要。前提：玩家正在查看某个容器界面。
    参数：无。
    返回 data 字段：item_count（已占用格数）、empty_slots（空格数）、items（物品摘要列表）、container_type（容器类型枚举名）、container_title（容器标题）。

hints:
  - |
    所有 action 仅查询玩家自己，参数中即使出现其他玩家名也会被安全拦截器替换为当前玩家。
  - |
    物品详情与摘要的区别：get_player_hand_item/get_player_offhand_item 返回单个物品的完整详情（附魔/耐久/属性）；get_player_inventory/get_player_ender_chest/get_player_open_container 返回物品列表的摘要（仅名称+数量）。需要详情时先用摘要定位槽位，再用对应详情查询。
  - |
    get_player_open_container 与 get_player_open_inventory 的关系：后者只返回界面类型（玩家是否在看某个界面），前者返回容器内物品。判断玩家是否在交易/合成时用 open_inventory，要看容器内容时用 open_container。
