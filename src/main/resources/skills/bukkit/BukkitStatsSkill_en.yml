# BukkitStatsSkill Configuration (English)
# Minecraft vanilla statistics query skill: query player cumulative statistics (lifetime records)
# Used for: querying death count, kill count, walking distance, etc. historical cumulative data

# This description is sent to the LLM to help it understand when to use this skill
description: 'Query player Minecraft vanilla statistics (cumulative/lifetime records). Supports exact enum names and fuzzy description matching. Used for querying historical cumulative data such as total deaths, total kills, total walking distance, mining count, etc. Note: this skill queries lifetime cumulative values, not current real-time status (e.g. health, hunger).'

action_descriptions:
  query_statistic: 'Query the value of a specified statistic. Required parameters: statistic (statistic enum name or description, e.g. deaths, kill count). Some statistics require additional parameters: entity_type (e.g. ZOMBIE), material (e.g. DIAMOND_ORE). Returned data contains statistic, value, statistic_type fields, available for subsequent step references.'

hints:
  - "**Cumulative stats vs current status**: This skill queries lifetime cumulative values (e.g. total deaths), not suitable for current real-time status (e.g. health/hunger/level)."
  - "**Parameter types**: Statistics are divided into four types - no parameter (UNTYPED), needs material parameter (ITEM/BLOCK type), needs entity_type parameter (ENTITY type)."
  - "**Distance and time units**: Movement distance in centimeters (1 block=100CM), time in ticks (20 ticks=1 second)."
