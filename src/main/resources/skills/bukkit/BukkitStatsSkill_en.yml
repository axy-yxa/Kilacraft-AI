# BukkitStatsSkill Configuration (English)
# Minecraft vanilla statistics query skill: query player cumulative statistics (lifetime records)
# Used for: querying death count, kill count, walking distance, etc. historical cumulative data

# This description is sent to the LLM to help it understand when to use this skill
description: 'Query player Minecraft vanilla statistics (cumulative/lifetime records). Only supports built-in Minecraft gameplay statistics (e.g. death count, kill count, walking distance, mining count, items crafted, items used, etc.), does NOT support non-game queries (e.g. recipes, nutrition advice). Note: this skill queries lifetime cumulative values, not current real-time status (e.g. health, hunger).'

action_descriptions:
  query_statistic: 'Query the value of a specified statistic. Required parameters: statistic (Minecraft gameplay statistic enum name or game-related description, e.g. DEATHS, death count, MOB_KILLS, kill count, etc. — must be a statistic directly related to Minecraft gameplay). Some statistics require additional parameters: entity_type (e.g. ZOMBIE), material (e.g. DIAMOND_ORE). Returned data contains statistic, value, statistic_type fields, available for subsequent step references.'

hints:
  - "**Cumulative stats vs current status**: This skill queries lifetime cumulative values (e.g. total deaths), not suitable for current real-time status (e.g. health/hunger/level)."
  - "**Parameter types**: Statistics are divided into four types - no parameter (UNTYPED), needs material parameter (ITEM/BLOCK type), needs entity_type parameter (ENTITY type)."
  - "**Distance and time units**: Movement distance in centimeters (1 block=100CM), time in ticks (20 ticks=1 second)."
  - "**No guessing enum names**: statistic parameter must be a statistic enum name you are certain exists in Minecraft vanilla. If uncertain whether a statistic exists, return invalid intent instead of guessing. If the user asks advice/guide/recommendation questions, this skill does not apply, return invalid intent."
