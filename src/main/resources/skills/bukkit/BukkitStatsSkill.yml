# BukkitStatsSkill 技能配置
# Minecraft 原版统计数据查询技能：查询玩家的累计统计信息（生涯记录）
# 用于：查询死亡次数、击杀数、行走距离等历史累计数据

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '查询玩家 Minecraft 原版统计数据（累计/生涯记录）。仅支持 Minecraft 游戏内置的统计项（如死亡次数、击杀数、行走距离、挖矿数量、合成物品、使用物品等），不支持查询非游戏内容（如食谱、营养建议等）。注意：此技能查询的是生涯累计值，不是当前实时状态（如血量、饱食度）。'

action_descriptions:
  query_statistic: '查询指定统计项的值。需要参数：statistic（Minecraft 游戏统计项的枚举名或游戏相关的中文描述，如 DEATHS、死亡次数、MOB_KILLS、击杀数、杀了多少怪等，必须是与 Minecraft 游戏玩法直接相关的统计项）。部分统计项需要额外参数：entity_type（实体类型名，如 ZOMBIE）、material（材质名，如 DIAMOND_ORE）。返回的 data 中包含 statistic、value、statistic_type 字段，可供后续步骤引用。'

hints:
  - "**累计统计 vs 当前状态**：此技能查询生涯累计值（如总共死了多少次），不适用于查询当前实时状态（如血量/饱食度/等级）。"
  - "**参数类型**：统计项分四种类型——无参数（UNTYPED）、需要material参数（ITEM/BLOCK类型）、需要entity_type参数（ENTITY类型）。"
  - "**距离与时长单位**：移动距离单位为厘米（1格=100CM），时长单位为tick（20tick=1秒）。"
  - "**严禁猜测枚举名**：statistic 参数必须是你确信存在于 Minecraft 原版中的统计枚举名。如果不确定某统计项是否存在，应返回无效意图而非猜测。如果用户问的是建议/攻略/推荐类问题，此技能不适用，应返回无效意图。"
