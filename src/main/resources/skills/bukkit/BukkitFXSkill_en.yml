# BukkitFXSkill Configuration (English)
# Sound & particle effects skill: play sounds or display particle effects (only heard/seen by the caller)
# Used for: task completion celebration, warning alerts, atmosphere creation

# This description is sent to the LLM to help it understand when to use this skill
description: 'Play sound effects or display particle effects (only you hear/see). Supports exact enum names and fuzzy Chinese description matching. Used for task completion celebration, warning alerts, atmosphere creation, etc.'

action_descriptions:
  play_sound: 'Play a Minecraft sound effect (only you hear). Required parameters: sound (sound enum name or description, e.g. villager sound, level-up), volume (0.0-1.0, default 1.0), pitch (0.5-2.0, default 1.0).'
  spawn_particle: 'Display particle effects (only you see). Required parameters: particle (particle enum name or description, e.g. hearts, fireworks), count (1-100, default 10), offset_x/y/z (0.0-2.0, default 0.5).'

hints:
  - "**Enum parameters**: sound and particle parameters support exact enum names (e.g. ENTITY_VILLAGER_YES) or descriptive text, the system will auto-match the closest enum value."
  - "**Parameter ranges**: Volume 0.0-1.0, pitch 0.5-2.0, particle count 1-100, spread range 0.0-2.0."
