# ============================================
# 服务器相关 API (Bukkit 原生)
# ============================================

server:
  # ========================
  # 玩家信息
  # ========================
  get_online_players:
    id: "get_online_players"
    display_name: "获取在线玩家数量"
    description: "获取当前服务器上的在线玩家数量和列表，查看谁在线、在线人数、有哪些玩家在线。返回的 data 中包含 online_count 字段（在线人数），可供后续步骤引用。"
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    data_field: "online_count"
    method_chain:
      - "getOnlinePlayers"
  
  get_max_players:
    id: "get_max_players"
    display_name: "获取最大玩家数"
    description: "获取服务器允许的最大玩家数量。最多能进多少人、服务器人数上限。返回的 data 中包含 max_players 字段，可供后续步骤引用。"
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    data_field: "max_players"
    method_chain:
      - "getMaxPlayers"
  
  # ========================
  # 版本信息
  # ========================
  get_server_version:
    id: "get_server_version"
    display_name: "获取服务器版本"
    description: "获取服务器的版本信息（Bukkit 版本和 Minecraft 版本）。服务器什么版本、版本号多少、MC版本。返回的 data 中包含 version 和 bukkit_version 字段，可供后续步骤引用。"
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    additional_methods:
      version: "getVersion"
      bukkit_version: "getBukkitVersion"
    result_template: "服务器版本：{version}, Bukkit 版本：{bukkit_version}"
  
  get_server_motd:
    id: "get_server_motd"
    display_name: "获取服务器 MOTD"
    description: "获取服务器的 MOTD（每日消息/服务器介绍）。注意：此 API 返回包含格式化代码的展示文本，仅适用于用户直接询问服务器介绍时使用，不适合作为多步骤任务的数据来源。"
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    method_chain:
      - "getMotd"
  
  # ========================
  # 世界列表
  # ========================
  get_server_worlds:
    id: "get_server_worlds"
    display_name: "获取服务器世界列表"
    description: "获取服务器上所有已加载的世界列表。有哪些世界、世界列表、服务器有几个世界。返回的 data 中包含 world_count 字段（世界数量），可供后续步骤引用。"
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    data_field: "world_count"
    method_chain:
      - "getWorlds"
  
  # ========================
  # 服务器设置
  # ========================
  get_server_settings:
    id: "get_server_settings"
    display_name: "获取服务器设置"
    description: "获取服务器的基本设置（是否允许飞行、下界、末地）。服务器设置、能不能飞、有没有下界末地。返回的 data 中包含 allow_flight、allow_nether 和 allow_end 字段（布尔），可供后续步骤引用。"
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    additional_methods:
      allow_flight: "getAllowFlight"
      allow_nether: "getAllowNether"
      allow_end: "getAllowEnd"
    result_template: "允许飞行：{allow_flight}, 允许下界：{allow_nether}, 允许末地：{allow_end}"
