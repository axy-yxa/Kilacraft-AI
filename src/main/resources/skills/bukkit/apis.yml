# ============================================
# Bukkit API 元数据配置文件
# ============================================
# 
# 【文件说明】
# 此文件定义了所有可被 LLM 调用的原版 Bukkit API，用于实现 AI 与 Minecraft 游戏的交互。
# 插件启动时会自动加载此配置文件，并在技能意图识别时动态生成提示词。
#
# 【配置项说明】
# --------------------------------------------
# 每个 API 支持以下配置项：
#
# 1. id (必需)
#    - 类型：String
#    - 说明：API 的唯一标识符，用于在代码中查找和引用
#    - 示例："get_player_hand_item"
#    - 自定义：✅ 允许自定义，建议使用小写字母和下划线
#
# 2. display_name (必需)
#    - 类型：String
#    - 说明：API 的显示名称，用于向用户展示
#    - 示例："获取玩家主手物品"
#    - 自定义：✅ 允许自定义，建议简洁明了
#
# 3. description (必需)
#    - 类型：String
#    - 说明：API 的详细描述，会发送给 LLM 帮助其理解何时使用该 API
#    - 示例："获取玩家主要手持的物品信息，包括物品类型、数量、附魔等"
#    - 自定义：✅ 允许自定义，建议包含功能说明和使用场景
#
# 4. target_type (必需)
#    - 类型：String
#    - 说明：API 调用的目标对象类型
#    - 可选值："Player", "World", "Server"
#    - 示例："Player"
#    - 自定义：❌ 仅限预定义的三种类型
#
# 5. method_chain (可选)
#    - 类型：List<String>
#    - 说明：方法链，按顺序调用多个方法（接力调用）
#    - 示例：["getInventory", "getItemInMainHand"] → player.getInventory().getItemInMainHand()
#    - 注意：如果使用了 method_chain，则不应再使用 additional_methods
#    - 自定义：✅ 允许自定义，但必须确保方法在目标对象上存在
#
# 6. additional_methods (可选)
#    - 类型：Map<String, String>
#    - 说明：额外方法集合，key 是占位符名称，value 是方法名
#    - 示例：
#        health: "getHealth"
#        max_health: "getMaxHealth"
#      对应模板："生命值：{health}/{max_health}"
#    - 注意：如果使用了 additional_methods，则不应再使用 method_chain
#    - 自定义：✅ 允许自定义，但 key 必须在 result_template 中使用
#    - **重要特性**：支持简单链式调用！
#      * 语法：方法名中可以包含点号 "." 实现两层链式调用
#      * 示例："getLocation.getX" → player.getLocation().getX()
#      * 限制：最多支持 2 层链式（如 "a.b"），不支持 3 层+ 或带参数的方法
#      * 典型用途：获取复杂对象的属性（如 Location 的 x/y/z 坐标）
#
# 7. result_template (可选)
#    - 类型：String
#    - 说明：结果格式化模板，支持占位符替换
#    - 占位符格式：{key_name}，其中 key_name 必须是 additional_methods 中的 key
#    - 示例："等级：{level}, 经验进度：{exp_progress}"
#    - 自定义：✅ 允许自定义，但占位符必须与 additional_methods 的 key 一致
#
# 8. required_permission (可选)
#    - 类型：String
#    - 说明：执行此 API 所需的权限节点
#    - 示例："kilacraft.api.player.inventory"
#    - 自定义：✅ 允许自定义，用于细粒度权限控制
#
# 9. data_field (可选)
#    - 类型：String
#    - 说明：dataMap 中主结果字段的语义化名称，仅对 method_chain 模式有效
#    - 用途：对于返回简单标量（Number/Boolean/String/enum）的 method_chain API，
#           默认 dataMap 只有 raw_result 字段，LLM 难以引用。设置 data_field 后，
#           执行器会自动将主结果值以该字段名注入 dataMap
#    - 示例：data_field: "ping" → dataMap 中既有 raw_result，也有 ping=42
#    - 注意：additional_methods 模式无需此属性（框架已自动提取所有 key 到 dataMap）
#    - 注意：对 Collection 类型（如 getOnlinePlayers），自动注入元素数量而非集合本身
#    - 自定义：✅ 允许自定义，建议使用小写字母和下划线
#
# 【重要规则】
# --------------------------------------------
# 1. method_chain 和 additional_methods 二选一，不能同时使用
#    - method_chain：用于链式调用（接力）
#    - additional_methods：用于并行调用多个独立方法
#
# 2. result_template 中的占位符 {xxx} 必须与 additional_methods 的 key 完全一致
#    - ✅ 正确：additional_methods: {health: "getHealth"} → template: "{health}"
#    - ❌ 错误：additional_methods: {health: "getHealth"} → template: "{Health}"
#
# 3. target_type 只能是 "Player", "World", "Server" 之一
#    - Player：方法会在 org.bukkit.entity.Player 对象上调用
#    - World：方法会在 org.bukkit.World 对象上调用
#    - Server：方法会在 org.bukkit.Server 对象上调用
#
# 4. 所有方法名必须是 Bukkit API 中真实存在的
#    - 参考：https://hub.spigotmc.org/javadocs/bukkit/
#
# 5. method_chain 和 additional_methods 的使用场景区别（重要！）
#    - method_chain：
#      * 用途：链式调用（接力），返回复杂对象（如 ItemStack, Location 等）
#      * 示例：["getInventory", "getItemInMainHand"] → player.getInventory().getItemInMainHand()
#      * 格式化：不配置 result_template，由代码通过特殊类型处理（如 formatItemStack, formatLocation）
#      * 适用：当返回值是复杂对象，需要特殊格式化逻辑时
#
#    - additional_methods：
#      * 用途：并行调用多个独立方法，获取简单值（如 double, int, String 等）
#      * 示例：在 player 上分别调用 getHealth() 和 getMaxHealth()
#      * 格式化：必须配置 result_template，占位符与 additional_methods 的 key 一致
#      * 适用：当需要同时获取多个独立的属性值时
#      * **重要特性**：支持简单链式调用！
#        - 语法：方法名使用点号分隔，如 "getLocation.getX"
#        - 执行：player.getLocation().getX() → Double 值
#        - 典型应用：
#          · Location 坐标："getLocation.getX", "getLocation.getY", "getLocation.getZ"
#          · World 名称："getLocation.getWorld.getName"
#          · 其他属性：任何类似的 getter 链式调用
#
# 6. 配置选择建议
#    - 如果返回值是 ItemStack → 使用 method_chain + 代码特殊格式化
#    - 如果返回值是 Location → 使用 method_chain + 代码特殊格式化
#    - 如果返回值是 GameMode → 使用 method_chain + 代码特殊格式化
#    - 如果需要同时获取多个数值（如 health 和 maxHealth）→ 使用 additional_methods + result_template
#
# 【配置示例】
# --------------------------------------------
# player:
#   get_player_health:
#     id: "get_player_health"
#     display_name: "获取玩家生命值"
#     description: "获取玩家当前的生命值和最大生命值"
#     target_type: "Player"
#     additional_methods:
#       health: "getHealth"
#       max_health: "getMaxHealth"
#     result_template: "生命值：{health}/{max_health}"
#
# ============================================

# 全局配置信息
# 技能描述（用于 LLM 意图识别）
skill_description: "通用 Bukkit API 执行器，可根据用户意图调用各种原版功能，包括查询玩家状态、世界信息、服务器数据等。支持单意图查询和多步骤任务组合。"

hints:
  - "这些 API 都是只读的数据查询操作，不会改变游戏状态"
  - "当用户提到'我手上'、'我的位置'、'我的血量'等关键词，直接调用对应的 API"
  - "当用户使用综合类词语（如'安全吗'、'怎么样'、'什么情况'、'评估'、'全面'、'详细'）时，应该将问题拆解为多个维度的数据查询，每个维度调用对应API"
  - "不要因为没有'综合评估'或'安全分析'等一次性技能就放弃——只需为每个可查询的子维度调用对应API，系统会自动综合分析结果"
  - "可以自由组合多个 API 完成复杂查询，多步骤任务中可使用 {step_xxx.field} 引用前置步骤的结果数据"
  - "当用户说'全面一点'、'详细说说'、'更多信息'等扩展性表述时，应该增加步骤数量，覆盖更多相关维度，而不是只选一个核心API"

# 玩家相关 API (Bukkit 原生)
# ============================================

player:
  # ========================
  # 物品栏相关
  # ========================
  get_player_hand_item:
    id: "get_player_hand_item"
    display_name: "获取玩家主手物品"
    description: "【仅查询自己】获取玩家主要手持的物品信息，包括物品类型、数量、附魔、耐久等。手上拿的是什么、手里是什么东西、主手物品。返回的 data 中包含以下字段，可供后续步骤引用：item_type（物品类型）、item_name（物品名称）、item_amount（数量）、enchantments（附魔列表，Map<附魔名, 等级>）、damage（当前损伤值）、max_durability（最大耐久度）、remaining_durability（剩余耐久度）、unbreakable（是否不可破坏）、lore（物品描述列表）、attributes（属性修饰词）、custom_model_data（自定义模型数据）、item_flags（物品标志）。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getItemInMainHand"

  get_player_offhand_item:
    id: "get_player_offhand_item"
    display_name: "获取玩家副手物品"
    description: "【仅查询自己】获取玩家副手（盾牌槽）持有的物品。返回的 data 中包含以下字段，可供后续步骤引用：item_type（物品类型）、item_name（物品名称）、item_amount（数量）、enchantments（附魔列表）、damage（当前损伤值）、max_durability（最大耐久度）、remaining_durability（剩余耐久度）、lore（物品描述列表）。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getItemInOffHand"

  get_player_inventory_usage:
    id: "get_player_inventory_usage"
    display_name: "获取背包占用情况"
    description: "【仅查询自己】【极轻量】获取玩家背包（快捷栏+主背包，共36格）的占用格数和空格数。背包快满了、还有多少空位、背包用了多少格。返回的 data 中包含 item_count（已占用格数）和 empty_slots（空格数）字段，可供后续步骤引用。适合CUSTOM挂机任务轮询监控。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getStorageContents"

  get_player_inventory:
    id: "get_player_inventory"
    display_name: "获取背包物品摘要"
    description: "【仅查询自己】获取玩家背包（快捷栏+主背包，共36格）中所有物品的摘要列表（仅物品名称和数量，不含附魔/耐久等详情）。背包里有什么、有没有钻石、带了什么。返回的 data 中包含 item_count（已占用格数）、empty_slots（空格数）、items（物品摘要列表，每项包含 slot/item_name/item_type/item_amount）字段，可供后续步骤引用。如需物品详情请用 get_player_hand_item。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getStorageContents"

  get_player_ender_chest:
    id: "get_player_ender_chest"
    display_name: "获取末影箱物品摘要"
    description: "【仅查询自己】获取玩家末影箱中所有物品的摘要列表（仅物品名称和数量，不含附魔/耐久等详情）。末影箱里有什么、有没有钻石。返回的 data 中包含 item_count（已占用格数）、empty_slots（空格数）、items（物品摘要列表，每项包含 slot/item_name/item_type/item_amount）字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getEnderChest"
      - "getStorageContents"
  
  # ========================
  # 生命与状态
  # ========================
  get_player_health:
    id: "get_player_health"
    display_name: "获取玩家生命值"
    description: "【仅查询自己】获取玩家当前的生命值和最大生命值。血量、HP、健康值、还剩多少血。返回的 data 中包含 health 和 max_health 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      health: "getHealth"
      max_health: "getMaxHealth"
    result_template: "生命值：{health}/{max_health}"

  get_player_food:
    id: "get_player_food"
    display_name: "获取玩家饥饿值"
    description: "获取玩家当前的饥饿值（饱食度）和饱和度。饥饿度、饱食度、肚子饿不饿。返回的 data 中包含 food_level 和 saturation 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      food_level: "getFoodLevel"
      saturation: "getSaturation"
    result_template: "饱食度：{food_level}/20, 饱和度：{saturation}"
  
  get_player_oxygen:
    id: "get_player_oxygen"
    display_name: "获取玩家氧气值"
    description: "获取玩家当前的氧气值（水下呼吸时间），单位为 tick。返回的 data 中包含 remaining_air 和 maximum_air 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      remaining_air: "getRemainingAir"
      maximum_air: "getMaximumAir"
    result_template: "氧气：{remaining_air}/{maximum_air} tick"

  # ========================
  # 位置与移动
  # ========================
  get_player_location:
    id: "get_player_location"
    display_name: "获取玩家位置"
    description: "【仅查询自己】获取玩家在游戏中的坐标位置（X, Y, Z）和所在世界。我在哪、我在哪里、我的坐标、什么位置。返回的 data 中包含 x、y、z、yaw、pitch、world 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      x: "getLocation.getX"
      y: "getLocation.getY"
      z: "getLocation.getZ"
      world: "getLocation.getWorld.getName"
    result_template: "位置：X={x}, Y={y}, Z={z}, 世界={world}"
  
  get_player_eye_location:
    id: "get_player_eye_location"
    display_name: "获取玩家视线位置"
    description: "【仅查询自己】获取玩家眼睛（视线起点）的精确坐标位置，常用于判断视线方向或精确位置。返回的 data 中包含 x、y、z、yaw、pitch、world 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getEyeLocation"

  get_player_velocity:
    id: "get_player_velocity"
    display_name: "获取玩家速度向量"
    description: "获取玩家当前的移动速度向量（X, Y, Z 方向的速度）。返回的 data 中包含 x、y、z 字段（各方向速度分量），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getVelocity"
  
  # ========================
  # 游戏模式与飞行
  # ========================
  get_player_gamemode:
    id: "get_player_gamemode"
    display_name: "获取玩家游戏模式"
    description: "获取玩家当前的游戏模式（生存/创造/冒险/旁观）。什么模式、游戏模式、创造还是生存。返回的 data 中包含 game_mode 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "game_mode"
    method_chain:
      - "getGameMode"
  
  get_player_fly_status:
    id: "get_player_fly_status"
    display_name: "获取玩家飞行状态"
    description: "获取玩家是否允许飞行以及当前是否正在飞行。返回的 data 中包含 allow_flight 和 is_flying 字段（布尔），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      allow_flight: "getAllowFlight"
      is_flying: "isFlying"
    result_template: "允许飞行：{allow_flight}, 正在飞行：{is_flying}"
  
  get_player_fly_speed:
    id: "get_player_fly_speed"
    display_name: "获取玩家飞行速度"
    description: "获取玩家的飞行速度设置。返回的 data 中包含 fly_speed 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "fly_speed"
    method_chain:
      - "getFlySpeed"
  
  get_player_walk_speed:
    id: "get_player_walk_speed"
    display_name: "获取玩家行走速度"
    description: "获取玩家的行走速度设置。返回的 data 中包含 walk_speed 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "walk_speed"
    method_chain:
      - "getWalkSpeed"
  
  # ========================
  # 经验与等级
  # ========================
  get_player_exp:
    id: "get_player_exp"
    display_name: "获取玩家经验值"
    description: "获取玩家当前的经验值和等级。多少级了、等级多少、经验值。返回的 data 中包含 level 和 exp_progress 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      exp_progress: "getExp"
      level: "getLevel"
    result_template: "等级：{level}, 经验进度：{exp_progress}"
  
  get_player_exp_to_level:
    id: "get_player_exp_to_level"
    display_name: "获取升到下一级所需经验"
    description: "获取从当前经验进度升到下一级所需的经验值点数。注意：方法名容易混淆，实际返回的是到下一级的经验需求。返回的 data 中包含 exp_to_level 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "exp_to_level"
    method_chain:
      - "getExpToLevel"
  
  # ========================
  # 其他状态
  # ========================
  get_player_main_hand:
    id: "get_player_main_hand"
    display_name: "获取玩家主手偏好"
    description: "获取玩家的左右手偏好设置（左撇子/右撇子）。返回的 data 中包含 main_hand 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "main_hand"
    method_chain:
      - "getMainHand"
  
  get_player_ping:
    id: "get_player_ping"
    display_name: "获取玩家延迟"
    description: "获取玩家的网络延迟（ping），单位为毫秒。卡不卡、延迟多少、ping多少、网络好不好。返回的 data 中包含 ping 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "ping"
    method_chain:
      - "getPing"
  
  get_player_sleep_status:
    id: "get_player_sleep_status"
    display_name: "获取玩家睡眠状态"
    description: "获取玩家是否正在睡觉以及睡眠时间。返回的 data 中包含 is_sleeping（布尔）和 sleep_ticks 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      is_sleeping: "isSleeping"
      sleep_ticks: "getSleepTicks"
    result_template: "正在睡觉：{is_sleeping}, 睡眠时间：{sleep_ticks} tick"
  
  get_player_last_death:
    id: "get_player_last_death"
    display_name: "获取玩家上次死亡位置"
    description: "【仅查询自己】获取玩家上次死亡的位置坐标。死在哪了、上次死在哪、死亡地点在哪。返回的 data 中包含 x、y、z、yaw、pitch、world 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getLastDeathLocation"
  
  get_player_attack_cooldown:
    id: "get_player_attack_cooldown"
    display_name: "获取玩家攻击冷却"
    description: "获取玩家当前的攻击冷却进度（0-1，1表示冷却完成）。返回的 data 中包含 attack_cooldown 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "attack_cooldown"
    method_chain:
      - "getAttackCooldown"
  
  get_player_vehicle:
    id: "get_player_vehicle"
    display_name: "获取玩家骑乘状态"
    description: "获取玩家是否在载具中以及载具类型。返回的 data 中包含 in_vehicle 字段（布尔），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      in_vehicle: "isInsideVehicle"
    result_template: "是否在载具中：{in_vehicle}"
  
  get_player_fire_status:
    id: "get_player_fire_status"
    display_name: "获取玩家着火状态"
    description: "获取玩家当前是否着火，未着火时显示'未着火'，着火时显示剩余燃烧时间（秒）。返回的 data 中包含 fire_ticks 和 max_fire_ticks 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      fire_ticks: "getFireTicks"
      max_fire_ticks: "getMaxFireTicks"
    result_template: "着火时间：{fire_ticks}/{max_fire_ticks} tick"
  
  get_player_freeze_status:
    id: "get_player_freeze_status"
    display_name: "获取玩家冰冻状态"
    description: "获取玩家是否被冰冻（在细雪中）以及冰冻程度。返回的 data 中包含 is_frozen（布尔）、freeze_ticks 和 max_freeze_ticks 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      is_frozen: "isFrozen"
      freeze_ticks: "getFreezeTicks"
      max_freeze_ticks: "getMaxFreezeTicks"
    result_template: "是否冰冻：{is_frozen}, 冰冻程度：{freeze_ticks}/{max_freeze_ticks} tick"
  
  get_player_pose:
    id: "get_player_pose"
    display_name: "获取玩家姿势"
    description: "获取玩家当前的姿势状态（站立/蹲下/游泳/睡觉等）。返回的 data 中包含 pose 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "pose"
    method_chain:
      - "getPose"

  # ========================
  # 装备与效果
  # ========================
  get_player_armor:
    id: "get_player_armor"
    display_name: "获取玩家盔甲装备"
    description: "【仅查询自己】获取玩家当前穿戴的全套盔甲（头盔、胸甲、护腿、靴子）及其附魔和耐久度信息。穿什么装备、身上的盔甲、防具。返回的 data 中对每个非空槽位包含 helmet_name/helmet_type/helmet_amount、chestplate_name/chestplate_type/chestplate_amount、leggings_name/leggings_type/leggings_amount、boots_name/boots_type/boots_amount 字段，以及各槽位的 helmet_enchantments（附魔Map）、helmet_max_durability、helmet_remaining_durability 等附魔与耐久度字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getArmorContents"

  get_player_potion_effects:
    id: "get_player_potion_effects"
    display_name: "获取玩家药水效果"
    description: "【仅查询自己】获取玩家当前所有活跃的药水效果列表（包括效果名称、等级、剩余时间）。有什么buff、药水效果、中了什么效果。返回的 data 中包含 effects 字段（效果列表，每个效果包含 type、amplifier、duration_seconds 字段）和 effect_count 字段（效果数量），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    method_chain:
      - "getActivePotionEffects"

  get_player_target_block:
    id: "get_player_target_block"
    display_name: "获取玩家瞄准方块"
    description: "获取玩家准星当前瞄准的方块（最大距离 100 格）。看着什么方块、准星对着什么、面前的方块。返回的 data 中包含 block_type、x、y、z 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getTargetBlock"

  get_player_open_inventory:
    id: "get_player_open_inventory"
    display_name: "获取当前打开的界面"
    description: "获取玩家当前正在查看的界面类型（如箱子、熔炉、附魔台等）。打开了什么界面、正在看什么菜单。返回的 data 中包含 inventory_type 字段（界面类型），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getOpenInventory"
      - "getType"

  get_player_open_container:
    id: "get_player_open_container"
    display_name: "获取打开的容器内容"
    description: "【仅查询自己】获取玩家当前正在查看的容器（箱子、熔炉、附魔台、潜影盒等）中的所有物品摘要（仅物品名称和数量）。打开的箱子里有什么、容器里有什么东西。前提：玩家必须正在查看某个容器界面（get_player_open_inventory 返回非 PLAYER 时）。返回的 data 中包含 item_count（已占用格数）、empty_slots（空格数）、items（物品摘要列表，每项包含 slot/item_name/item_type/item_amount）、container_type（容器类型）和 container_title（容器标题）字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getOpenInventory"
      - "getTopInventory"
      - "getStorageContents"

  get_player_compass_target:
    id: "get_player_compass_target"
    display_name: "获取指南针目标"
    description: "【仅查询自己】获取玩家指南针指向的目标位置。指南针指向哪、指南针目标。返回的 data 中包含 x、y、z、world 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getCompassTarget"

  # ========================
  # 战斗与生存
  # ========================
  get_player_absorption:
    id: "get_player_absorption"
    display_name: "获取玩家吸收之心"
    description: "获取玩家当前的吸收生命值（吃金苹果/图腾后获得的额外黄心）。有没有金苹果效果、额外的心还有多少。返回的 data 中包含 absorption 字段（吸收血量），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "absorption"
    method_chain:
      - "getAbsorptionAmount"

  get_player_arrows_in_body:
    id: "get_player_arrows_in_body"
    display_name: "获取玩家身上的箭"
    description: "获取玩家身上插着的箭矢数量。身上有多少箭、被射了几箭。返回的 data 中包含 arrows_in_body 字段（箭矢数量），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "arrows_in_body"
    method_chain:
      - "getArrowsInBody"

  get_player_no_damage_ticks:
    id: "get_player_no_damage_ticks"
    display_name: "获取玩家无敌帧"
    description: "获取玩家当前的无敌帧（受伤后短暂免疫伤害的时间）。返回的 data 中包含 no_damage_ticks 和 max_no_damage_ticks 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      no_damage_ticks: "getNoDamageTicks"
      max_no_damage_ticks: "getMaximumNoDamageTicks"
    result_template: "无敌帧：{no_damage_ticks}/{max_no_damage_ticks} tick"

  get_player_fall_distance:
    id: "get_player_fall_distance"
    display_name: "获取玩家下落距离"
    description: "获取玩家当前的下落距离（格）。摔了多高、掉落距离。返回的 data 中包含 fall_distance 字段（下落格数），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "fall_distance"
    method_chain:
      - "getFallDistance"

  # ========================
  # 环境感知
  # ========================
  get_player_feet_block:
    id: "get_player_feet_block"
    display_name: "获取脚下方块"
    description: "获取玩家脚下踩着的方块类型和位置。站在什么上面、脚下是什么方块、下面是什么。返回的 data 中包含 block_type（方块类型）、x、y、z、world 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getLocation"
      - "getBlock"

  get_player_last_damage:
    id: "get_player_last_damage"
    display_name: "获取上次受伤原因"
    description: "获取玩家最近一次受到伤害的原因和伤害值。怎么死的、被什么打的、上次怎么受伤的、死因。返回的 data 中包含 damage_cause（伤害原因中文描述）、damage_amount（伤害值）字段；如果被实体攻击还包含 damager_type（攻击者类型）和 damager_name（攻击者名称）字段，可供后续步骤引用。注意：玩家未受过伤或服务器重启后可能返回空。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    method_chain:
      - "getLastDamageCause"

  # ========================
  # 动作状态
  # ========================
  get_player_sneak_status:
    id: "get_player_sneak_status"
    display_name: "获取玩家潜行状态"
    description: "获取玩家当前是否在潜行（Shift 键）。返回的 data 中包含 sneaking 字段（布尔），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "sneaking"
    method_chain:
      - "isSneaking"

  get_player_sprint_status:
    id: "get_player_sprint_status"
    display_name: "获取玩家冲刺状态"
    description: "获取玩家当前是否在冲刺（双击 W）。返回的 data 中包含 sprinting 字段（布尔），可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "sprinting"
    method_chain:
      - "isSprinting"

  # ========================
  # 客户端信息
  # ========================
  get_player_locale:
    id: "get_player_locale"
    display_name: "获取玩家客户端语言"
    description: "获取玩家客户端的语言设置（如 zh_CN、en_US）。返回的 data 中包含 locale 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "locale"
    method_chain:
      - "getLocale"

  get_player_display_name:
    id: "get_player_display_name"
    display_name: "获取玩家显示名称"
    description: "获取玩家的显示名称（可能包含前缀/后缀，不同于 getName）。返回的 data 中包含 display_name 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "display_name"
    method_chain:
      - "getDisplayName"

  # ========================
  # 重生点
  # ========================
  get_player_bed_spawn:
    id: "get_player_bed_spawn"
    display_name: "获取玩家床重生点"
    description: "【仅查询自己】获取玩家设置的床重生点位置（如果未设置返回 null）。返回的 data 中包含 x、y、z、world 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getBedSpawnLocation"

  # ========================
  # 经验详细
  # ========================
  get_player_total_exp:
    id: "get_player_total_exp"
    display_name: "获取玩家总经验值"
    description: "获取玩家从开始游戏至今累积的总经验值（区别于当前等级的经验进度）。返回的 data 中包含 total_exp 字段，可供后续步骤引用。"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "total_exp"
    method_chain:
      - "getTotalExperience"

# ============================================
# 世界相关 API (Bukkit 原生)
# ============================================

world:
  # ========================
  # 时间与天气
  # ========================
  get_world_time:
    id: "get_world_time"
    display_name: "获取世界时间"
    description: "获取当前世界的游戏时间（刻数），会被自动格式化为 HH:MM 格式。返回的 data 中包含 time_ticks 字段（当前世界刻数），可供后续步骤引用。几点了、什么时间、现在几点、游戏时间"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "time_ticks"
    method_chain:
      - "getTime"
  
  get_weather:
    id: "get_weather"
    display_name: "获取天气状况"
    description: "获取当前世界的天气（晴天/雨天/雷暴）。天气怎么样、下雨了吗、什么天气、是不是在打雷。返回的 data 中包含 has_storm 和 is_thundering 字段（布尔），可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      has_storm: "hasStorm"
      is_thundering: "isThundering"
    result_template: "天气：{weather_desc}"
  
  # ========================
  # 世界信息
  # ========================
  get_world_info:
    id: "get_world_info"
    display_name: "获取世界基本信息"
    description: "获取当前世界的名称、环境类型（主世界/下界/末地）和难度。什么世界、世界信息、世界类型。返回的 data 中包含 name、environment 和 difficulty 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      name: "getName"
      environment: "getEnvironment"
      difficulty: "getDifficulty"
    result_template: "世界：{name}, 类型：{environment}, 难度：{difficulty}"
  
  get_world_seed:
    id: "get_world_seed"
    display_name: "获取世界种子"
    description: "获取当前世界的种子值。返回的 data 中包含 seed 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "seed"
    method_chain:
      - "getSeed"
  
  get_world_spawn:
    id: "get_world_spawn"
    display_name: "获取世界出生点"
    description: "获取当前世界的出生点位置。返回的 data 中包含 x、y、z、world 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    method_chain:
      - "getSpawnLocation"

  get_world_border:
    id: "get_world_border"
    display_name: "获取世界边界"
    description: "获取当前世界的边界信息，包括边界大小和中心坐标。世界边界在哪、边界有多大、离边界多远。返回的 data 中包含 border_size（边界直径，单位格）、center_x（中心X坐标）、center_z（中心Z坐标）字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      border_size: "getWorldBorder.getSize"
      center_x: "getWorldBorder.getCenter.getX"
      center_z: "getWorldBorder.getCenter.getZ"
    result_template: "世界边界：大小={border_size}格，中心：X={center_x}, Z={center_z}"
  
  get_world_height_limit:
    id: "get_world_height_limit"
    display_name: "获取世界高度限制"
    description: "获取当前世界的最低和最高建筑高度。返回的 data 中包含 min_height 和 max_height 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      min_height: "getMinHeight"
      max_height: "getMaxHeight"
    result_template: "高度范围：{min_height} ~ {max_height}"
  
  # ========================
  # 生物生成规则
  # ========================
  get_world_spawn_rules:
    id: "get_world_spawn_rules"
    display_name: "获取世界生物生成规则"
    description: "获取当前世界是否允许生成怪物和动物。返回的 data 中包含 allow_monsters 和 allow_animals 字段（布尔），可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      allow_monsters: "getAllowMonsters"
      allow_animals: "getAllowAnimals"
    result_template: "允许怪物：{allow_monsters}, 允许动物：{allow_animals}"
  
  get_world_pvp:
    id: "get_world_pvp"
    display_name: "获取世界 PVP 设置"
    description: "获取当前世界是否允许 PVP。返回的 data 中包含 pvp 字段（布尔），可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "pvp"
    method_chain:
      - "getPVP"

  # ========================
  # 生物群系与环境
  # ========================
  get_world_biome:
    id: "get_world_biome"
    display_name: "获取世界生物群系"
    description: "获取指定坐标的生物群系类型（如平原、沙漠、森林等）。默认查询玩家当前位置。返回的 data 中包含 biome 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "biome"
    method_chain:
      - "getBiome"

  get_world_temperature:
    id: "get_world_temperature"
    display_name: "获取世界温度"
    description: "获取指定坐标的温度值（影响生物生成、降雪等）。默认查询玩家当前位置。返回的 data 中包含 temperature 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "temperature"
    method_chain:
      - "getTemperature"

  get_world_humidity:
    id: "get_world_humidity"
    display_name: "获取世界湿度"
    description: "获取指定坐标的湿度值（影响降雨概率）。默认查询玩家当前位置。返回的 data 中包含 humidity 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "humidity"
    method_chain:
      - "getHumidity"

  # ========================
  # 实体统计
  # ========================
  get_world_player_count:
    id: "get_world_player_count"
    display_name: "获取世界玩家数量"
    description: "获取当前世界中的玩家数量。返回的 data 中包含 player_count 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      player_count: "getPlayers.size"
    result_template: "当前世界玩家数量：{player_count}"

  get_world_living_entities:
    id: "get_world_living_entities"
    display_name: "获取世界生物数量"
    description: "获取当前世界中所有存活生物（包括玩家、怪物、动物等）的数量。有多少怪、怪物数量、动物数量、生物多少。返回的 data 中包含 living_entities 字段，可供后续步骤引用。"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      living_entities: "getLivingEntities.size"
    result_template: "当前世界生物数量：{living_entities}"

  get_world_entity_count:
