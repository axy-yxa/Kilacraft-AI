# ============================================
# Bukkit API 元数据配置文件
# ============================================
# 
# 【文件说明】
# 此文件定义了所有可被 LLM 调用的原版 Bukkit API，用于实现 AI 与 Minecraft 游戏的交互。
# 插件启动时会自动加载此配置文件，并在技能意图识别时动态生成提示词。
#
# 【配置项说明】
# --------------------------------------------
# 每个 API 支持以下配置项：
#
# 1. id (必需)
#    - 类型：String
#    - 说明：API 的唯一标识符，用于在代码中查找和引用
#    - 示例："get_player_hand_item"
#    - 自定义：✅ 允许自定义，建议使用小写字母和下划线
#
# 2. display_name (必需)
#    - 类型：String
#    - 说明：API 的显示名称，用于向用户展示
#    - 示例："获取玩家主手物品"
#    - 自定义：✅ 允许自定义，建议简洁明了
#
# 3. description (必需)
#    - 类型：String
#    - 说明：API 的详细描述，会发送给 LLM 帮助其理解何时使用该 API
#    - 示例："获取玩家主要手持的物品信息，包括物品类型、数量、附魔等"
#    - 自定义：✅ 允许自定义，建议包含功能说明和使用场景
#
# 4. usage_scenarios (可选)
#    - 类型：List<String>
#    - 说明：使用场景示例，帮助 LLM 更好地理解触发条件
#    - 示例：["当用户询问'我手上拿的是什么'", "看看我的物品"]
#    - 自定义：✅ 允许自定义，建议提供 2-5 个典型问法
#
# 5. target_type (必需)
#    - 类型：String
#    - 说明：API 调用的目标对象类型
#    - 可选值："Player", "World", "Server"
#    - 示例："Player"
#    - 自定义：❌ 仅限预定义的三种类型
#
# 6. method_chain (可选)
#    - 类型：List<String>
#    - 说明：方法链，按顺序调用多个方法（接力调用）
#    - 示例：["getInventory", "getItemInMainHand"] → player.getInventory().getItemInMainHand()
#    - 注意：如果使用了 method_chain，则不应再使用 additional_methods
#    - 自定义：✅ 允许自定义，但必须确保方法在目标对象上存在
#
# 7. additional_methods (可选)
#    - 类型：Map<String, String>
#    - 说明：额外方法集合，key 是占位符名称，value 是方法名
#    - 示例：
#        health: "getHealth"
#        max_health: "getMaxHealth"
#      对应模板："生命值：{health}/{max_health}"
#    - 注意：如果使用了 additional_methods，则不应再使用 method_chain
#    - 自定义：✅ 允许自定义，但 key 必须在 result_template 中使用
#    - **重要特性**：支持简单链式调用！
#      * 语法：方法名中可以包含点号 "." 实现两层链式调用
#      * 示例："getLocation.getX" → player.getLocation().getX()
#      * 限制：最多支持 2 层链式（如 "a.b"），不支持 3 层+ 或带参数的方法
#      * 典型用途：获取复杂对象的属性（如 Location 的 x/y/z 坐标）
#
# 8. result_template (可选)
#    - 类型：String
#    - 说明：结果格式化模板，支持占位符替换
#    - 占位符格式：{key_name}，其中 key_name 必须是 additional_methods 中的 key
#    - 示例："等级：{level}, 经验进度：{exp_progress}"
#    - 自定义：✅ 允许自定义，但占位符必须与 additional_methods 的 key 一致
#
# 9. required_permission (可选)
#    - 类型：String
#    - 说明：执行此 API 所需的权限节点
#    - 示例："kilacraft.api.player.inventory"
#    - 自定义：✅ 允许自定义，用于细粒度权限控制
#
# 【重要规则】
# --------------------------------------------
# 1. method_chain 和 additional_methods 二选一，不能同时使用
#    - method_chain：用于链式调用（接力）
#    - additional_methods：用于并行调用多个独立方法
#
# 2. result_template 中的占位符 {xxx} 必须与 additional_methods 的 key 完全一致
#    - ✅ 正确：additional_methods: {health: "getHealth"} → template: "{health}"
#    - ❌ 错误：additional_methods: {health: "getHealth"} → template: "{Health}"
#
# 3. target_type 只能是 "Player", "World", "Server" 之一
#    - Player：方法会在 org.bukkit.entity.Player 对象上调用
#    - World：方法会在 org.bukkit.World 对象上调用
#    - Server：方法会在 org.bukkit.Server 对象上调用
#
# 4. 所有方法名必须是 Bukkit API 中真实存在的
#    - 参考：https://hub.spigotmc.org/javadocs/bukkit/
#
# 5. method_chain 和 additional_methods 的使用场景区别（重要！）
#    - method_chain：
#      * 用途：链式调用（接力），返回复杂对象（如 ItemStack, Location 等）
#      * 示例：["getInventory", "getItemInMainHand"] → player.getInventory().getItemInMainHand()
#      * 格式化：不配置 result_template，由代码通过特殊类型处理（如 formatItemStack, formatLocation）
#      * 适用：当返回值是复杂对象，需要特殊格式化逻辑时
#
#    - additional_methods：
#      * 用途：并行调用多个独立方法，获取简单值（如 double, int, String 等）
#      * 示例：在 player 上分别调用 getHealth() 和 getMaxHealth()
#      * 格式化：必须配置 result_template，占位符与 additional_methods 的 key 一致
#      * 适用：当需要同时获取多个独立的属性值时
#      * **重要特性**：支持简单链式调用！
#        - 语法：方法名使用点号分隔，如 "getLocation.getX"
#        - 执行：player.getLocation().getX() → Double 值
#        - 典型应用：
#          · Location 坐标："getLocation.getX", "getLocation.getY", "getLocation.getZ"
#          · World 名称："getLocation.getWorld.getName"
#          · 其他属性：任何类似的 getter 链式调用
#
# 6. 配置选择建议
#    - 如果返回值是 ItemStack → 使用 method_chain + 代码特殊格式化
#    - 如果返回值是 Location → 使用 method_chain + 代码特殊格式化
#    - 如果返回值是 GameMode → 使用 method_chain + 代码特殊格式化
#    - 如果需要同时获取多个数值（如 health 和 maxHealth）→ 使用 additional_methods + result_template
#
# 【配置示例】
# --------------------------------------------
# player:
#   get_player_health:
#     id: "get_player_health"
#     display_name: "获取玩家生命值"
#     description: "获取玩家当前的生命值和最大生命值"
#     usage_scenarios:
#       - "我还有多少血"
#       - "我的生命值"
#     target_type: "Player"
#     additional_methods:
#       health: "getHealth"
#       max_health: "getMaxHealth"
#     result_template: "生命值：{health}/{max_health}"
#
# ============================================

# 全局配置信息
# 技能描述（用于 LLM 意图识别）
skill_description: "通用 Bukkit API 执行器，可根据用户意图调用各种原版功能，包括查询玩家状态、世界信息、服务器数据等。支持单意图查询和多步骤任务组合。"

hints:
  - "这些 API 都是只读操作，不会改变游戏状态"
  - "当用户提到'我手上'、'我的位置'、'我的血量'等关键词，直接调用对应的 API"
  - "API 调用失败时会自动回退到普通 AI 回答"
  - "可以组合多个 API 完成复杂查询，例如：先获取玩家位置，再查询世界信息"
  - "多步骤任务中可使用 {step_xxx.field} 引用前置步骤的结果数据"

# 玩家相关 API (Bukkit 原生)
# ============================================

player:
  # ========================
  # 物品栏相关
  # ========================
  get_player_hand_item:
    id: "get_player_hand_item"
    display_name: "获取玩家主手物品"
    description: "获取玩家主要手持的物品信息，包括物品类型、数量等。返回的 data 中包含 item_name 和 item_amount 字段，可供后续步骤引用。"
    usage_scenarios:
      - "当用户询问'我手上拿的是什么'"
      - "看看我的物品"
      - "主手有什么东西"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getItemInMainHand"
    
  get_player_offhand_item:
    id: "get_player_offhand_item"
    display_name: "获取玩家副手物品"
    description: "获取玩家副手（盾牌槽）持有的物品。返回的 data 中包含 item_name 和 item_amount 字段，可供后续步骤引用。"
    usage_scenarios:
      - "副手拿了什么"
      - "看看我的副手"
      - "我的盾牌是什么"
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getItemInOffHand"
  
  # ========================
  # 生命与状态
  # ========================
  get_player_health:
    id: "get_player_health"
    display_name: "获取玩家生命值"
    description: "获取玩家当前的生命值和最大生命值"
    usage_scenarios:
      - "我还有多少血"
      - "我的生命值"
      - "我还剩多少 HP"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      health: "getHealth"
      max_health: "getMaxHealth"
    result_template: "生命值：{health}/{max_health}"
    
  get_player_food:
    id: "get_player_food"
    display_name: "获取玩家饥饿值"
    description: "获取玩家当前的饥饿值（饱食度）和饱和度"
    usage_scenarios:
      - "我饿了"
      - "我还有多少饱食度"
      - "我的饥饿值"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      food_level: "getFoodLevel"
      saturation: "getSaturation"
    result_template: "饱食度：{food_level}/20, 饱和度：{saturation}"
  
  get_player_oxygen:
    id: "get_player_oxygen"
    display_name: "获取玩家氧气值"
    description: "获取玩家当前的氧气值（水下呼吸时间），单位为 tick"
    usage_scenarios:
      - "我能憋气多久"
      - "氧气还剩多少"
      - "我的氧气值"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      remaining_air: "getRemainingAir"
      maximum_air: "getMaximumAir"
    result_template: "氧气：{remaining_air}/{maximum_air} tick"
    
  # ========================
  # 位置与移动
  # ========================
  get_player_location:
    id: "get_player_location"
    display_name: "获取玩家位置"
    description: "获取玩家在游戏中的坐标位置（X, Y, Z）和所在世界。返回的 data 中包含 x、y、z、world 字段。"
    usage_scenarios:
      - "我在哪里"
      - "我的坐标是多少"
      - "看看我的位置"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      x: "getLocation.getX"
      y: "getLocation.getY"
      z: "getLocation.getZ"
      world: "getLocation.getWorld.getName"
    result_template: "位置：X={x}, Y={y}, Z={z}, 世界={world}"
  
  get_player_eye_location:
    id: "get_player_eye_location"
    display_name: "获取玩家眼睛位置"
    description: "获取玩家眼睛的精确位置（视线起点），常用于判断视线方向"
    usage_scenarios:
      - "我的视线在哪里"
      - "我眼睛的位置"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getEyeLocation"
    
  get_player_velocity:
    id: "get_player_velocity"
    display_name: "获取玩家速度向量"
    description: "获取玩家当前的移动速度向量（X, Y, Z 方向的速度）"
    usage_scenarios:
      - "我的速度是多少"
      - "我在往哪个方向移动"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getVelocity"
  
  # ========================
  # 游戏模式与飞行
  # ========================
  get_player_gamemode:
    id: "get_player_gamemode"
    display_name: "获取玩家游戏模式"
    description: "获取玩家当前的游戏模式（生存/创造/冒险/旁观）"
    usage_scenarios:
      - "我是什么模式"
      - "我的游戏模式"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getGameMode"
  
  get_player_fly_status:
    id: "get_player_fly_status"
    display_name: "获取玩家飞行状态"
    description: "获取玩家是否允许飞行以及当前是否正在飞行"
    usage_scenarios:
      - "我能飞吗"
      - "我现在在飞吗"
      - "我的飞行状态"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      allow_flight: "getAllowFlight"
      is_flying: "isFlying"
    result_template: "允许飞行：{allow_flight}, 正在飞行：{is_flying}"
  
  get_player_fly_speed:
    id: "get_player_fly_speed"
    display_name: "获取玩家飞行速度"
    description: "获取玩家的飞行速度设置"
    usage_scenarios:
      - "我的飞行速度是多少"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getFlySpeed"
  
  get_player_walk_speed:
    id: "get_player_walk_speed"
    display_name: "获取玩家行走速度"
    description: "获取玩家的行走速度设置"
    usage_scenarios:
      - "我的移动速度是多少"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getWalkSpeed"
  
  # ========================
  # 经验与等级
  # ========================
  get_player_exp:
    id: "get_player_exp"
    display_name: "获取玩家经验值"
    description: "获取玩家当前的经验值和等级"
    usage_scenarios:
      - "我有多少经验"
      - "我的等级是多少"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      exp_progress: "getExp"
      level: "getLevel"
    result_template: "等级：{level}, 经验进度：{exp_progress}"
  
  get_player_exp_to_level:
    id: "get_player_exp_to_level"
    display_name: "获取升级所需经验"
    description: "获取玩家升到下一级所需的总经验值"
    usage_scenarios:
      - "升到下一级需要多少经验"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    method_chain:
      - "getExpToLevel"
  
  # ========================
  # 其他状态
  # ========================
  get_player_main_hand:
    id: "get_player_main_hand"
    display_name: "获取玩家主手偏好"
    description: "获取玩家的左右手偏好设置（左撇子/右撇子）"
    usage_scenarios:
      - "我是左撇子还是右撇子"
      - "我的主手设置"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getMainHand"
  
  get_player_ping:
    id: "get_player_ping"
    display_name: "获取玩家延迟"
    description: "获取玩家的网络延迟（ping），单位为毫秒"
    usage_scenarios:
      - "我的延迟是多少"
      - "我卡不卡"
      - "我的 ping"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getPing"
  
  get_player_sleep_status:
    id: "get_player_sleep_status"
    display_name: "获取玩家睡眠状态"
    description: "获取玩家是否正在睡觉以及睡眠时间"
    usage_scenarios:
      - "我在睡觉吗"
      - "我的睡眠状态"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      is_sleeping: "isSleeping"
      sleep_ticks: "getSleepTicks"
    result_template: "正在睡觉：{is_sleeping}, 睡眠时间：{sleep_ticks} tick"
  
  get_player_last_death:
    id: "get_player_last_death"
    display_name: "获取玩家上次死亡位置"
    description: "获取玩家上次死亡的位置坐标"
    usage_scenarios:
      - "我上次死在哪里"
      - "我的死亡地点"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getLastDeathLocation"
  
  get_player_attack_cooldown:
    id: "get_player_attack_cooldown"
    display_name: "获取玩家攻击冷却"
    description: "获取玩家当前的攻击冷却进度（0-1，1表示冷却完成）"
    usage_scenarios:
      - "我的攻击冷却"
      - "我可以攻击了吗"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    method_chain:
      - "getAttackCooldown"
  
  get_player_vehicle:
    id: "get_player_vehicle"
    display_name: "获取玩家骑乘状态"
    description: "获取玩家是否在载具中以及载具类型"
    usage_scenarios:
      - "我在骑什么"
      - "我在坐船吗"
      - "我骑的是什么动物"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      in_vehicle: "isInsideVehicle"
    result_template: "是否在载具中：{in_vehicle}"
  
  get_player_fire_status:
    id: "get_player_fire_status"
    display_name: "获取玩家着火状态"
    description: "获取玩家当前是否着火以及剩余燃烧时间"
    usage_scenarios:
      - "我着火了吗"
      - "还要烧多久"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      fire_ticks: "getFireTicks"
      max_fire_ticks: "getMaxFireTicks"
    result_template: "着火时间：{fire_ticks}/{max_fire_ticks} tick"
  
  get_player_freeze_status:
    id: "get_player_freeze_status"
    display_name: "获取玩家冰冻状态"
    description: "获取玩家是否被冰冻（在细雪中）以及冰冻程度"
    usage_scenarios:
      - "我被冻住了吗"
      - "我的冰冻状态"
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      is_frozen: "isFrozen"
      freeze_ticks: "getFreezeTicks"
      max_freeze_ticks: "getMaxFreezeTicks"
    result_template: "是否冰冻：{is_frozen}, 冰冻程度：{freeze_ticks}/{max_freeze_ticks} tick"
  
  get_player_pose:
    id: "get_player_pose"
    display_name: "获取玩家姿势"
    description: "获取玩家当前的姿势状态（站立/蹲下/游泳/睡觉等）"
    usage_scenarios:
      - "我现在的姿势是什么"
      - "我在蹲着吗"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getPose"

# ============================================
# Paper 特有 API - 玩家相关
# ============================================
# 注意：以下 API 仅在 Paper 系服务端可用

paper_player:
  get_player_client_brand:
    id: "get_player_client_brand"
    display_name: "获取玩家客户端品牌"
    description: "获取玩家使用的客户端类型（vanilla/fabric/forge/neoforge 等）"
    usage_scenarios:
      - "你用什么客户端"
      - "是什么启动器"
      - "我的客户端类型"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getClientBrandName"
  
  get_player_client_view_distance:
    id: "get_player_client_view_distance"
    display_name: "获取玩家客户端视距"
    description: "获取玩家客户端设置的视距距离（区块数）"
    usage_scenarios:
      - "我的视距是多少"
      - "我能看多远"
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getClientViewDistance"
  
  get_player_idle_duration:
    id: "get_player_idle_duration"
    display_name: "获取玩家挂机时间"
