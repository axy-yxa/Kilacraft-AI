# ============================================
# Bukkit API Metadata Configuration (English)
# ============================================
# 
# [File Description]
# This file defines all vanilla Bukkit APIs that can be called by the LLM, enabling AI interaction with Minecraft.
# The plugin automatically loads this configuration at startup and dynamically generates prompts during skill intent recognition.
#
# [Configuration Items]
# --------------------------------------------
# Each API supports the following configuration items:
#
# 1. id (required)
#    - Type: String
#    - Description: Unique identifier for the API, used for lookup and reference in code
#    - Example: "get_player_hand_item"
#    - Customizable: Yes, recommended to use lowercase letters and underscores
#
# 2. display_name (required)
#    - Type: String
#    - Description: Display name of the API, shown to users
#    - Example: "Get Player Main Hand Item"
#    - Customizable: Yes, recommended to be concise and clear
#
# 3. description (required)
#    - Type: String
#    - Description: Detailed description of the API, sent to the LLM to help it understand when to use this API
#    - Example: "Get the item info in the player's main hand, including item type, amount, enchantments, etc."
#    - Customizable: Yes, recommended to include functionality description and usage scenarios
#
# 4. target_type (required)
#    - Type: String
#    - Description: Target object type for the API call
#    - Options: "Player", "World", "Server"
#    - Example: "Player"
#    - Customizable: No, limited to three predefined types
#
# 5. method_chain (optional)
#    - Type: List<String>
#    - Description: Method chain, calling multiple methods in sequence (relay calls)
#    - Example: ["getInventory", "getItemInMainHand"] → player.getInventory().getItemInMainHand()
#    - Note: If method_chain is used, additional_methods should not be used
#    - Customizable: Yes, but must ensure methods exist on the target object
#
# 6. additional_methods (optional)
#    - Type: Map<String, String>
#    - Description: Additional method collection, key is placeholder name, value is method name
#    - Example:
#        health: "getHealth"
#        max_health: "getMaxHealth"
#      Corresponding template: "Health: {health}/{max_health}"
#    - Note: If additional_methods is used, method_chain should not be used
#    - Customizable: Yes, but key must be used in result_template
#    - **Important feature**: Supports simple chained calls!
#      * Syntax: Method name can contain dot "." for two-level chaining
#      * Example: "getLocation.getX" → player.getLocation().getX()
#      * Limit: Max 2 levels (e.g. "a.b"), no 3+ levels or methods with parameters
#      * Typical use: Getting properties of complex objects (e.g. Location x/y/z coordinates)
#
# 7. result_template (optional)
#    - Type: String
#    - Description: Result formatting template, supports placeholder replacement
#    - Placeholder format: {key_name}, where key_name must be a key in additional_methods
#    - Example: "Level: {level}, Exp Progress: {exp_progress}"
#    - Customizable: Yes, but placeholders must match additional_methods keys
#
# 8. required_permission (optional)
#    - Type: String
#    - Description: Permission node required to execute this API
#    - Example: "kilacraft.api.player.inventory"
#    - Customizable: Yes, used for fine-grained permission control
#
# 9. data_field (optional)
#    - Type: String
#    - Description: Semantic name for the main result field in dataMap, only effective for method_chain mode
#    - Usage: For method_chain APIs returning simple scalars (Number/Boolean/String/enum),
#           by default dataMap only has raw_result field, making it hard for LLM to reference. Setting data_field
#           causes the executor to automatically inject the main result value under that field name into dataMap
#    - Example: data_field: "ping" → dataMap has both raw_result and ping=42
#    - Note: additional_methods mode doesn't need this (framework auto-extracts all keys to dataMap)
#    - Note: For Collection types (e.g. getOnlinePlayers), auto-injects element count instead of the collection itself
#    - Customizable: Yes, recommended to use lowercase letters and underscores

skill_description: "Query the player's current game state and environment. Supports querying: health and max health, hunger, oxygen, experience and level, game mode, flying/sneaking/sprinting/on-fire/freezing state, potion effects; main hand/offhand item, inventory contents, ender chest, armor; current coordinates and world, block at feet, target block, eye location, velocity, vehicle, compass target; biome, temperature, humidity, weather, time, world seed, world border; online player list, server version, MOTD, TPS.
Triggers: when the player asks about their own state or surroundings, e.g. 'where am I', 'what block am I standing on', 'what am I holding', 'how much health do I have', 'what time is it', 'how's the weather', 'how many players are online'.
Reverse boundary: NOT for modifying game state (giving items/teleporting/running commands go to the corresponding skills); NOT for querying lifetime cumulative stats (use BukkitStats skill)."

hints:
  - "These APIs are all read-only data query operations that do not change game state"
  - "When users mention keywords like 'in my hand', 'my location', 'my health', directly call the corresponding API"
  - "When users use comprehensive terms (e.g. 'is it safe', 'how am I doing', 'what's the situation', 'evaluate', 'comprehensive', 'detailed'), break down the question into multiple data dimensions, calling the corresponding API for each dimension"
  - "Don't give up just because there's no single 'comprehensive evaluation' or 'safety analysis' skill - just call the corresponding API for each queryable sub-dimension, the system will automatically synthesize the analysis results"
  - "You can freely combine multiple APIs for complex queries, in multi-step tasks you can use {step_xxx.field} to reference result data from previous steps"
  - "When users say 'be more comprehensive', 'tell me more details', 'more info' and other expansive expressions, you should increase the number of steps to cover more related dimensions, rather than just selecting one core API"

# Player-related APIs (Bukkit vanilla)
# ============================================

player:
  # ========================
  # Inventory
  # ========================
  get_player_hand_item:
    id: "get_player_hand_item"
    display_name: "Get Player Main Hand Item"
    description: "[Self Query Only] Get the item info in the player's main hand, including item type, amount, enchantments, durability, etc. What's in hand, what am I holding, main hand item. Returned data contains the following fields for subsequent step references: item_type (item type), item_name (item name), item_amount (amount), enchantments (enchantment list, Map<enchantment_name, level>), damage (current damage value), max_durability (max durability), remaining_durability (remaining durability), unbreakable (is unbreakable), lore (item description list), attributes (attribute modifiers), custom_model_data (custom model data), item_flags (item flags)."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getItemInMainHand"

  get_player_offhand_item:
    id: "get_player_offhand_item"
    display_name: "Get Player Offhand Item"
    description: "[Self Query Only] Get the item held in the player's offhand (shield slot). Returned data contains the following fields for subsequent step references: item_type (item type), item_name (item name), item_amount (amount), enchantments (enchantment list), damage (current damage value), max_durability (max durability), remaining_durability (remaining durability), lore (item description list)."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getItemInOffHand"

  get_player_inventory_usage:
    id: "get_player_inventory_usage"
    display_name: "Get Inventory Usage"
    description: "[Self Query Only][Very Lightweight] Get the used and empty slots in the player's inventory (hotbar + main inventory, 36 slots total). Inventory almost full, how many empty slots left, how many slots used. Returned data contains item_count (used slots) and empty_slots (empty slots) fields for subsequent step references. Suitable for polling monitoring in the player custom watch system (WatchSkill, polling mode)."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getStorageContents"

  get_player_inventory:
    id: "get_player_inventory"
    display_name: "Get Inventory Item Summary"
    description: "[Self Query Only] Get a summary list of all items in the player's inventory (hotbar + main inventory, 36 slots) - only item names and amounts, without enchantment/durability details. What's in my inventory, do I have diamonds, what am I carrying. Returned data contains item_count (used slots), empty_slots (empty slots), items (item summary list, each containing slot/item_name/item_type/item_amount) fields for subsequent step references. For item details use get_player_hand_item."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getStorageContents"

  get_player_ender_chest:
    id: "get_player_ender_chest"
    display_name: "Get Ender Chest Item Summary"
    description: "[Self Query Only] Get a summary list of all items in the player's ender chest - only item names and amounts, without enchantment/durability details. What's in my ender chest, do I have diamonds. Returned data contains item_count (used slots), empty_slots (empty slots), items (item summary list, each containing slot/item_name/item_type/item_amount) fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getEnderChest"
      - "getStorageContents"
  
  # ========================
  # Health & Status
  # ========================
  get_player_health:
    id: "get_player_health"
    display_name: "Get Player Health"
    description: "[Self Query Only] Get the player's current health and max health. HP, health value, how much health left. Returned data contains health and max_health fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      health: "getHealth"
      max_health: "getMaxHealth"
    result_template: "Health: {health}/{max_health}"

  get_player_food:
    id: "get_player_food"
    display_name: "Get Player Hunger"
    description: "Get the player's current hunger level (food level) and saturation. Hunger, food level, am I hungry. Returned data contains food_level and saturation fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      food_level: "getFoodLevel"
      saturation: "getSaturation"
    result_template: "Food: {food_level}/20, Saturation: {saturation}"
  
  get_player_oxygen:
    id: "get_player_oxygen"
    display_name: "Get Player Oxygen"
    description: "Get the player's current oxygen level (underwater breathing time), in ticks. Returned data contains remaining_air and maximum_air fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      remaining_air: "getRemainingAir"
      maximum_air: "getMaximumAir"
    result_template: "Oxygen: {remaining_air}/{maximum_air} tick"

  # ========================
  # Location & Movement
  # ========================
  get_player_location:
    id: "get_player_location"
    display_name: "Get Player Location"
    description: "[Self Query Only] Get the player's coordinates (X, Y, Z) and current world. Where am I, my coordinates, what position. Returned data contains x, y, z, world fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      x: "getLocation.getX"
      y: "getLocation.getY"
      z: "getLocation.getZ"
      world: "getLocation.getWorld.getName"
    result_template: "Location: X={x}, Y={y}, Z={z}, World={world}"
  
  get_player_eye_location:
    id: "get_player_eye_location"
    display_name: "Get Player Eye Location"
    description: "[Self Query Only] Get the precise coordinates of the player's eye position (viewpoint origin), commonly used for determining look direction or precise position. Returned data contains x, y, z, yaw, pitch, world fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getEyeLocation"

  get_player_velocity:
    id: "get_player_velocity"
    display_name: "Get Player Velocity"
    description: "Get the player's current movement velocity vector (X, Y, Z direction speeds). Returned data contains x, y, z fields (velocity components in each direction) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getVelocity"
  
  # ========================
  # Game Mode & Flight
  # ========================
  get_player_gamemode:
    id: "get_player_gamemode"
    display_name: "Get Player Game Mode"
    description: "Get the player's current game mode (Survival/Creative/Adventure/Spectator). What mode, game mode, creative or survival. Returned data contains game_mode field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "game_mode"
    method_chain:
      - "getGameMode"
  
  get_player_fly_status:
    id: "get_player_fly_status"
    display_name: "Get Player Flight Status"
    description: "Get whether the player is allowed to fly and whether currently flying. Returned data contains allow_flight and is_flying fields (boolean) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      allow_flight: "getAllowFlight"
      is_flying: "isFlying"
    result_template: "Allow Flight: {allow_flight}, Currently Flying: {is_flying}"
  
  get_player_fly_speed:
    id: "get_player_fly_speed"
    display_name: "Get Player Fly Speed"
    description: "Get the player's fly speed setting. Returned data contains fly_speed field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "fly_speed"
    method_chain:
      - "getFlySpeed"
  
  get_player_walk_speed:
    id: "get_player_walk_speed"
    display_name: "Get Player Walk Speed"
    description: "Get the player's walk speed setting. Returned data contains walk_speed field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "walk_speed"
    method_chain:
      - "getWalkSpeed"
  
  # ========================
  # Experience & Level
  # ========================
  get_player_exp:
    id: "get_player_exp"
    display_name: "Get Player Experience"
    description: "Get the player's current experience and level. What level, level, experience. Returned data contains level and exp_progress fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      exp_progress: "getExp"
      level: "getLevel"
    result_template: "Level: {level}, Exp Progress: {exp_progress}"
  
  get_player_exp_to_level:
    id: "get_player_exp_to_level"
    display_name: "Get Exp To Next Level"
    description: "Get the experience points needed to progress from current exp to the next level. Note: Method name is easily confused, it actually returns the exp requirement for the next level. Returned data contains exp_to_level field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "exp_to_level"
    method_chain:
      - "getExpToLevel"
  
  # ========================
  # Other Status
  # ========================
  get_player_main_hand:
    id: "get_player_main_hand"
    display_name: "Get Player Main Hand Preference"
    description: "Get the player's left/right hand preference setting (left-handed/right-handed). Returned data contains main_hand field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "main_hand"
    method_chain:
      - "getMainHand"
  
  get_player_ping:
    id: "get_player_ping"
    display_name: "Get Player Ping"
    description: "Get the player's network latency (ping) in milliseconds. Is it lagging, ping value, network quality. Returned data contains ping field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "ping"
    method_chain:
      - "getPing"
  
  get_player_sleep_status:
    id: "get_player_sleep_status"
    display_name: "Get Player Sleep Status"
    description: "Get whether the player is currently sleeping and sleep duration. Returned data contains is_sleeping (boolean) and sleep_ticks fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      is_sleeping: "isSleeping"
      sleep_ticks: "getSleepTicks"
    result_template: "Sleeping: {is_sleeping}, Sleep Time: {sleep_ticks} tick"
  
  get_player_last_death:
    id: "get_player_last_death"
    display_name: "Get Player Last Death Location"
    description: "[Self Query Only] Get the coordinates of the player's last death location. Where did I die, last death location, death point. Returned data contains x, y, z, yaw, pitch, world fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getLastDeathLocation"
  
  get_player_attack_cooldown:
    id: "get_player_attack_cooldown"
    display_name: "Get Player Attack Cooldown"
    description: "Get the player's current attack cooldown progress (0-1, 1 means cooldown complete). Returned data contains attack_cooldown field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "attack_cooldown"
    method_chain:
      - "getAttackCooldown"
  
  get_player_vehicle:
    id: "get_player_vehicle"
    display_name: "Get Player Vehicle Status"
    description: "Get whether the player is in a vehicle and the vehicle type. Returned data contains in_vehicle field (boolean) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    additional_methods:
      in_vehicle: "isInsideVehicle"
    result_template: "In Vehicle: {in_vehicle}"
  
  get_player_fire_status:
    id: "get_player_fire_status"
    display_name: "Get Player Fire Status"
    description: "Get whether the player is currently on fire, shows 'Not on fire' when not burning, shows remaining burn time (seconds) when burning. Returned data contains fire_ticks and max_fire_ticks fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      fire_ticks: "getFireTicks"
      max_fire_ticks: "getMaxFireTicks"
    result_template: "Fire Time: {fire_ticks}/{max_fire_ticks} tick"
  
  get_player_freeze_status:
    id: "get_player_freeze_status"
    display_name: "Get Player Freeze Status"
    description: "Get whether the player is frozen (in powder snow) and freeze degree. Returned data contains is_frozen (boolean), freeze_ticks and max_freeze_ticks fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      is_frozen: "isFrozen"
      freeze_ticks: "getFreezeTicks"
      max_freeze_ticks: "getMaxFreezeTicks"
    result_template: "Frozen: {is_frozen}, Freeze Level: {freeze_ticks}/{max_freeze_ticks} tick"
  
  get_player_pose:
    id: "get_player_pose"
    display_name: "Get Player Pose"
    description: "Get the player's current pose state (standing/crouching/swimming/sleeping, etc.). Returned data contains pose field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "pose"
    method_chain:
      - "getPose"

  # ========================
  # Equipment & Effects
  # ========================
  get_player_armor:
    id: "get_player_armor"
    display_name: "Get Player Armor Equipment"
    description: "[Self Query Only] Get the player's current full armor set (helmet, chestplate, leggings, boots) with enchantment and durability info. What armor am I wearing, my armor. Returned data for each non-empty slot contains helmet_name/helmet_type/helmet_amount, chestplate_name/chestplate_type/chestplate_amount, leggings_name/leggings_type/leggings_amount, boots_name/boots_type/boots_amount fields, plus each slot's helmet_enchantments (enchantment Map), helmet_max_durability, helmet_remaining_durability and other enchantment & durability fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getInventory"
      - "getArmorContents"

  get_player_potion_effects:
    id: "get_player_potion_effects"
    display_name: "Get Player Potion Effects"
    description: "[Self Query Only] Get a list of all active potion effects on the player (including effect name, level, remaining time). What buffs do I have, potion effects, what effects am I under. Returned data contains effects field (effect list, each effect containing type, amplifier, duration_seconds fields) and effect_count field (effect count) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    method_chain:
      - "getActivePotionEffects"

  get_player_target_block:
    id: "get_player_target_block"
    display_name: "Get Player Target Block"
    description: "Get the block the player's crosshair is currently aimed at (max distance 100 blocks). What block am I looking at, what's in front of me. Returned data contains block_type, x, y, z fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getTargetBlock"

  get_player_open_inventory:
    id: "get_player_open_inventory"
    display_name: "Get Currently Open Inventory"
    description: "Get the type of inventory the player is currently viewing (e.g. chest, furnace, enchanting table, etc.). What menu am I looking at, what interface is open. Returned data contains raw_result field (raw value of the inventory type enum) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getOpenInventory"
      - "getType"

  get_player_open_container:
    id: "get_player_open_container"
    display_name: "Get Open Container Contents"
    description: "[Self Query Only] Get a summary of all items in the container the player is currently viewing (chest, furnace, enchanting table, shulker box, etc.) - only item names and amounts. What's in the open chest, what's in the container. Prerequisite: player must be viewing a container interface (get_player_open_inventory returns non-PLAYER). Returned data contains item_count (used slots), empty_slots (empty slots), items (item summary list, each containing slot/item_name/item_type/item_amount), container_type (container type) and container_title (container title) fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.inventory"
    method_chain:
      - "getOpenInventory"
      - "getTopInventory"
      - "getStorageContents"

  get_player_compass_target:
    id: "get_player_compass_target"
    display_name: "Get Compass Target"
    description: "[Self Query Only] Get the target location the player's compass is pointing to. Where is the compass pointing, compass target. Returned data contains x, y, z, world fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getCompassTarget"

  # ========================
  # Combat & Survival
  # ========================
  get_player_absorption:
    id: "get_player_absorption"
    display_name: "Get Player Absorption Health"
    description: "Get the player's current absorption health (extra yellow hearts from golden apple/totem). Do I have golden apple effect, how many extra hearts left. Returned data contains absorption field (absorption health) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "absorption"
    method_chain:
      - "getAbsorptionAmount"

  get_player_arrows_in_body:
    id: "get_player_arrows_in_body"
    display_name: "Get Arrows In Player Body"
    description: "Get the number of arrows stuck in the player's body. How many arrows in me, how many times was I shot. Returned data contains arrows_in_body field (arrow count) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "arrows_in_body"
    method_chain:
      - "getArrowsInBody"

  get_player_no_damage_ticks:
    id: "get_player_no_damage_ticks"
    display_name: "Get Player Invulnerability Frames"
    description: "Get the player's current invulnerability frames (brief immunity after taking damage). Returned data contains no_damage_ticks and max_no_damage_ticks fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    additional_methods:
      no_damage_ticks: "getNoDamageTicks"
      max_no_damage_ticks: "getMaximumNoDamageTicks"
    result_template: "Invulnerability: {no_damage_ticks}/{max_no_damage_ticks} tick"

  get_player_fall_distance:
    id: "get_player_fall_distance"
    display_name: "Get Player Fall Distance"
    description: "Get the player's current fall distance (blocks). How high did I fall, fall distance. Returned data contains fall_distance field (fall distance in blocks) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "fall_distance"
    method_chain:
      - "getFallDistance"

  # ========================
  # Environment Awareness
  # ========================
  get_player_feet_block:
    id: "get_player_feet_block"
    display_name: "Get Block Under Feet"
    description: "Get the block type and position the player is standing on. What am I standing on, what's beneath my feet. Returned data contains block_type (block type), x, y, z, world fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getLocation"
      - "getBlock"

  get_player_last_damage:
    id: "get_player_last_damage"
    display_name: "Get Last Damage Cause"
    description: "Get the cause and amount of the player's most recent damage. How did I die, what hit me, what was the last damage cause, cause of death. Returned data contains damage_cause (damage cause description), damage_amount (damage value) fields; if attacked by an entity also contains damager_type (attacker type) and damager_name (attacker name) fields for subsequent step references. Note: May return empty if player hasn't taken damage or after server restart."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    method_chain:
      - "getLastDamageCause"

  # ========================
  # Action Status
  # ========================
  get_player_sneak_status:
    id: "get_player_sneak_status"
    display_name: "Get Player Sneak Status"
    description: "Get whether the player is currently sneaking (Shift key). Returned data contains sneaking field (boolean) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "sneaking"
    method_chain:
      - "isSneaking"

  get_player_sprint_status:
    id: "get_player_sprint_status"
    display_name: "Get Player Sprint Status"
    description: "Get whether the player is currently sprinting (double-tap W). Returned data contains sprinting field (boolean) for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "sprinting"
    method_chain:
      - "isSprinting"

  # ========================
  # Client Info
  # ========================
  get_player_locale:
    id: "get_player_locale"
    display_name: "Get Player Client Language"
    description: "Get the player's client language setting (e.g. zh_CN, en_US). Returned data contains locale field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "locale"
    method_chain:
      - "getLocale"

  get_player_display_name:
    id: "get_player_display_name"
    display_name: "Get Player Display Name"
    description: "Get the player's display name (may include prefix/suffix, different from getName). Returned data contains display_name field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    data_field: "display_name"
    method_chain:
      - "getDisplayName"

  # ========================
  # Spawn Point
  # ========================
  get_player_bed_spawn:
    id: "get_player_bed_spawn"
    display_name: "Get Player Bed Spawn Point"
    description: "[Self Query Only] Get the player's bed spawn point location (returns null if not set). Returned data contains x, y, z, world fields for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.info"
    method_chain:
      - "getBedSpawnLocation"

  # ========================
  # Experience Details
  # ========================
  get_player_total_exp:
    id: "get_player_total_exp"
    display_name: "Get Player Total Experience"
    description: "Get the player's cumulative total experience from the beginning (different from current level's exp progress). Returned data contains total_exp field for subsequent step references."
    target_type: "Player"
    required_permission: "kilacraft.api.player.status"
    data_field: "total_exp"
    method_chain:
      - "getTotalExperience"

# ============================================
# World-related APIs (Bukkit vanilla)
# ============================================

world:
  # ========================
  # Time & Weather
  # ========================
  get_world_time:
    id: "get_world_time"
    display_name: "Get World Time"
    description: "Get the current world's game time (ticks), automatically formatted to HH:MM format. Returned data contains time_ticks field (current world ticks) for subsequent step references. What time is it, game time, what's the time"
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "time_ticks"
    method_chain:
      - "getTime"
  
  get_weather:
    id: "get_weather"
    display_name: "Get Weather"
    description: "Get the current world's weather (clear/rain/thunderstorm). How's the weather, is it raining, what's the weather, is there thunder. Returned data contains has_storm and is_thundering fields (boolean) for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      has_storm: "hasStorm"
      is_thundering: "isThundering"
    result_template: "Weather: {weather_desc}"
  
  # ========================
  # World Info
  # ========================
  get_world_info:
    id: "get_world_info"
    display_name: "Get World Basic Info"
    description: "Get the current world's name, environment type (Overworld/Nether/End) and difficulty. What world, world info, world type. Returned data contains name, environment and difficulty fields for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      name: "getName"
      environment: "getEnvironment"
      difficulty: "getDifficulty"
    result_template: "World: {name}, Type: {environment}, Difficulty: {difficulty}"
  
  get_world_seed:
    id: "get_world_seed"
    display_name: "Get World Seed"
    description: "Get the current world's seed value. Returned data contains seed field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "seed"
    method_chain:
      - "getSeed"
  
  get_world_spawn:
    id: "get_world_spawn"
    display_name: "Get World Spawn Point"
    description: "Get the current world's spawn point location. Returned data contains x, y, z, world fields for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    method_chain:
      - "getSpawnLocation"

  get_world_border:
    id: "get_world_border"
    display_name: "Get World Border"
    description: "Get the current world's border info, including border size and center coordinates. Where's the world border, how big is the border, how far from the border. Returned data contains border_size (border diameter in blocks), center_x (center X coordinate), center_z (center Z coordinate) fields for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      border_size: "getWorldBorder.getSize"
      center_x: "getWorldBorder.getCenter.getX"
      center_z: "getWorldBorder.getCenter.getZ"
    result_template: "World Border: Size={border_size} blocks, Center: X={center_x}, Z={center_z}"
  
  get_world_height_limit:
    id: "get_world_height_limit"
    display_name: "Get World Height Limit"
    description: "Get the current world's minimum and maximum build height. Returned data contains min_height and max_height fields for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      min_height: "getMinHeight"
      max_height: "getMaxHeight"
    result_template: "Height Range: {min_height} ~ {max_height}"
  
  # ========================
  # Mob Spawn Rules
  # ========================
  get_world_spawn_rules:
    id: "get_world_spawn_rules"
    display_name: "Get World Spawn Rules"
    description: "Get whether the current world allows monster and animal spawning. Returned data contains allow_monsters and allow_animals fields (boolean) for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      allow_monsters: "getAllowMonsters"
      allow_animals: "getAllowAnimals"
    result_template: "Allow Monsters: {allow_monsters}, Allow Animals: {allow_animals}"
  
  get_world_pvp:
    id: "get_world_pvp"
    display_name: "Get World PVP Setting"
    description: "Get whether the current world allows PVP. Returned data contains pvp field (boolean) for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "pvp"
    method_chain:
      - "getPVP"

  # ========================
  # Biome & Environment
  # ========================
  get_world_biome:
    id: "get_world_biome"
    display_name: "Get World Biome"
    description: "Get the biome type at specified coordinates (e.g. plains, desert, forest, etc.). Default queries player's current position. Returned data contains biome field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "biome"
    method_chain:
      - "getBiome"

  get_world_temperature:
    id: "get_world_temperature"
    display_name: "Get World Temperature"
    description: "Get the temperature value at specified coordinates (affects mob spawning, snowfall, etc.). Default queries player's current position. Returned data contains temperature field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "temperature"
    method_chain:
      - "getTemperature"

  get_world_humidity:
    id: "get_world_humidity"
    display_name: "Get World Humidity"
    description: "Get the humidity value at specified coordinates (affects rainfall probability). Default queries player's current position. Returned data contains humidity field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "humidity"
    method_chain:
      - "getHumidity"

  # ========================
  # Entity Stats
  # ========================
  get_world_player_count:
    id: "get_world_player_count"
    display_name: "Get World Player Count"
    description: "Get the number of players in the current world. Returned data contains player_count field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      player_count: "getPlayers.size"
    result_template: "Current world player count: {player_count}"

  get_world_living_entities:
    id: "get_world_living_entities"
    display_name: "Get World Living Entity Count"
    description: "Get the number of all living entities (including players, monsters, animals, etc.) in the current world. How many mobs, monster count, animal count. Returned data contains living_entities field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      living_entities: "getLivingEntities.size"
    result_template: "Current world living entity count: {living_entities}"

  get_world_entity_count:
    id: "get_world_entity_count"
    display_name: "Get World Total Entity Count"
    description: "Get the total number of all entities (including mobs, items, minecarts, paintings, etc.) in the current world. Returned data contains entity_count field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    additional_methods:
      entity_count: "getEntities.size"
    result_template: "Current world total entity count: {entity_count}"

  # ========================
  # World Properties
  # ========================
  get_world_sea_level:
    id: "get_world_sea_level"
    display_name: "Get World Sea Level"
    description: "Get the current world's sea level height (Y coordinate). Returned data contains sea_level field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "sea_level"
    method_chain:
      - "getSeaLevel"

  # ========================
  # Weather Duration
  # ========================
  get_world_clear_weather_duration:
    id: "get_world_clear_weather_duration"
    display_name: "Get Clear Weather Remaining Time"
    description: "Get the remaining duration of current clear weather (ticks). Returned data contains clear_weather_duration field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "clear_weather_duration"
    method_chain:
      - "getClearWeatherDuration"

  get_world_thunder_duration:
    id: "get_world_thunder_duration"
    display_name: "Get Thunder Remaining Time"
    description: "Get the remaining duration of current thunderstorm (ticks). Returned data contains thunder_duration field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "thunder_duration"
    method_chain:
      - "getThunderDuration"

  # ========================
  # World Time Details
  # ========================
  get_world_full_time:
    id: "get_world_full_time"
    display_name: "Get World Full Time"
    description: "Get the world's total running time (ticks), unaffected by sleeping, continuously accumulating. Returned data contains full_time field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "full_time"
    method_chain:
      - "getFullTime"

  get_world_game_time:
    id: "get_world_game_time"
    display_name: "Get World Game Time"
    description: "Get the world's total game time since creation (ticks), unaffected by /time set. Returned data contains game_time field for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "game_time"
    method_chain:
      - "getGameTime"

  # ========================
  # Raid Events
  # ========================
  get_world_raids:
    id: "get_world_raids"
    display_name: "Get World Raid Events"
    description: "Get a list of all active raids in the current world. Returned data contains raids field (raid count) for subsequent step references."
    target_type: "World"
    required_permission: "kilacraft.api.world.info"
    data_field: "raids"
    method_chain:
      - "getRaids"

# ============================================
# Server-related APIs (Bukkit vanilla)
# ============================================

server:
  # ========================
  # Player Info
  # ========================
  get_online_players:
    id: "get_online_players"
    display_name: "Get Online Player Count"
    description: "Get the current online player count and list on the server. Returned data contains online_count field (online player count) and players field (comma-separated player names) for subsequent step references (e.g. {step_X.online_count}, {step_X.players})."
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    data_field: "online_count"
    method_chain:
      - "getOnlinePlayers"
  
  get_max_players:
    id: "get_max_players"
    display_name: "Get Max Players"
    description: "Get the maximum number of players allowed on the server. Max player capacity, server player limit. Returned data contains max_players field for subsequent step references."
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    data_field: "max_players"
    method_chain:
      - "getMaxPlayers"
  
  # ========================
  # Version Info
  # ========================
  get_server_version:
    id: "get_server_version"
    display_name: "Get Server Version"
    description: "Get the server's version info (Bukkit version and Minecraft version). What version is the server, version number, MC version. Returned data contains version and bukkit_version fields for subsequent step references."
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    additional_methods:
      version: "getVersion"
      bukkit_version: "getBukkitVersion"
    result_template: "Server Version: {version}, Bukkit Version: {bukkit_version}"
  
  get_server_motd:
    id: "get_server_motd"
    display_name: "Get Server MOTD"
    description: "Get the server's MOTD (Message of the Day / server description). Note: This API returns display text with formatting codes, only suitable for when users directly ask about the server description, not suitable as data source for multi-step tasks."
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    method_chain:
      - "getMotd"
  
  # ========================
  # World List
  # ========================
  get_server_worlds:
    id: "get_server_worlds"
    display_name: "Get Server World List"
    description: "Get all loaded worlds on the server. What worlds are there, world list, how many worlds does the server have. Returned data contains world_count field (world count) for subsequent step references."
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    data_field: "world_count"
    method_chain:
      - "getWorlds"
  
  # ========================
  # Server Settings
  # ========================
  get_server_settings:
    id: "get_server_settings"
    display_name: "Get Server Settings"
    description: "Get the server's basic settings (allow flight, Nether, End). Server settings, can we fly, is there a Nether/End. Returned data contains allow_flight, allow_nether and allow_end fields (boolean) for subsequent step references."
    target_type: "Server"
    required_permission: "kilacraft.api.server.info"
    additional_methods:
      allow_flight: "getAllowFlight"
      allow_nether: "getAllowNether"
      allow_end: "getAllowEnd"
    result_template: "Allow Flight: {allow_flight}, Allow Nether: {allow_nether}, Allow End: {allow_end}"
