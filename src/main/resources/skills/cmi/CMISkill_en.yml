# CMISkill Configuration (English)
# This file is auto-generated by the plugin and can be modified

# This description is sent to the LLM to help it understand when to use this skill
description: "Query CMI plugin information and execute teleport operations. Includes querying player home list, public warp list, enhanced player info (playtime, AFK status, vanish status), available kit list, online player status (with AFK/vanish), as well as teleporting to home, teleporting to warp, and sending teleport requests. Use this skill when users ask about homes, warp list, how long a player has been online, AFK status, vanish status, available kits, who is online, teleport to home, go to warp, or teleport to a player."

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  query_homes: "[Query Self Only] Query the player's own home list, returning each home's name and coordinates. Returned data contains homes field (home array, each home has home_name, world, x, y, z fields) and count field (home count), available for subsequent step references. Use when user asks 'my homes', 'what homes do I have', 'home list'"
  query_warps: "Query server public warp list, returning each warp's name and coordinates. Returned data contains warps field (warp array, each warp has warp_name, world, x, y, z fields) and count field (warp count), available for subsequent step references. Use when user asks 'warps', 'warp list', 'what warps are available'"
  query_player_info: "[Query Self Only] Query the player's own CMI enhanced info (playtime, AFK status, vanish status, flying status, game mode, etc.). Returned data contains name, display_name, playtime_formatted, afk (boolean), vanished (boolean), fly (boolean), game_mode fields, available for subsequent step references. Use when user asks 'how long have I been online', 'am I AFK', 'am I vanished'"
  query_kits: "Query server available kit list. Returned data contains kits field (kit name list) and count field (kit count), available for subsequent step references. Use when user asks 'what kits are available', 'gift pack list', 'kit list'"
  query_online_players: "Query online player list (CMI enhanced version, with AFK status and vanish status markers). Returned data contains players field (player list, each player has name, afk, vanished fields) and count field (player count), available for subsequent step references. Use when user asks 'who is online', 'online players', 'who is online and not AFK'"
  teleport_home: "Teleport to the player's own home. Required parameter: home_name (home name). **Prerequisite**: Must first call query_homes to get the home list, select the home_name field from returned data.homes as parameter. **Important**: If user doesn't specify a home name (e.g. 'go home', 'teleport to home'), must recognize as multi-step task (query_homes then teleport_home), absolutely cannot call as single intent. If user has only 1 home, auto-select; if multiple homes, list for user to choose. Requires kilacraft.cmi.teleport permission"
  teleport_to_warp: "Teleport to public warp. Required parameter: warp_name (warp name). **Prerequisite**: Must first call query_warps to get the warp list, select the warp_name field from returned data.warps as parameter. **Important**: If user doesn't specify a warp name (e.g. 'go to warp', 'teleport to any warp'), must recognize as multi-step task (query_warps then teleport_to_warp), absolutely cannot call as single intent. Requires kilacraft.cmi.teleport permission"
  send_tp_request: "Send a teleport request to target player (TPA), requires the other party's acceptance to teleport. Required parameter: target_player (target player name). Requires kilacraft.cmi.teleport permission"

# Additional hints (for guiding LLM to use skills correctly)
hints:
  - "**target_player general rule (extremely important)**: AFKTask's target_player parameter can be any player name (not limited to the player themselves). If the user says \"watch myself\", \"monitor me\" etc. self-monitoring needs, proactively recognize as self-monitoring scenario and fill in the current player name as target_player value in entities. If the user says \"watch xxx\" (xxx is another player name), extract the target player name and fill it in. If the user doesn't explicitly specify a target player but a player name is mentioned in context, prioritize using the player name from context"
  - "**Prerequisite query constraint and placeholder format (extremely important)**: teleport_home must first call query_homes, teleport_to_warp must first call query_warps. Do not fabricate home names or warp names. **Placeholder format explanation**: query_homes returns homes array, query_warps returns warps array. When referencing query results in multi-step tasks, must use array index placeholders, e.g. {step_X.homes[0].home_name} for first home's name, {step_X.warps[0].warp_name} for first warp's name. {step_X.home_name} or {step_X.warp_name} direct fields don't exist, writing that way will cause parsing failure. **When user specifies name**: When user explicitly specifies a concrete name (e.g. \"go to home named base\", \"go to skin station warp\"), should fill the name string directly into entities in single intent call (e.g. home_name=base), no placeholder or prerequisite query needed. When user doesn't specify a name (e.g. \"go home\", \"go to warp\", \"teleport to any\"), should output multi-step TaskPlan (query then teleport), using array index placeholders to reference query results."
  - "**Multi-step task mandatory rule**: teleport_home and teleport_to_warp home_name/warp_name parameters cannot be empty or null. When user doesn't specify a concrete name (e.g. 'go home', 'go to warp', 'teleport to any'), must output multi-step TaskPlan (query then teleport), forbidden to output single intent. Only when user explicitly specifies a name (e.g. 'go to home named base', 'go to skin station warp') can it be called as single intent directly. Query requires kilacraft.cmi.query permission, teleport requires kilacraft.cmi.teleport permission"
