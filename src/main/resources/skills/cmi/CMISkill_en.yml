# English version of CMISkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# CMI Plugin Integration Skill (CMISkill)
# Integrates read-only queries and teleport operations of the CMI plugin: home/warp/player-info/kit/online-player queries, and teleport to home/warp or send TPA.
# Dependency: third-party plugin CMI (isAvailable runtime gate).
# Permission: kilacraft.cmi.query as the base query permission (skill-level gate); teleport operations additionally require kilacraft.cmi.teleport (action-level gate).
# ═══════════════════════════════════════════════════════════

description: |
  CMI plugin integration skill (depends on the third-party CMI plugin). Queries: own home list (query_homes), public warp list (query_warps), self CMI-enhanced info incl. AFK/vanish/fly state (query_player_info), available kit list (query_kits), online players with AFK/vanish markers (query_online_players); Teleports: to own home (teleport_home), to a public warp (teleport_to_warp), TPA request to a target player (send_tp_request).
  Trigger: user says "what homes do I have", "home list", "warps", "how long have I been online", "am I AFK/vanished", "what kits are available", "who is online", "go home", "go to spawn", "tpa to Steve".
  Reverse boundary: only the above queries and teleports are covered. Other CMI features (waypoint setup, home management, permissions) are out of scope; management actions like "delete my home" or "set spawn" are not supported.

action_descriptions:
  query_homes: |
    Function: query the player's own home list, returning each home's name and coordinates.
    Parameters: none.
    Returned data fields: homes (array, each item has home_name/world/x/y/z), count (integer: home count).

  query_warps: |
    Function: query the server public warp list, returning each warp's name and coordinates.
    Parameters: none.
    Returned data fields: warps (array, each item has warp_name/world/x/y/z), count (integer: warp count).

  query_player_info: |
    Function: query the current player's own CMI enhanced info (playtime, AFK status, vanish status, flying status, game mode, etc.).
    Parameters: none.
    Returned data fields: name, display_name, playtime_ms (integer, milliseconds), afk (boolean), vanished (boolean), fly (boolean), game_mode.

  query_kits: |
    Function: query the server available kit list.
    Parameters: none.
    Returned data fields: kits (array, each item a kit name string), count (integer: kit count).

  query_online_players: |
    Function: query the online player list (CMI enhanced version, with AFK status and vanish status markers).
    Parameters: none.
    Returned data fields: players (array, each item has name/afk/vanished), count (integer: player count).

  teleport_home: |
    Function: teleport to the player's own home.
    Parameters:
      - home_name (required, string): home name.
    Precondition: when the player has not specified a home name, you MUST construct a multi-step task at the intent-recognition stage (step_0: query_homes to fetch the home list -> step_1: teleport_home, with home_name using the {step_0.homes[0].home_name} placeholder to reference the query result). home_name is always required — never leave it empty or set it to null.

  teleport_to_warp: |
    Function: teleport to a public warp.
    Parameters:
      - warp_name (required, string): warp name.
    Precondition: when the player has not specified a warp name, you MUST construct a multi-step task at the intent-recognition stage (step_0: query_warps to fetch the warp list -> step_1: teleport_to_warp, with warp_name using the {step_0.warps[0].warp_name} placeholder to reference the query result).

  send_tp_request: |
    Function: send a teleport request (TPA) to a target player; requires the other party's acceptance to teleport.
    Parameters:
      - target_player (required, player name): target player name.

hints:
  - |
    Prerequisite query constraint: teleport_home must first call query_homes; teleport_to_warp must first call query_warps. Do not fabricate home names or warp names.
  - |
    Placeholder format explanation: query_homes returns a homes array, query_warps returns a warps array. When referencing query results in multi-step tasks, use array index placeholders, e.g. {step_X.homes[0].home_name} for the first home's name, {step_X.warps[0].warp_name} for the first warp's name. {step_X.home_name} or {step_X.warp_name} direct fields do not exist; writing them that way will cause parsing failure.
  - |
    When user specifies a name: when the user explicitly specifies a concrete name (e.g. "go to home named base", "go to skin station warp"), fill the name string directly into entities in a single-intent call (e.g. home_name=base), with no placeholder or prerequisite query.
  - |
    Multi-step task mandatory rule: teleport_home and teleport_to_warp home_name/warp_name parameters cannot be empty or null. When the user does not specify a concrete name (e.g. "go home", "go to warp", "teleport to any"), you must output a multi-step TaskPlan (query then teleport); single intent is forbidden. Only when the user explicitly specifies a name (e.g. "go to home named base", "go to skin station warp") may it be called as a single intent directly.
  - |
    Teleport results handled by CMI: teleport_home, teleport_to_warp, and send_tp_request are executed via CMI commands and are protected by CMI's own permission, cooldown, and safety checks. The skill only initiates the request and does not guarantee the teleport will succeed.
