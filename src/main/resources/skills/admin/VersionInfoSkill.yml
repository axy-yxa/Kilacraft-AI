# ═══════════════════════════════════════════════════════════
# 插件版本信息查询（VersionInfoSkill）
# 查询当前运行的插件版本、是否有新版本、最新版本下载地址与完整更新日志。
# 数据源为 Gitee/GitHub Release API（按 i18n 语言选源），纯只读查询。
# 权限：ADMIN_INFO（管理员）。
# ═══════════════════════════════════════════════════════════

description: |
  查询本插件（Kilacraft-AI 自身）的版本信息与更新：检查是否有新版本、获取最新版本下载地址和完整更新日志、列出近期发布版本。
  当管理员提到「插件更新/新版本/最新版」「下载地址/下载链接」「更新日志/更新了什么/有什么新功能」「当前版本」时使用。
  仅查询本插件的版本与发布历史，不涉及 Minecraft 服务端或其它第三方插件的版本检查，也不负责下载或安装（下载地址在返回数据中给出，更新由服主自行操作）。

action_descriptions:
  check_update: |
    功能：检查当前版本是否有更新，并返回最新版本的完整信息。
    参数：无。
    返回 data 字段：current_version（当前版本）、latest_version（最新版本号）、has_update（布尔，是否有更新）、release_url（下载地址）、published_at（发布日期）、changelog（完整更新日志）。

  read_changelog: |
    功能：读取指定历史版本的完整更新日志。
    参数：
      - version（必填，字符串）：版本号，如 v2.1.2。
    返回 data 字段：version（版本号）、changelog（完整更新日志）、release_url（下载地址）、published_at（发布日期）。

  list_versions: |
    功能：列出近期发布的版本列表（版本号 + 标题 + 日期），用于了解发布历史。
    参数：
      - limit（可选，默认 10，数值（整数））：返回的版本数量。
    返回 data 字段：count（版本数量）、current_version（当前运行版本）、versions（数组，每项含 tag/name/date/is_current）。

hints:
  - |
    check_update 是默认首选动作，一次性覆盖「版本检查 + 下载地址 + 更新日志」三类需求；仅在管理员明确指定某个历史版本号时才用 read_changelog。

  - |
    list_versions 用于了解发布历史；拿到版本列表后，可用 read_changelog 查看某个版本的详细更新日志（先用 list_versions 取得 version，再用 version 调用 read_changelog）。
