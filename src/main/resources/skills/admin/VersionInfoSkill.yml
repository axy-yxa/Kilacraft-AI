# VersionInfoSkill 插件版本信息查询技能配置
# 此文件由插件自动生成，可根据需要修改
#
# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '插件版本信息与更新查询技能。查询当前运行的插件版本、是否有新版本、最新版本的下载地址和完整更新日志。适用于：检查是否有更新、查看版本更新了什么内容、获取下载地址/下载链接、了解新版本功能、列出近期版本。当管理员提到"插件更新""新版本""下载地址""下载链接""更新日志""更新了什么""有什么新功能""当前版本""最新版"时使用此技能。'

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  check_update: '检查当前版本是否有更新，并返回最新版本的完整信息，包括：当前版本号、最新版本号、发布日期、下载地址、完整更新日志。适合回答"有没有更新""最新版是什么""最新版更新了什么内容""下载地址是什么""下载链接""有什么新功能"。这是最常用的动作，当不确定用哪个时优先用这个。返回的 data 中包含 current_version（当前版本）、latest_version（最新版本号）、has_update（是否有更新）、release_url（下载地址）、published_at（发布日期）、changelog（完整更新日志）字段，可供后续步骤引用。'
  read_changelog: '读取指定历史版本的完整更新日志。参数：version（版本号，如 v2.1.2）。适合回答"某个旧版本更新了什么""v2.1.0 有什么内容"。如果用户没指定具体版本号而是问"最新版更新了什么"，应使用 check_update 而不是此动作。返回的 data 中包含 version（版本号）、changelog（完整更新日志）、release_url（下载地址）、published_at（发布日期）字段，可供后续步骤引用。'
  list_versions: '列出近期发布的所有版本列表（版本号+标题+日期）。参数：limit（可选，默认10）。适合回答"最近发布了哪些版本""有哪些版本"。拿到列表后可用 read_changelog 进一步查看某个版本的详细内容。返回的 data 中包含 count（版本数量）、current_version（当前运行版本）、versions（版本列表，每条含 tag/name/date/is_current）字段，可供后续步骤引用。'

# 额外提示信息
hints:
  - '当管理员问"有没有更新""最新版是什么""下载地址""下载链接""更新了什么""有什么新功能"时，使用 check_update——它返回最新版本的完整信息（含下载地址和更新日志），一次性满足这些需求'
  - 'check_update 是默认首选动作，覆盖了版本检查、下载地址、更新日志三个需求。只有当管理员明确指定某个历史版本号（如"v2.1.0 更新了什么"）时，才用 read_changelog'
  - '"给我下载地址""下载链接在哪""我要下载"这类请求也用 check_update，因为下载地址就在返回结果中'
  - 'list_versions 适合管理员想了解近期版本发布历史时使用；拿到版本列表后，可用 read_changelog 进一步查看某个版本的详细更新日志'
  - '本技能只能查看版本信息，不能帮忙下载或安装插件——更新是服主自行操作，下载地址已在返回数据中给出'
