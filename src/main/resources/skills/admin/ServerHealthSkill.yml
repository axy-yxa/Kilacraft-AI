# ═══════════════════════════════════════════════════════════
# 服务器健康管理技能（ServerHealthSkill）
# 查询历史性能告警、浏览和读取诊断报告。需 ADMIN_HEALTH 权限。
# ═══════════════════════════════════════════════════════════

description: |
  服务器历史性能告警与诊断报告查询技能，提供历史告警记录统计、诊断报告列表与诊断报告全文读取。
  当管理员问及「最近有没有性能告警/卡过几次」「某插件是否导致卡顿」「服务器最近性能怎么样」「列出/查看诊断报告」「对比两次报告」时使用。
  仅查询历史告警与已生成的诊断报告，不提供实时 TPS/MSPT 监控，也不能主动生成诊断报告。

action_descriptions:
  health_report: |
    功能：查询近期历史告警记录。
    参数：
      - plugin（可选，字符串）：按插件名过滤。
      - metric_type（可选，字符串，取值 tps/mspt/cpu）：按指标类型过滤。
      - time_range（可选，默认 7d，时间范围）：查询时间窗口。
    返回 data 字段：alert_count、plugins（已安装插件的告警次数映射，不含系统热点）、system（系统热点告警次数映射，如 Minecraft 内核、自身插件，通常无需关注）、daily_distribution（按天分布）、time_range、lowest_tps_detail（含 tps_1m/mspt_p95/cpu_process/alerts/top_hotspots）。

  list_reports: |
    功能：列出报告目录中的诊断报告文件。
    参数：
      - time_range（可选，默认 7d，时间范围）：时间过滤窗口。
      - mode（可选，字符串，取值 auto/manual）：按报告类型过滤。
      - limit（可选，默认 20，数值（整数））：最大返回数量。
    返回 data 字段：time_range、mode、count、reports（数组，每项含 filename/mode/timestamp/size/size_display）。

  read_report: |
    功能：读取指定诊断报告的完整内容。
    参数：
      - filename（可选，字符串）：报告文件名，优先使用。
      - index（可选，数值（整数））：按 mode 过滤后的序号（非全局序号）。
      - mode（可选，字符串，取值 auto/manual）：过滤报告类型。
    返回 data 字段：filename、mode、timestamp、size、content（报告全文，已剥离推理过程）。
    前置条件：filename 未知时建议先调用 list_reports 取得 filename，再用 filename 读取。

hints:
  - |
    多步骤排查历史性能问题：先用 health_report 统计告警、定位关联插件，再 list_reports + read_report 查看具体诊断报告的分析结论。

  - |
    read_report 返回的 content 含 §1（状态概览）、§2（插件分析）、§3（AI 诊断结论），这三节是回答服主历史性能问题的核心依据。

  - |
    对比多份报告时，各报告的采样条件（在线人数、玩家活动）可能不同，应偏向定性分析（如「改善明显」）而非精确量化（如「提升 42%」），并在回答中说明采样条件差异。
