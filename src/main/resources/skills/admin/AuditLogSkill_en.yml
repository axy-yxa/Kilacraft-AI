# AuditLogSkill Configuration (English)
# This file is auto-generated by the plugin and can be modified
#
# This description is sent to the LLM to help it understand when to use this skill
description: 'Skill execution audit log query skill. View AI skill execution records including who used which skill, parameters, success/failure status, and execution time. Supports filtering by player, skill name, time range, and success/failure. Admin only.'

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  query_logs: 'Query skill execution logs. Parameters: time_range (default 7d), player_name (player name filter), skill_name (skill name filter), limit (default 20). The returned data contains time_range, count, logs (log list with player_uuid/skill_name/action/success/result_message/execution_ms/source/created_at) fields, available for subsequent step references.'
  skill_stats: 'Query skill usage statistics ranking (grouped by skill name + action). Parameters: time_range (default 7d), limit (default 10). The returned data contains time_range, total_executions, total_success, total_fail, success_rate, stats (with skill_name/action/total_count/success_count/fail_count/avg_duration_ms) fields, available for subsequent step references.'
  error_logs: 'Query failed execution logs (success=false only). Parameters: time_range (default 7d), skill_name (skill name filter), limit (default 20). The returned data contains time_range, count, logs (failed log list, same structure as query_logs) fields, available for subsequent step references.'

# Additional hints
hints:
  - 'Use query_logs when server owner asks about "who used AI skills", "skill execution records", "AI usage logs"'
  - 'Use skill_stats when server owner asks about "AI skill rankings", "skill usage statistics", "which skill is used most"'
  - 'Use error_logs when server owner asks about "AI skill failures", "failed execution logs", "which skills had errors"'
