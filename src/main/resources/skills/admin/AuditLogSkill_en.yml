# English version of AuditLogSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Audit Log Query Skill (AuditLogSkill)
# View AI skill execution records (who ran which skill, parameters, success/failure, duration).
# Supports filtering by player/skill/time/success-failure. Admin only; depends on the kca_skill_log table.
# ═══════════════════════════════════════════════════════════

description: |
  Query server-wide AI skill execution records, including the executor, skill/action, parameters, success or failure, and execution duration.
  Use query_logs when an admin asks "who used AI skills / execution records / usage logs"; use skill_stats when they ask "skill rankings / usage statistics / which skill is used most"; use error_logs when they ask "skill failures / errors / what went wrong".
  Admin only; requests to query a single player's own records are out of scope.

action_descriptions:
  query_logs: |
    Function: Query AI skill execution logs by criteria and return the most recent matching records.
    Parameters:
      - time_range (optional, default 7d, time range, allowed values 1d/3d/7d/30d): Query window.
      - player_name (optional, player name): Filter by executor; must be an online or historical player name.
      - skill_name (optional, string): Filter by skill name (e.g. AuditLogSkill).
      - limit (optional, default 20, integer): Maximum number of records to return.
    Returns data fields: time_range, count, logs (array; each item has player_uuid/skill_name/action/success/result_message/execution_ms/source/created_at).

  skill_stats: |
    Function: Group execution counts and success rates by skill name + action, returning a ranking.
    Parameters:
      - time_range (optional, default 7d, time range, allowed values 1d/3d/7d/30d): Statistics window.
      - limit (optional, default 10, integer): Maximum number of groups to return.
    Returns data fields: time_range, total_executions, total_success, total_fail, success_rate, stats (array; each item has skill_name/action/total_count/success_count/fail_count/success_rate/avg_duration_ms).

  error_logs: |
    Function: Query only failed executions (success=false) for troubleshooting skill errors.
    Parameters:
      - time_range (optional, default 7d, time range, allowed values 1d/3d/7d/30d): Query window.
      - skill_name (optional, string): Filter by skill name.
      - limit (optional, default 20, integer): Maximum number of records to return.
    Returns data fields: time_range, count, logs (array; same structure as query_logs).

hints:
  - |
    time_range uses the 1d/3d/7d/30d shorthand; other formats are rejected as an invalid time range.

  - |
    When player_name cannot be resolved, query_logs returns "未找到玩家" (player not found) and does not fall back to a full-table scan on an empty UUID — when investigating "why no records", first confirm the player name spelling.

  - |
    Typical chain for troubleshooting skill errors: first use error_logs to see which skills failed and what the failure messages (result_message) are, then use skill_stats to check that skill's overall failure rate, to judge whether it is an isolated issue or a high-frequency one.
