# English version of VersionInfoSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Plugin Version Info Query (VersionInfoSkill)
# Query the currently running plugin version, whether a new version exists, the latest version download URL, and the full changelog.
# Data source is the Gitee/GitHub Release API (source selected by i18n language); read-only query only.
# Permission: ADMIN_INFO (admin).
# ═══════════════════════════════════════════════════════════

description: |
  Query version info and updates for this plugin (Kilacraft-AI itself): check whether a new version exists, get the latest version download URL and full changelog, and list recently released versions.
  Use when an admin mentions "plugin update / new version / latest version", "download URL / download link", "changelog / what changed / new features", or "current version".
  Only queries this plugin's version and release history; it does not check Minecraft server or third-party plugin versions, nor does it download or install (the download URL is provided in the returned data; updates are performed by the server owner).

action_descriptions:
  check_update: |
    Function: Check whether the current version has an update, and return the full latest version info.
    Parameters: none.
    Returns data fields: current_version (current version), latest_version (latest version number), has_update (boolean, whether an update exists), release_url (download URL), published_at (release date), changelog (full changelog).

  read_changelog: |
    Function: Read the full changelog of a specific historical version.
    Parameters:
      - version (required, string): Version number, e.g. v2.1.2.
    Returns data fields: version (version number), changelog (full changelog), release_url (download URL), published_at (release date).

  list_versions: |
    Function: List recently released versions (version + title + date), used to understand release history.
    Parameters:
      - limit (optional, default 10, integer): Number of versions to return.
    Returns data fields: count (number of versions), current_version (currently running version), versions (array, each with tag/name/date/is_current).

hints:
  - |
    check_update is the default first choice; it covers "version check + download URL + changelog" in one call. Only use read_changelog when the admin explicitly specifies a historical version number.

  - |
    list_versions is for understanding release history; after getting the version list, use read_changelog to view a specific version's detailed changelog (first call list_versions to obtain version, then call read_changelog with version).
