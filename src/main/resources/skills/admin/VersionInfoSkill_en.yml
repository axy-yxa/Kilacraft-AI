# VersionInfoSkill Plugin Version Info Query Skill Configuration (English)
# This file is auto-generated by the plugin and can be modified as needed
#
# This description is sent to the LLM to help it understand when to invoke this skill
description: 'Plugin version info and update query skill. Query the currently running plugin version, whether there is a new version, the latest version download URL and full changelog. Use when: checking for updates, viewing what a version updated, getting the download URL/download link, learning about new features, listing recent versions. When an admin mentions "plugin update", "new version", "download URL", "download link", "changelog", "what changed", "new features", "current version", "latest version", use this skill.'

# Action descriptions (Map format, key=action name, value=description)
action_descriptions:
  check_update: 'Check if the current version has an update, and return the full latest version info including: current version, latest version, release date, download URL, and full changelog. Suitable for "is there an update", "what is the latest version", "what did the latest version update", "what is the download URL", "download link", "what are the new features". This is the most common action — use it first when unsure which to pick. The returned data includes current_version, latest_version, has_update, release_url, published_at, and changelog fields, available for subsequent step references.'
  read_changelog: 'Read the full changelog of a specific historical version. Parameter: version (e.g. v2.1.2). Suitable for "what did a certain old version update", "what is in v2.1.0". If the user does not specify a specific version number and asks "what did the latest version update", use check_update instead of this action. The returned data includes version, changelog, release_url, and published_at fields, available for subsequent step references.'
  list_versions: 'List all recently released versions (version + title + date). Parameter: limit (optional, default 10). Suitable for "what versions were released recently", "what versions are available". After getting the list, use read_changelog to view a specific version detailed changelog. The returned data includes count, current_version, and versions (a list where each entry has tag/name/date/is_current) fields, available for subsequent step references.'

# Additional hints
hints:
  - 'When an admin asks "is there an update", "what is the latest version", "download URL", "download link", "what did it update", "what are the new features", use check_update — it returns the full latest version info (including download URL and changelog), satisfying all these needs in one call'
  - 'check_update is the default first choice, covering version check, download URL, and changelog. Only use read_changelog when the admin explicitly specifies a historical version number (e.g. "what did v2.1.0 update")'
  - 'Requests like "give me the download URL", "where is the download link", "I want to download" also use check_update, because the download URL is in the result'
  - 'list_versions is suitable when an admin wants to understand recent release history; after getting the version list, use read_changelog to view a specific version detailed changelog'
  - 'This skill can only view version info and cannot help download or install the plugin — updates are the server owner own operation, and the download URL is provided in the returned data'
