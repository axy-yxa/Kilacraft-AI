# English version of PlayerAnalysisSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Player Behavior Analysis Skill (PlayerAnalysisSkill)
# Online trends, active rankings, new player inflow, profile coverage, social graph insights. Requires ADMIN_PLAYER permission.
# ═══════════════════════════════════════════════════════════

description: |
  Player behavior analysis skill providing online player trends, active player rankings, new player inflow, AI profile analysis coverage, social graph insights, and specific player social relation queries.
  Use when an admin asks about "online trends / player login patterns", "active rankings / who is most active / most playtime", "new players / how many arrived recently", "profile coverage / how many players AI analyzed", "social situation / isolated players / social network", or "check a player's relations / a player's friend list".
  Admin only; queries aggregated statistics and historical relations, and does not provide single-player real-time location or single-player online status lookups.

action_descriptions:
  online_trend: |
    Function: Query online player count trends (LOGIN/LOGOUT events aggregated by time buckets).
    Parameters:
      - time_range (optional, default 7d, time range): Query window.
      - group_by (optional, default day, string, values hour/day): Aggregation granularity.
    Returns data fields: time_range, group_by, buckets (array, each with time_bucket/event_type/count), total_records.

  top_active: |
    Function: Query active player rankings (sorted by login count/playtime/recent login).
    Parameters:
      - time_range (optional, default 7d, time range): Query window.
      - order_by (optional, default login_count, string, values login_count/total_playtime/last_login): Sort field.
      - limit (optional, default 10, integer): Maximum return count.
    Returns data fields: time_range, order_by, players (array, each with uuid/name/login_count/total_playtime_hours/last_login), count.

  new_players: |
    Function: Query new player inflow statistics (PLAYER_FIRST_JOIN events aggregated by time).
    Parameters:
      - time_range (optional, default 7d, time range): Query window.
      - group_by (optional, default day, string, values hour/day): Aggregation granularity.
    Returns data fields: time_range, group_by, total_new_players, buckets (array, each with time_bucket/event_type/count).

  profile_coverage: |
    Function: Query AI profile analysis coverage.
    Parameters:
      - time_range (optional, default 7d, time range): Query window.
      - limit (optional, default 20, integer): Maximum return count for the list of players pending analysis.
    Returns data fields: total_players, analyzed_count, recently_analyzed, coverage_pct, pending_analysis (array, players pending analysis).

  social_insights: |
    Function: Query global social graph insights (network density, isolated player detection).
    Parameters:
      - limit (optional, default 10, integer): Maximum return count.
    Returns data fields: network_stats (with total_relations/avg_strength/isolated_count), top_connected (array), isolated_players (array).

  player_relations: |
    Function: Query a specific player's social relations.
    Parameters:
      - player_name (required, player name): Target player name.
      - limit (optional, default 20, integer): Maximum return count.
    Returns data fields: player_name, player_uuid, relation_count, relations (array, each with target_name/target_uuid/relation_type/strength/interaction_count/last_interaction).

hints:
  - |
    Comprehensive assessment of the player ecosystem (e.g. "how is the server's social atmosphere"): call online_trend, new_players, and social_insights in parallel; the system will synthesize a combined analysis from the multi-dimensional data.

  - |
    Global first, focused next: use social_insights for the overall network (who is active, who is isolated), then player_relations to focus on a specific player's relations. player_relations needs player_name; if social_insights' top_connected/isolated_players already contains the target player name, read it directly from conversation history into a single intent — no need to query again.

  - |
    Investigating "why isn't a profile generated": use profile_coverage to check coverage_pct and pending_analysis; uncovered players are listed in pending_analysis.
