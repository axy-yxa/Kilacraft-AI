# PlayerAnalysisSkill Configuration (English)
# This file is auto-generated by the plugin and can be modified
#
# This description is sent to the LLM to help it understand when to use this skill
description: 'Player behavior analysis skill providing online player trends, active player rankings, new player inflow, AI profile analysis coverage, social graph insights, and specific player social relation queries. Supports custom time ranges and aggregation granularity. Admin only.'

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  online_trend: 'Query online player count trends (LOGIN/LOGOUT events aggregated by time buckets). Parameters: time_range (default 7d), group_by (hour/day, default day). The returned data contains time_range, group_by, buckets (time bucket list with time_bucket/event_type/count), total_records fields, available for subsequent step references.'
  top_active: 'Query active player rankings (sorted by login count/playtime/recent login). Parameters: time_range (default 7d), order_by (default login_count), limit (default 10). The returned data contains time_range, order_by, players (with uuid/name/login_count/total_playtime_hours/last_login), count fields, available for subsequent step references.'
  new_players: 'Query new player inflow statistics (PLAYER_FIRST_JOIN events aggregated by time). Parameters: time_range (default 7d), group_by (hour/day, default day). The returned data contains time_range, group_by, total_new_players, buckets fields, available for subsequent step references.'
  profile_coverage: 'Query AI profile analysis coverage. Parameters: time_range (default 7d). The returned data contains total_players, analyzed_count, recently_analyzed, coverage_pct, pending_analysis (list of players pending analysis) fields, available for subsequent step references.'
  social_insights: 'Query social graph insights (network density, isolated player detection). Parameters: limit (default 10). The returned data contains network_stats (with total_relations/avg_strength/isolated_count), top_connected, isolated_players fields, available for subsequent step references.'
  player_relations: 'Query a specific player\'s social relations. Parameters: player_name (required, player name), limit (default 20). The returned data contains player_name, player_uuid, relation_count, relations (relation detail list, each with target_name/target_uuid/relation_type/strength/interaction_count/last_interaction) fields, available for subsequent step references.'

# Additional hints
hints:
  - 'Use online_trend when server owner asks about "online trends", "player login patterns", "logins in the past week"'
  - 'Use top_active when server owner asks about "active player rankings", "who is most active", "players with most playtime"'
  - 'Use new_players when server owner asks about "new players", "how many new players recently", "new registrations"'
  - 'Use profile_coverage when server owner asks about "profile coverage", "how many players AI analyzed", "profile quality"'
  - 'Use social_insights when server owner asks about "social situation", "isolated players", "player social network"'
  - 'Use player_relations when server owner asks about "check a player\'s social relations", "who is Steve friends with", "check Alex\'s friend list", "a specific player\'s social situation"'
