# English version of ServerHealthSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Server Health Management Skill (ServerHealthSkill)
# Query historical performance alerts, browse and read diagnostic reports. Requires ADMIN_HEALTH permission.
# ═══════════════════════════════════════════════════════════

description: |
  Server historical performance alert and diagnostic report query skill, providing historical alert record statistics, diagnostic report listing, and full diagnostic report reading.
  Use when an admin asks "any recent performance alerts / how many lag spikes", "is a plugin causing lag", "how is the server performance lately", "list / view diagnostic reports", or "compare two reports".
  Only queries historical alerts and already-generated diagnostic reports; it does not provide real-time TPS/MSPT monitoring and cannot generate diagnostic reports.

action_descriptions:
  health_report: |
    Function: Query recent historical alert records.
    Parameters:
      - plugin (optional, string): Filter by plugin name.
      - metric_type (optional, string, values tps/mspt/cpu): Filter by metric type.
      - time_range (optional, default 7d, time range): Query time window.
    Returns data fields: alert_count, plugins (installed plugin alert count map, excluding system hotspots), system (system hotspot alert count map, e.g. Minecraft core / self plugin, usually no action needed), daily_distribution (by day), time_range, lowest_tps_detail (with tps_1m/mspt_p95/cpu_process/alerts/top_hotspots).

  list_reports: |
    Function: List diagnostic report files in the report directory.
    Parameters:
      - time_range (optional, default 7d, time range): Time filter window.
      - mode (optional, string, values auto/manual): Filter by report type.
      - limit (optional, default 20, integer): Maximum return count.
    Returns data fields: time_range, mode, count, reports (array, each with filename/mode/timestamp/size/size_display).

  read_report: |
    Function: Read the full content of a specified diagnostic report.
    Parameters:
      - filename (optional, string): Report filename, preferred.
      - index (optional, integer): 1-based position after mode filtering (NOT global position).
      - mode (optional, string, values auto/manual): Filter report type.
    Returns data fields: filename, mode, timestamp, size, content (full report text, reasoning process stripped).
    Precondition: When filename is unknown, prefer list_reports first to obtain filename, then read by filename.

hints:
  - |
    Multi-step troubleshooting of historical performance: first health_report to summarize alerts and locate associated plugins, then list_reports + read_report to review the analysis conclusions in specific reports.

  - |
    read_report content contains §1 (Status Overview), §2 (Plugin Analysis), §3 (AI Diagnosis Conclusion); these three sections are the core basis for answering server owners' historical performance questions.

  - |
    When comparing multiple reports, sampling conditions (online players, activity) may differ; prefer qualitative analysis (e.g. "clearly improved") over precise quantification (e.g. "improved 42%"), and mention sampling condition differences in the response.
