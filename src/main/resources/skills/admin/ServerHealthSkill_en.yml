# ServerHealthSkill Health Management Skill Configuration (English)
# This file is auto-generated by the plugin and can be modified
#
# This description is sent to the LLM to help it understand when to use this skill
description: 'Server health management skill providing historical alert queries and diagnostic report reading. Supports alert statistics, report browsing, and full report content reading.'

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  health_report: 'Query recent historical alert records. Supports plugin (plugin name filter) and metric_type (metric type: tps/mspt/cpu) parameters. Returns data containing alert_count, plugins (plugin alert count map), daily_distribution (by day), time_range, lowest_tps_detail (with tps_1m/mspt_p95/cpu_process/alerts/top_hotspots) fields, available for subsequent step references.'
  list_reports: 'List diagnostic report files in the report directory. Parameters: time_range (default 7d), mode (auto/manual), limit (default 20). Returns data containing count and reports (with filename/mode/timestamp/size/size_display per entry). Use with read_report.'
  read_report: 'Read the full content of a specified diagnostic report. Parameters: filename (report filename) or index (position in list_reports result, 1-based). Returns data containing content (full report text, reasoning process stripped), mode, timestamp. Use report content for in-depth analysis.'

# Additional hints
hints:
  - 'Use health_report when the server owner says "any recent performance alerts", "how many lag spikes in the past few days", "is a certain plugin causing lag", "how is the server performance recently"'
  - 'Use list_reports when the server owner says "list recent reports", "show diagnostic reports"'
  - 'When the server owner says "check the last report", "compare these two reports", first list_reports then read_report'
  - 'read_report content contains sections §1 (Server Status Overview), §2 (Plugin Performance Analysis), §3 (AI Diagnosis Conclusion)'
  - 'When comparing multiple reports, note that sampling conditions (online players, activity) may differ; prefer qualitative analysis over precise quantification and mention sampling condition differences in the response'
