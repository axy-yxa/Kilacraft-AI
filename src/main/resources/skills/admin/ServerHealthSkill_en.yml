# ServerHealthSkill Health Management Skill Configuration (English)
# This file is auto-generated by the plugin and can be modified
#
# This description is sent to the LLM to help it understand when to use this skill
description: 'Server health monitoring skill. Supports querying historical performance alert records (health_report), browsing diagnostic report file lists (list_reports), and reading full diagnostic report content (read_report). Applicable to server performance troubleshooting, historical alert statistical analysis, and diagnostic report review and comparison.'

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  health_report: 'Query recent historical alert records. Supports plugin (plugin name filter) and metric_type (metric type: tps/mspt/cpu) parameters. Returns data containing alert_count, plugins (installed plugin alert count map, excluding system hotspots), system (system hotspot alert count map, e.g. Minecraft core / self plugin, usually no action needed), daily_distribution (by day), time_range, lowest_tps_detail (with tps_1m/mspt_p95/cpu_process/alerts/top_hotspots) fields, available for subsequent step references.'
  list_reports: 'List diagnostic report files in the report directory. Parameters: time_range (default 7d), mode (auto/manual), limit (default 20). Returns data containing count and reports (with filename/mode/timestamp/size/size_display per entry). Use with read_report.'
  read_report: 'Read the full content of a specified diagnostic report. Parameters: filename (report filename, preferred) or index (1-based position after mode filtering, NOT global position). Supports mode parameter (auto/manual) to filter report type. Returns data containing content (full report text, reasoning process stripped), mode, timestamp. In multi-step tasks, prefer using list_reports first to get filename, then read by filename.'

# Additional hints
hints:
  - 'health_report is for querying historical performance alert records. Use when the server owner says "any recent performance alerts", "how many lag spikes in the past few days", "is a certain plugin causing lag", "how is the server performance recently"'
  - 'list_reports is for listing saved diagnostic report files on the server. Use when the server owner says "list recent reports", "show diagnostic reports", "list reports", "report list"'
  - 'read_report is for reading the full content of a specific diagnostic report. Parameters: filename (preferred) or index (1-based after mode filtering, NOT global index). Supports mode parameter (auto/manual). When the server owner says "check the last report", "compare these two reports", you must first list_reports to get the list, then use filename parameter to read specific reports (multi-step task)'
  - 'When the server owner says "has MythicMobs been causing performance issues this month", first health_report to check alert summary and associated plugins, then list_reports + read_report to review analysis conclusions in specific reports'
  - 'read_report content contains sections §1 (Server Status Overview), §2 (Plugin Performance Analysis), §3 (AI Diagnosis Conclusion), which can be used to answer server owner questions about historical performance'
  - 'When comparing multiple reports, note that sampling conditions (online players, activity) may differ; prefer qualitative analysis over precise quantification and mention sampling condition differences in the response'
