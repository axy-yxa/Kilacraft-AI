# CommandSkill - 命令执行技能配置
# 以玩家身份执行服务器命令，权限边界等于玩家自身的权限
# 需要在 config.yml 中设置 command_skill.enabled: true 才会生效

description: '命令执行技能：以玩家身份执行服务器命令。当用户的意图无法被任何其他技能覆盖时，可以尝试通过执行服务器命令来完成。例如：用户说"把我传送回死亡地点"且没有专门的传送技能时，可以使用 /back 命令。AI 以玩家身份执行命令，受服务器权限系统约束——玩家没有的权限，AI 也没有。'

action_descriptions:
  execute_command: '以玩家身份执行一条服务器命令。需要参数：command（要执行的命令，不含前导 /）。命令将以玩家身份执行，受服务器权限系统约束。适用场景：用户明确要求执行某个命令，或其他技能无法覆盖用户需求时，可以尝试用命令兜底。'

response_messages:
  execute_success: '已为你执行命令: /{command}'
  execute_failure: '命令执行失败，可能没有权限或命令不存在: /{command}'

hints:
  - '**安全机制**：AI 以玩家身份执行命令（Bukkit.dispatchCommand），不绕过任何服务器权限。玩家没有的命令权限，AI 代执行也会被服务器拒绝。所有安全机制（权限检查、冷却、安全区域等）均正常生效。'
  - '**使用场景**：当用户的需求无法被任何专用技能覆盖时（如"传送回死亡地点"→/back、"送我回主城"→/spawn），可以通过此技能尝试执行对应命令。如果用户明确要求执行某个命令，则直接执行。'
  - '**参数格式**：command 参数填入完整命令（不含前导 /），例如"back"、"spawn"、"home 家名"。LLM 不应自行构造复杂命令参数，应直接从用户消息中提取命令内容。'
  - '**兜底原则**：此技能是最后手段。如果有更专用的技能可以完成用户需求（如 cmi 的 teleport_home、teleport_to_warp），应优先使用专用技能。只有专用技能无法覆盖时才使用此技能。'
