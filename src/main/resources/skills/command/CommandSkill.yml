# CommandSkill - 命令执行技能配置
# 以玩家身份执行服务器命令，权限边界等于玩家自身的权限
# 需要在 config.yml 中设置 command_skill.enabled: true 才会生效

description: '命令执行技能：以玩家身份执行服务器命令，改变游戏状态或触发游戏操作。当用户描述的需求是一个【可执行的操作】而非【信息咨询】时，可匹配此技能。不适用于咨询类、建议类、攻略推荐类、问答类问题。'

action_descriptions:
  execute_command: '以玩家身份执行一条服务器命令。需要参数：command（要执行的命令，不含前导 /）。命令将以玩家身份执行，受服务器权限系统约束。匹配条件：用户的需求是执行一个可改变游戏状态的操作，而非获取信息或寻求建议。'

hints:
  - '**优先级**：此技能是兜底手段。如果有专用技能可以完成用户需求，必须优先使用专用技能，只有专用技能无法覆盖时才使用此技能。'
  - '**安全机制**：AI 以玩家身份执行命令，不绕过任何服务器权限。玩家没有的命令权限，AI 代执行也会被服务器拒绝。'
  - '**参数格式**：command 参数填入完整命令（不含前导 /），LLM 应从用户消息中提取命令及参数。'
