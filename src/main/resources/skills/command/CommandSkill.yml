# CommandSkill - 命令执行技能配置
# 以玩家身份执行服务器命令，权限边界等于玩家自身的权限
# 需要在 config.yml 中设置 command_skill.enabled: true 才会生效

description: '命令执行技能：以玩家身份执行任意服务器命令（兜底技能）。当没有专用技能可以完成用户需求时，通过此技能执行对应命令。权限边界等于玩家自身的权限。'

action_descriptions:
  execute_command: '以玩家身份执行一条服务器命令（兜底）。需要参数：command（要执行的命令，不含前导 /）。命令将以玩家身份执行，受服务器权限系统约束。'

response_messages:
  execute_success: '已为你执行命令: /{command}'
  execute_failure: '命令执行失败，可能没有权限或命令不存在: /{command}'

hints:
  - '**优先级**：此技能是兜底手段。如果有专用技能可以完成用户需求，必须优先使用专用技能，只有专用技能无法覆盖时才使用此技能。'
  - '**安全机制**：AI 以玩家身份执行命令，不绕过任何服务器权限。玩家没有的命令权限，AI 代执行也会被服务器拒绝。'
  - '**参数格式**：command 参数填入完整命令（不含前导 /），LLM 应从用户消息中提取命令及参数。'
