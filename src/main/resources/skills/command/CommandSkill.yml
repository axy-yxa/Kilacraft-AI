# ═══════════════════════════════════════════════════════════
# 命令执行技能（CommandSkill）
# 以玩家身份执行服务器命令，权限边界等于玩家自身的权限（Bukkit 权限系统是最终守卫）。
# 可执行命令清单见 commands/ 目录的命令文档（启动时释放预置模板，服主可补充第三方命令）。
# ═══════════════════════════════════════════════════════════

description: |
  命令执行技能：以玩家身份执行服务器命令，改变游戏状态或触发游戏操作，如「传送到出生点」「领取每日礼包」「打开服务器菜单」。
  触发场景：用户请求是一个可执行的游戏操作（改变游戏状态或触发游戏动作），且没有其他技能更匹配时使用。玩家明确要求执行某条命令时也使用本技能。
  关键限制：本技能执行命令后只返回成功或失败，不返回命令的输出内容，执行结果无法被多步骤任务的后续步骤引用。当用户需求在多步骤任务中需要作为前置数据源时，必须使用能返回结构化数据的专用技能而非本技能。
  不适用于：纯数据查询（用 bukkit 系列）、咨询建议攻略。

action_descriptions:
  execute_command: |
    功能：以玩家身份执行一条服务器命令。
    参数：
      - command（必填，命令文本，不含前导 /）：要执行的完整命令，优先从【可执行命令列表】中选择，如 spawn、kit daily。
    返回 data 字段：无。
    前置条件：玩家需拥有对应命令的服务器权限（AI 不绕过权限，权限不足会被服务器拒绝）；命令缺失时返回 needInfo 引导补全。

hints:
  - |
    **Skill 优先规则**：当用户需求既有专用技能可以完成、又有命令文档中的命令可以完成时，优先使用专用技能。专用技能返回结构化数据（可供多步骤任务后续步骤引用），而本技能只返回成功/失败。只有以下情况使用本技能：①没有专用技能覆盖该需求；②虽有专用技能但当前是单次执行、不需要向后续步骤传递结果。
  - |
    **结果不可传递**：本技能执行命令后只返回「已执行命令: /xxx」或「命令执行失败」，不返回命令的输出内容（如查询结果、余额数值等）。因此：①本技能不适合作为多步骤任务的前置步骤——后续步骤无法通过 {step_x.xxx} 引用本步骤的结果；②需要查询数据并传递给后续步骤时，必须使用能返回结构化数据的专用技能（如 bukkit 系列 API）；③本技能适合作为多步骤任务的最终执行步骤。
  - |
    **权限边界**：命令以玩家身份执行，权限不足会被服务器拒绝（如普通玩家执行管理员命令）。示例（传送到出生点/领取礼包/打开菜单）仅为匹配锚点，实际可执行命令以【可执行命令列表】中当前玩家可见的命令为准。
