# ═══════════════════════════════════════════════════════════
# 命令执行技能（CommandSkill）
# 以玩家身份执行服务器命令，权限边界等于玩家自身的权限。
# 依赖：config.yml 中 command_skill.enabled: true 才会生效。
# ═══════════════════════════════════════════════════════════

description: |
  通用命令执行技能，是「可执行操作」的兜底入口：当没有专用技能能完成用户需求时，以玩家身份执行任意一条服务器命令来改变游戏状态或触发游戏操作，如「把时间设为白天」「给我一个钻石剑」「传送到 spawn」。
  触发场景：用户需求是一个【可执行的操作】（改变游戏状态或触发游戏动作），且无对应的专用技能可用时。
  反向边界：不适用于信息咨询、建议、攻略推荐、问答等查询类需求（这些应走对应查询/检索类技能）；优先使用专用技能，仅在专用技能无法覆盖时才使用本技能。

action_descriptions:
  execute_command: |
    功能：以玩家身份执行一条服务器命令，改变游戏状态或触发游戏操作。
    参数：
      - command（必填，命令文本，不含前导 /）：要执行的完整命令，如 give @s diamond_sword 1。
    返回 data 字段：无。
    前置条件：玩家需拥有对应命令的服务器权限（AI 不绕过权限）。

hints:
  - |
    安全机制：AI 以玩家身份执行命令，不绕过任何服务器权限。玩家没有的命令权限，AI 代执行也会被服务器拒绝。
  - |
    参数格式：command 参数填入完整命令（不含前导 /），LLM 应从用户消息中提取命令及参数；若用户未给出具体命令，返回 needInfo 引导其补全。
