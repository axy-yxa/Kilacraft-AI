# ═══════════════════════════════════════════════════════════
# Command Execution Skill (CommandSkill)
# Execute server commands as the player; the permission boundary equals the player's own permissions.
# Dependency: only takes effect when command_skill.enabled: true in config.yml.
# ═══════════════════════════════════════════════════════════

description: |
  General command-execution skill, the fallback entry for executable actions: when no specialized skill can fulfill the request, it executes any single server command as the player to change game state or trigger a game action, e.g. "set time to day", "give me a diamond sword", "teleport to spawn".
  Triggers: the user's request is an [executable action] (changes game state or triggers a game action) and no specialized skill covers it.
  Reverse boundary: NOT for information queries, suggestions, guide recommendations, or Q&A (those go to the corresponding query/search skills); prefer specialized skills and use this one only when they cannot cover the need.

action_descriptions:
  execute_command: |
    Function: Execute a server command as the player to change game state or trigger a game action.
    Parameters:
      - command (required, command text, without leading /): the full command to execute, e.g. give @s diamond_sword 1.
    Returns data fields: none.
    Precondition: the player must have the server permission for the command (AI does not bypass permissions).

hints:
  - |
    Security: AI executes commands as the player and does not bypass any server permissions. Commands the player lacks permission for will be rejected by the server even when AI runs them on their behalf.
  - |
    Parameter format: the command parameter takes the full command (without leading /); the LLM should extract the command and arguments from the user message. If the user did not specify the concrete command, return needInfo to prompt them to provide one.
