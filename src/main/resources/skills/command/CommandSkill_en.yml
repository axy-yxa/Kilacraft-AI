# English version of CommandSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Command Execution Skill (CommandSkill)
# Execute server commands as the player; the permission boundary equals the player's own permissions (Bukkit permission system is the final guard).
# The executable command list is in the commands/ directory command document (preset template released at startup; server owners can add third-party commands).
# ═══════════════════════════════════════════════════════════

description: |
  Command execution skill: executes server commands as the player to change game state or trigger a game action, e.g. "teleport to spawn", "claim your daily reward", "open the server menu".
  Triggers: when the user's request is an executable game action (changes game state or triggers a game action) and no other skill matches better. Also use when the player explicitly asks to run a specific command.
  Key limitation: this skill returns only success or failure after executing a command — not the command's output — so its result cannot be referenced by later steps of a multi-step task. When a request needs a result as a data source for later steps, you MUST use a specialized skill that returns structured data instead of this skill.
  NOT for: pure data queries (use the bukkit skills), or advice/recommendation Q&A.

action_descriptions:
  execute_command: |
    Function: Execute one server command as the player.
    Parameters:
      - command (required, command text, without leading /): the full command to execute, prefer choosing from the [executable command list], e.g. spawn, kit daily.
    Returns data fields: none.
    Precondition: the player must have the server permission for the command (AI does not bypass permissions; insufficient permission is rejected by the server); when the command is missing, return needInfo to prompt the player.

hints:
  - |
    **Skill-first rule**: when a request can be fulfilled both by a specialized skill and by a command in the command document, prefer the specialized skill. Specialized skills return structured data (referencable by later steps via {step_x.xxx}), while this skill returns only success/failure. Use this skill only when: ① no specialized skill covers the request; ② a specialized skill exists but this is a single execution with no need to pass results forward.
  - |
    **Result not transferable**: this skill returns only "Command executed: /xxx" or "Command execution failed" — not the command's output (e.g. query results, balance values). Therefore: ① this skill must NOT be used as a prerequisite step of a multi-step task — later steps cannot reference its result via {step_x.xxx}; ② when a query result must be passed to later steps, use a specialized skill that returns structured data (e.g. bukkit API skills); ③ this skill is suitable as the final execution step of a multi-step task.
  - |
    **Permission boundary**: commands are executed as the player; insufficient permission is rejected by the server (e.g. a normal player running an admin command). The examples (teleport to spawn / claim reward / open menu) are matching anchors only — the actual executable commands are those visible to the current player in the [executable command list].
