# GuardianSkill 守护系统技能配置
# 此文件由插件自动生成，可根据需要修改
#
# 此描述会发送给LLM，帮助其理解何时调用此技能
description: 'AI 守护系统：主动提醒玩家非即时感知的威胁与状态变化。支持开启、关闭、查询状态。守护开启后，AI 会在玩家背后出现威胁、背包快满、装备耐久临界等场景下主动发声提醒。玩家需通过 /kila guardian on 开启（opt-in）。'

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  enable: '开启 AI 守护系统。AI 会在玩家非即时感知的场景下主动提醒（如背后出现威胁、背包快满、装备耐久低等）。无参数。返回的 data 中包含 monitor_loaded 字段（已加载的守护类型列表），可供后续步骤引用。'
  disable: '关闭 AI 守护系统。关闭后 AI 不再主动提醒任何事件。无参数。'
  status: '查询当前守护系统的运行状态。无参数。返回的 data 中包含 enabled（是否开启）、monitors（活跃的守护类型列表），可供后续步骤引用。'

# 额外提示信息
hints:
  - '当玩家说"帮我开守护/盯着我/当保镖/开启守护"等请求激活守护时使用 enable'
  - '当玩家说"关掉守护/不用了/关闭守护/停止守护"等请求停用守护时使用 disable'
  - '当玩家说"守护开着吗/守护状态/守护在运行吗"等查询状态时使用 status'
