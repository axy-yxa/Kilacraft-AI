# ═══════════════════════════════════════════════════════════
# 守护系统技能（GuardianSkill）
# AI 守护系统自然语言入口：开启/关闭/查询主动提醒。
# 前置条件：守护系统已初始化；玩家需通过 /kila guardian on 主动开启（opt-in）。
# ═══════════════════════════════════════════════════════════

description: |
  开启/关闭/查询 AI 守护系统——一个会在玩家非即时感知的场景下（如背后出现威胁、背包快满、装备耐久临界等）主动发声提醒的能力。
  触发场景：玩家想开启、关闭或查询「守护/保镖/盯着我」这类主动提醒能力时，如「帮我开守护」「关掉守护」「守护开着吗」。
  反向边界：不适用于一次性查询或被动问答（那些走对应查询类技能）；也不用于人工盯防某目标（那属于 PlayerWatchSkill/WatchSkill 的持续监控）。

action_descriptions:
  enable: |
    功能：开启 AI 守护系统。开启后，AI 会在玩家非即时感知的场景下主动提醒（如背后出现威胁、背包快满、装备耐久低等）。
    参数：无。
    返回 data 字段：monitor_loaded（数组，已加载的守护类型字符串列表）。
    前置条件：守护系统已初始化且未全局禁用。
  disable: |
    功能：关闭 AI 守护系统。关闭后 AI 不再主动提醒任何事件。
    参数：无。
    返回 data 字段：无。
  status: |
    功能：查询当前守护系统的运行状态。
    参数：无。
    返回 data 字段：enabled（布尔，是否开启）、monitors（数组，当前活跃的守护类型字符串列表）。

hints:
  - |
    动作分流：玩家要「开启守护」用 enable；要「关闭/停止守护」用 disable；要「查询守护状态」用 status。
  - |
    守护是 opt-in 的主动提醒能力，默认关闭。当玩家表现出对环境安全或自身状态变化的担忧（如「怕被偷袭」「帮我留意装备耐久」），或你判断其处于高风险场景，可主动建议开启守护，但最终是否开启由玩家决定。
