# ═══════════════════════════════════════════════════════════
# 工具技能（UtilitySkill）
# 提供三个无业务依赖的基础编排能力：延迟等待、阶段性通知、全服广播。
# 不是独立功能，仅在多步骤任务中用于步骤间的时序间隔与中途通知。
# 依赖：LLM Provider（notify_player / broadcast_message 需要 LLM 美化文案）。
# 权限：kilacraft.utility 为基础权限，delay_wait/notify_player/broadcast_message 各有细粒度子权限。
# ═══════════════════════════════════════════════════════════

description: |
  通用工具技能，提供三个基础能力：delay_wait（延迟等待）、notify_player（阶段性通知）、broadcast_message（全服广播）。
  delay_wait 用于多步骤任务中步骤间的时序间隔；notify_player 把前序步骤结果概括后主动通知玩家；broadcast_message 是 OP 管理员专用的全服广播。
  触发场景：这些动作不对应玩家某个独立需求，而是在多步骤任务编排中按需插入，如「等几秒再做」「做到一半先跟我说一声」（OP）「全服广播一条消息」。
  反向边界：本技能不是独立功能入口，仅服务于任务编排；任务末尾的自然「告诉我」或单意图查询由最终 AI 总结处理，不使用 notify_player。

action_descriptions:
  delay_wait: |
    功能：延迟等待指定秒数，用于多步骤任务中两个步骤之间的时序间隔。
    参数：
      - seconds（必填，数值（整数））：等待秒数，范围 1-60，越界自动截断到合法范围。
    返回 data 字段：无。
    示例：用户说「等 5 秒再查」→ 在两个查询步骤之间插入此动作。
  notify_player: |
    功能：在多步骤任务的两个执行步骤之间插入一段 AI 输出，将前序步骤结果概括后主动通知玩家。
    参数：
      - message（必填，字符串）：通知上下文描述，可使用 {step_X.xxx} 占位符引用前面步骤的返回数据。
    返回 data 字段：无。
    使用条件：之前有执行步骤产生数据，且之后还有执行步骤要继续（必须夹在两个执行步骤之间，模式：[执行A] → notify_player → [执行B]）。
    不适用：单意图查询、用户需求末尾的「告诉我」（均由最终 AI 总结处理）。
  broadcast_message: |
    功能：将一段消息通过 AI 美化后全服广播给所有在线玩家，仅限 OP 管理员使用。
    参数：
      - message（必填，字符串）：要广播的消息内容，可使用 {step_X.xxx} 占位符引用前面步骤的返回数据。
    返回 data 字段：无。
    消息通过聊天栏（CHAT）载体发送给所有在线玩家；既可作为单意图使用，也可在多步骤任务中编排（如先查询在线玩家列表再广播）。

hints:
  - |
    notify_player 的关键判定：必须夹在两个执行步骤之间（[执行A] → notify_player → [执行B]）。之前有执行步骤产生数据、之后还有执行步骤要继续时才用。如果「告诉我」之后没有更多执行动作了，那是任务末尾的自然语气，由最终 AI 总结处理，不要用 notify_player。该规则适用于任何任务类型（查询、传送、购买、挖矿、交易等），notify_player 后面的执行动作可以是任意 skill 的任意 action。
  - |
    notify_player 的阶段性通知不会替代任务最终的结果汇总——任务结束后系统仍会输出完整的 AI 总结，二者并存。
