# UtilitySkill 工具技能配置
# 此文件由插件自动生成，可根据需要修改
#
# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '通用工具技能，提供三个基础能力：delay_wait（延迟等待）、notify_player（阶段性通知）、broadcast_message（全服广播）。delay_wait用于多步骤任务中步骤间的时序间隔。notify_player将前序步骤的执行结果通过独立LLM调用概括后主动通知玩家，必须夹在两个执行步骤之间使用（模式：[执行A] → notify_player → [执行B]）。broadcast_message是OP管理员专用的全服广播功能，将消息通过AI美化后发送给所有在线玩家，既可作为单意图使用也可在多步骤任务中编排。判定规则：如果"告诉我"出现在需求末尾或需求是单意图查询，由最终AI总结处理，不需要使用notify_player。'

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  delay_wait: '延迟等待指定秒数。必填参数：seconds（1-60秒的整数）。用于多步骤任务中步骤间的时序间隔。示例：用户说"等5秒再查"→在两个查询步骤之间插入此动作'
  notify_player: '在多步骤任务的两个执行步骤之间插入一段AI输出。必填参数：message（通知上下文描述，可使用{step_X.xxx}占位符引用前面步骤的返回数据）。使用条件：notify_player之前有执行步骤，且之后还有执行步骤要继续（即夹在两个执行动作之间）。不适用：单意图查询、用户需求末尾的"告诉我"（均由最终AI总结处理）'
  broadcast_message: '将一段消息通过AI美化后全服广播给所有在线玩家。必填参数：message（要广播的消息内容，可使用{step_X.xxx}占位符引用前面步骤的返回数据）。仅限OP管理员使用。使用场景：OP管理员想要用AI帮忙润色/美化一段话并发送给全服玩家。消息会通过聊天栏(CHAT)载体发送给所有在线玩家。既可作为单意图使用，也可在多步骤任务中编排（如先查询在线玩家列表再广播）'

# 额外提示信息
hints:
  - 'delay_wait的seconds范围为1-60秒，超出范围的值会被自动截断到合法范围'
  - 'notify_player判定规则：必须夹在两个执行步骤之间使用。之前有执行步骤产生数据，之后还有执行步骤要继续。如果"告诉我"之后没有更多执行动作了，那就是任务末尾的自然语气，由最终AI总结处理，不使用notify_player'
  - '无论什么类型的任务（查询、传送、购买、挖矿、交易等），只要符合[A执行→notify_player→B执行]结构就需要使用。notify_player后面的执行动作可以是任意skill的任意action'
  - 'notify_player的通知不会替代任务最终的结果汇总，任务结束后系统还会输出完整的AI总结'
  - 'broadcast_message是OP管理员专用的全服广播功能，既可作为单意图使用，也可在多步骤任务中编排（如先查询数据再广播结果）'

# ==================== LLM 提示词配置 ====================
# 以下提示词用于 notify_player 和 broadcast_message 的独立 LLM 调用
# 支持热重载：修改后使用 /kila reload 即可生效

# notify_player 的 system prompt（阶段性通知专用）
notify_system_prompt: |
  你是 Minecraft 游戏助手，正在多步骤任务执行过程中向玩家发送阶段性通知。
  请用简洁自然的语气概括下方数据的关键信息，不超过2句话、80个汉字。
  不要使用任何标题或模板，直接说出关键结果。
  不要提及'系统提示'、'任务步骤'、'执行结果'等内部机制。
  将英文物品名转换为中文（如 DIAMOND→钻石，STICK→木棍）。
  直接输出通知内容，不要有任何前缀。

# notify_player 的 user prompt（{0} 为数据占位符）
notify_user_prompt: "请概括以下数据的关键信息：\n{0}"

# broadcast_message 的 system prompt（全服广播美化专用）
broadcast_system_prompt: |
  你是 Minecraft 服务器的全服广播文案撰写助手。
  管理员提供了一段原始信息，请你将其美化为适合全服广播的文案。
  要求：语气热情友好，排版清晰（可使用列表、分段），不超过300个汉字。
  将英文物品名转换为中文（如 DIAMOND→钻石，STICK→木棍）。
  去掉所有 Minecraft 颜色代码和格式代码（如§f、§l、§x等）。
  不要提及'管理员'、'系统'、'广播'等内部机制。
  直接输出广播文案内容，不要有任何前缀或解释。

# broadcast_message 的 user prompt（{0} 为数据占位符）
broadcast_user_prompt: "请将以下信息美化为全服广播文案：\n{0}"
