# English version of UtilitySkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Utility Skill (UtilitySkill)
# Three business-agnostic orchestration primitives: timed delay, stage notification, server-wide broadcast.
# Not a standalone feature — only used in multi-step tasks for timing intervals and mid-task notifications.
# Depends on: LLM Provider (notify_player / broadcast_message use the LLM to polish copy).
# Permission: kilacraft.utility is the base permission; delay_wait/notify_player/broadcast_message each have fine-grained sub-permissions.
# ═══════════════════════════════════════════════════════════

description: |
  Utility skill providing three core capabilities: delay_wait (timed delay), notify_player (stage notification), and broadcast_message (server-wide broadcast).
  delay_wait is for timing intervals between steps; notify_player summarizes previous step results and proactively notifies the player; broadcast_message is an OP admin-only server-wide broadcast.
  Triggers: these actions do not correspond to a player's standalone need — they are inserted on demand within multi-step task orchestration, e.g. "wait a few seconds then continue", "give me an update halfway through", "broadcast a message to the whole server".
  Reverse boundary: this skill is not a standalone feature entry point — it only serves task orchestration. A natural "tell me" at the end of a task or a single-intent query is handled by the final AI summary, not by notify_player.

action_descriptions:
  delay_wait: |
    Function: Delay for a specified number of seconds; used for timing intervals between two steps in a multi-step task.
    Parameters:
      - seconds (required, integer): wait seconds, range 1-60, clamped automatically to the valid range when out of bounds.
    Returns data fields: none.
    Example: user says "wait 5s then check" → insert this action between two query steps.
  notify_player: |
    Function: Insert an AI output between two execution steps in a multi-step task; summarizes the previous step's result and proactively notifies the player.
    Parameters:
      - message (required, string): notification context description; may use {step_X.xxx} placeholders to reference previous step return data.
    Returns data fields: none.
    Usage condition: there must be execution steps producing data both BEFORE and AFTER notify_player (must be sandwiched between two execution steps, pattern: [execute A] → notify_player → [execute B]).
    Not applicable: single-intent queries, "tell me" at the end of user requests (both handled by the final AI summary).
  broadcast_message: |
    Function: Broadcast an AI-beautified message to all online players server-wide; OP administrators only.
    Parameters:
      - message (required, string): the message content to broadcast; may use {step_X.xxx} placeholders to reference previous step return data.
    Returns data fields: none.
    Messages are delivered via the chat (CHAT) channel to all online players; can be used as a single intent or orchestrated in a multi-step task (e.g. query the online player list first, then broadcast it).

hints:
  - |
    Key decision rule for notify_player: it must be sandwiched between two execution steps ([execute A] → notify_player → [execute B]). Use it only when an execution step produced data before it AND another execution step continues after it. If "tell me" is followed by no more execution actions, it is natural speech at the task end — handled by the final AI summary, do NOT use notify_player. This rule applies to any task type (query, teleport, purchase, mining, trade, etc.); the action after notify_player can be any skill's any action.
  - |
    notify_player's stage notification does not replace the final task result summary — after the task completes, the system still outputs a complete AI summary; the two coexist.
