# UtilitySkill Configuration (English)
# This file is auto-generated by the plugin and can be modified
#
# This description is sent to the LLM to help it understand when to use this skill
description: 'Utility skill providing three core capabilities: delay_wait (timed delay), notify_player (stage notification), and broadcast_message (server-wide broadcast). delay_wait is used for timing intervals between steps in multi-step tasks. notify_player summarizes previous step results via an independent LLM call and proactively notifies the player — must be sandwiched between two execution steps (pattern: [execute A] → notify_player → [execute B]). broadcast_message is an OP admin-only server-wide broadcast feature that beautifies messages via AI and sends them to all online players — can be used as single intent or orchestrated in multi-step tasks. Decision rule: if "tell me" appears at the end of the request or the request is a single-intent query, the final AI summary handles it automatically — do NOT use notify_player.'

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  delay_wait: 'Delay for a specified number of seconds. Required parameter: seconds (integer, 1-60). Used for timing intervals between steps in multi-step tasks. Example: user says "wait 5s then check" → insert this action between two query steps'
  notify_player: 'Insert an AI output between two execution steps in a multi-step task. Required parameter: message (notification context description, can use {step_X.xxx} placeholders to reference previous step return data). Usage condition: there must be execution steps both BEFORE and AFTER notify_player (i.e. sandwiched between two execution actions). Not applicable: single-intent queries, "tell me" at the end of user requests (both handled by final AI summary)'
  broadcast_message: 'Broadcast an AI-beautified message to all online players server-wide. Required parameter: message (the message content to broadcast, can use {step_X.xxx} placeholders to reference previous step return data). OP administrators only. Use case: OP admin wants AI to polish/beautify a message and send it to all players. Messages are delivered via chat (CHAT channel) to all online players. Can be used as single intent or orchestrated in multi-step tasks (e.g., query online players first, then broadcast the list)'

# Additional hints
hints:
  - 'delay_wait seconds range is 1-60, values outside this range will be automatically clamped'
  - 'notify_player decision rule: must be sandwiched between two execution steps. There must be an execution step producing data before it, and another execution step continuing after it. If "tell me" is followed by no more execution actions, it is natural speech at the task end — handled by final AI summary, do NOT use notify_player'
  - 'Applies to any task type (query, teleport, purchase, mining, trade, etc.) — as long as it fits the [A execute → notify_player → B execute] pattern, use it. The action after notify_player can be any skill''s any action'
  - 'notify_player notification does not replace the final task result summary - after task completion, the system will still output a complete AI summary'
  - 'broadcast_message is an OP admin-only server-wide broadcast feature, can be used as single intent or orchestrated in multi-step tasks (e.g., query data first then broadcast results)'
