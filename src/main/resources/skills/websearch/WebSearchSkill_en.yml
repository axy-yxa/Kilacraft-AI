# WebSearchSkill Web Search Skill Configuration (English)
# This file is auto-generated by the plugin
#
# This description is sent to the LLM to help it understand when to invoke this skill
description: 'Web search — retrieve real-time information from the internet. Use this skill when the user''s question requires latest news, fact-checking, or information beyond your knowledge cutoff. Supports both Chinese and English search. Results are automatically summarized before shown to the player.'

# Action descriptions (Map format: key=action name, value=description)
# Each action description is sent to the LLM to help it select the correct action and extract parameters
action_descriptions:
  search: 'Perform a web search. query is the search term, count is the number of results (optional, default 5, max 10), recency is the time range (optional: day/week/month/year, default unlimited). The returned data contains query (search term), results (result array, each with title/url/snippet), total_count (total results), and provider (search provider name) fields, available for subsequent step references.'

# Additional hints (used to guide the LLM in correct skill usage)
hints:
  - 'User asks "what''s new in 1.21" → query="Minecraft 1.21 update content"'
  - 'User asks "recommend good mods" → query="Minecraft best mods 2026"'
  - 'User asks "what does this link say" → should use web_fetch skill instead of web_search'
  - 'For multiple independent questions, create multiple web_search steps with different keywords'
  - 'Keep search keywords concise, extract core terms instead of using full sentences'
  - 'When searching for real-time/today information (gold price, exchange rate, stock, news, etc.), must obtain the current date from the system prompt and append it to the query, e.g. "July 24 2026 gold price" instead of "today gold price", and set recency=day to ensure result freshness'
  - 'When the user explicitly says "first N results" or "N results", set count=N; omit count to use the default when no specific number is given'
