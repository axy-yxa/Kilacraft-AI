# English version of WebSearchSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Web Search (WebSearchSkill)
# Retrieve real-time information from the internet; multi-provider pluggable (domestic: Zhipu/Baidu Qianfan/Qiniu/Volcano/Alibaba; international: Tavily/Brave/Exa/You).
# Auto-selects the first configured provider by i18n language and config; results are summarized by the AI before being shown to the player.
# Permission: WEB_SEARCH (depends on search.enabled being on in web.yml).
# ═══════════════════════════════════════════════════════════

description: |
  Searches the internet by keyword to retrieve real-time information and presents an AI-generated summary to the player.
  Triggers: use when the user's question requires the latest news, fact-checking, research, or information beyond the AI's knowledge cutoff, e.g. "what's new in 1.21", "today's gold price", "recommend good mods".
  Reverse boundary: not for querying in-game data or a local knowledge base (those go to the corresponding query skills); not for viewing a specific web link the player already provided (use the web_fetch skill for that).

action_descriptions:
  search: |
    Function: perform a single web search and return several results (title, URL, snippet) for the AI to summarize.
    Parameters:
      - query (required, string): search keywords; keep them concise and extract core terms rather than using a full sentence.
      - count (optional, default from web.yml config, integer): number of results to return; clamped within the configured hard upper limit.
      - recency (optional, default unlimited, string): time range filter; one of day/week/month/year, used to emphasize freshness.
    Returns data fields: query (search term), provider (the search provider that served the request), total_count (actual number of results returned), results (array, each entry has title/url/snippet).

hints:
  - |
    query should be concise keywords, not a full sentence: rewrite spoken questions into core search terms (e.g. "what's new in 1.21" → "Minecraft 1.21 update content"; "recommend good mods" → "Minecraft best mods 2026").
  - |
    When searching for real-time/today information (gold price, exchange rate, stock, news, etc.), obtain the current date from the system prompt and append it to the query (e.g. "July 24 2026 gold price" instead of "today gold price"), and set recency=day to ensure freshness.
  - |
    For multiple independent sub-questions, create multiple web_search steps with different keywords; each step should focus on a single topic, at most 5 steps. Suitable split scenarios: the user explicitly asked multiple independent questions (e.g. "how is A? what about B? and C?"), needs to compare multiple things (e.g. "what's the difference between Java Edition and Bedrock Edition"), or the search scope is broad and needs multiple angles. Multiple search steps execute sequentially, so control the count reasonably.
  - |
    When the user explicitly says "first N results" or "N results", set count=N; omit count to use the default when no specific number is given.
