# ═══════════════════════════════════════════════════════════
# 联网搜索（WebSearchSkill）
# 从互联网获取实时信息，多供应商可插拔（国内：智谱/百度千帆/七牛/火山/阿里；国际：Tavily/Brave/Exa/You）。
# 按 i18n 语言与配置自动选择首个已配置的供应商，结果由 AI 自动总结后展示给玩家。
# 权限：WEB_SEARCH（依赖 web.yml 中 search.enabled 开启）。
# ═══════════════════════════════════════════════════════════

description: |
  从互联网「按关键词搜索」获取实时信息，自动总结后展示给玩家。
  触发场景：用户问题需要最新资讯、事实核实、查找资料或超出 AI 知识截止日期时优先使用，如「1.21 更新了什么」「今日金价」「推荐好玩的 mod」。
  反向边界：不用于查询游戏内数据或本地知识库（这些走对应查询类技能）；不用于查看玩家已给定的具体网页链接（那属于网页抓取类技能）。

action_descriptions:
  search: |
    功能：执行一次联网搜索，返回若干条结果（标题、URL、摘要）供 AI 二次总结。
    参数：
      - query（必填，字符串）：搜索关键词，应精简并提取核心词，不要把整句话作为搜索词。
      - count（可选，默认取 web.yml 配置，数值（整数））：返回结果条数，会裁剪到配置的硬上限内。
      - recency（可选，默认不限，字符串）：时间范围过滤，取值 day/week/month/year 之一，用于强调时效性。
    返回 data 字段：query（搜索词）、provider（命中的搜索供应商名）、total_count（实际返回条数）、results（数组，每项含 title/url/snippet）。

hints:
  - |
    query 应是精简关键词，而非整句：将口语化问题改写为核心检索词（如「1.21 更新了什么」→「Minecraft 1.21 更新内容」；「推荐好玩的 mod」→「Minecraft 热门 mod 推荐 2026」）。
  - |
    搜索实时/今日信息（金价、汇率、股价、新闻等时间敏感内容）时，必须从系统提示词中获取当前日期拼接进 query（如「2026年7月24日 金价」而非「今日金价」），并设置 recency=day 以确保时效性。
  - |
    涉及多个独立子问题时，可创建多个 web_search 步骤分别搜索不同关键词，每个步骤聚焦单一主题，最多拆成 5 个。适合拆分的场景：用户明确问了多个独立问题（如「A 怎么样？B 呢？C 呢？」）、需要对比多个事物（如「Java 版和 Bedrock 版有什么区别」）、搜索范围广需多角度切入。多个搜索步骤按顺序依次执行，请合理控制数量。
  - |
    用户明确说「前 N 条」「N 个结果」时设置 count=N；未明确指定数量时省略 count 使用默认值。
