# WebSearchSkill 联网搜索技能配置
# 此文件由插件自动生成，可根据需要修改
#
# 此描述会发送给LLM，帮助其理解何时调用此技能
description: '联网搜索——从互联网获取实时信息。当用户问题需要最新资讯、事实核实、查找资料或超出你的知识截止日期时优先使用此技能。支持中文和英文搜索。搜索结果会自动总结后展示给玩家。'

# 动作描述（Map 格式，key=动作名称，value=动作描述）
# 每个动作的描述会发送给LLM，帮助其选择正确的action并提取参数
action_descriptions:
  search: '执行联网搜索。query 为搜索词，count 为条数（可选，默认5，最大10），recency 为时间范围（可选：day/week/month/year，默认不限）。返回的 data 中包含 query、results（数组，每条含 title/url/snippet）、total_count、provider 字段，可供后续步骤引用。'

# 额外提示信息（用于指导 LLM 正确使用技能）
hints:
  - '用户问"1.21更新了什么" → query="Minecraft 1.21 更新内容"'
  - '用户问"推荐好玩的mod" → query="Minecraft 热门 mod 推荐 2026"'
  - '用户问"这个链接说的是什么" → 应使用 web_fetch 技能而非 web_search'
  - '涉及多个独立问题时，可创建多个 web_search 步骤分别搜索不同关键词'
  - '搜索词应精简，避免整句话作为搜索词，提取核心关键词'
  - '搜索实时/今日信息（金价、汇率、股价、新闻等时间敏感内容）时，必须从系统提示词中获取当前日期拼接进 query，例如"2026年7月24日 金价"而非"今日金价"，并设置 recency=day 以确保搜索结果时效性'
  - '用户明确说"前N条""N个结果"时，设置 count=N；未明确指定数量时省略 count 使用默认值'
