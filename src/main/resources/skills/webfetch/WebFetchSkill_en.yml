# WebFetchSkill Web Fetch Skill Configuration (English)
# This file is auto-generated by the plugin
#
# This description is sent to the LLM to help it understand when to invoke this skill
description: 'Web fetch — retrieve the content of a specified web page and extract the main text. Use when the player provides a URL and wants to know its content. Zero config, no API Key needed, with SSRF protection. Content is automatically summarized by AI.'

# Action descriptions (Map format: key=action name, value=description)
# Each action description is sent to the LLM to help it select the correct action and extract parameters
action_descriptions:
  fetch: 'Fetch web page content. url is the page address (required, must be a full http/https URL), question is the user''s specific question about the page (optional). The returned data contains url (page address), title (page title), content (extracted body text), cached (whether from cache), and question (user''s question, if provided) fields, available for subsequent step references.'

# Additional hints (used to guide the LLM in correct skill usage)
hints:
  - 'User says "check this link https://xxx.com" → url="https://xxx.com"'
  - 'User says "what does this page say https://xxx.com where is the tutorial" → url="https://xxx.com", question="where is the tutorial"'
  - 'url must be a complete address starting with http:// or https://'
  - 'If you need to search rather than fetch a specific link, use the web_search skill'
