# ═══════════════════════════════════════════════════════════
# 网页抓取（WebFetchSkill）
# 抓取指定 URL 的网页内容，提取正文后供 LLM 总结。
# 零配置——纯本地 OkHttp+Jsoup 实现，无需 API Key；内建 SSRF 防护（强制 HTTPS + 内网 IP 拒绝）。
# 权限：WEB_FETCH（依赖 web.yml 中 fetch.enabled 开启）。
# ═══════════════════════════════════════════════════════════

description: |
  抓取「指定网页」的内容并提取正文，由 AI 总结后返回给玩家。
  触发场景：玩家给出明确的网页 URL 并希望了解该页面内容时，如「帮我看看这个链接」「这个网页说了什么」「这个链接里的教程在哪」。
  反向边界：不用于按关键词检索互联网信息（那属于网页搜索类技能）；不用于查询 API/接口返回的结构化数据（本技能只解析 HTML 网页正文）。

action_descriptions:
  fetch: |
    功能：抓取指定 URL 的网页内容，移除脚本/导航等噪声后提取正文文本。
    参数：
      - url（必填，字符串）：网页地址，必须是完整的 http:// 或 https:// 开头的链接。
      - question（可选，默认空，字符串）：玩家对该页面的具体问题；提供时拼入 message 供 LLM 针对性总结。
    返回 data 字段：url（网页地址）、title（页面标题）、content（提取的正文文本）、question（玩家问题，若提供）。
    前置条件：url 必须是完整的 http:// 或 https:// 开头的地址，相对路径或裸域名无法抓取。

hints:
  - |
    用户附带具体问题（如「这个网页里的教程在哪」）时，把问题放进 question 参数，使总结更聚焦；未提供问题时省略该参数，让 AI 做通用总结。
