# MarketActionSkill Configuration (English)
# This file is auto-generated by the plugin and can be modified

# This description is sent to the LLM to help it understand when to use this skill
description: "GlobalMarket operations skill, supporting searching items (opening purchase page) and listing held items for sale. Use search_item when user wants to buy items, search items, or view purchase pages; use sell_item when user wants to list, sell, or put held items on the market. If price is not specified, market reference price will be returned for user confirmation."

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  search_item: "Search and open the purchase page (GUI) for a specified item. Required parameter: item (item name, English or Chinese). Opens search results GUI for the player to click and purchase. Use when user says 'buy diamond', 'search diamond', 'open market to buy xxx', 'want to buy xxx'"
  sell_item: "List the player's held item on the global market. Optional parameters: price (unit price, number), quantity (quantity, number). If price is not specified, returns [NEED_INFO] with market reference price, requiring user confirmation before calling this skill again with the price parameter. Use when user says 'sell what I'm holding', 'list this', 'sell my diamonds', 'put on market'. Note: item must be in player's main hand"

# Additional hints (for guiding LLM to use skills correctly)
hints:
  - "**Listing flow**: If sell_item returns a failure message starting with [NEED_INFO], it means the price parameter is missing. You should present the reference price to the user and ask for price confirmation, then call sell_item again with the price parameter after the user responds"
  - "**Price parameter**: sell_item's price parameter must be a pure number (e.g. '100' or '50.5'), do not include currency symbols or units. quantity must also be an integer"
  - "**Search ≠ Purchase**: search_item only opens a GUI for the player to click and purchase. AI cannot complete the purchase on behalf of the player. Please inform the player to select items in the opened page"
  - "**Multi-step assist**: If user asks 'how much can I sell my held item for', suggest calling bukkit_api.get_player_hand_item first to get the item name, then market_query.query_price to check the price, and finally inform the user they can use sell_item to list it"
