# MarketActionSkill Configuration (English)
# This file is auto-generated by the plugin and can be modified

# This description is sent to the LLM to help it understand when to use this skill
description: "GlobalMarket operations skill. Supports: search items and open purchase page(search_item), list held items for sale(sell_item), pickup mailbox items(pickup_mail), create buy orders(buy_item), cancel listings(cancel_listing), transfer money to other players(transfer_money), start auctions(auction_item), bulk sell inventory items(sell_inventory), bulk buy inventory items(buy_inventory)."

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  search_item: "Search and open the purchase page (GUI) for a specified item. Required parameter: item (item name). Opens search results GUI for the player to click and purchase. Use when user says 'buy diamond', 'search diamond', 'open market to buy xxx', 'want to buy xxx'"
  sell_item: "List the player's held item on the global market. Optional parameters: price (unit price), quantity (number). If price is not specified, returns [NEED_INFO] with market reference price. Use when user says 'sell what I'm holding', 'list this', 'sell my diamonds', 'put on market'. Note: item must be in player's main hand"
  pickup_mail: "Pickup items from player's mailbox. Optional parameter: target (pickup target, defaults to 'all', can also specify mail UID). Use when user says 'check my mail', 'pickup mailbox items', 'collect my mail'"
  buy_item: "Create a buy order (wanted listing). Player must hold the target item in main hand. Optional parameters: price (buy price per unit), quantity (defaults to 1). If price is missing, returns reference price for confirmation. Use when user says 'I want to buy diamonds', 'create a buy order', 'looking to purchase'. Note: item must be in player's main hand"
  cancel_listing: "Cancel a player's active listing. Optional parameter: uid (merchandise UID or list number). If not specified, returns active listings for user to choose from. Use when user says 'cancel that diamond listing', 'take that off the market', 'delist'"
  transfer_money: "Transfer money to another player. Required parameters: target_player (recipient name), amount (a pure number, OR an arithmetic placeholder based on a prior query result such as {step_0.balance}/3 meaning one third of the balance — auto-evaluated by the system at execution time). Use when user says 'send Steve 100', 'pay that guy', 'transfer money'. This action may return [NEED_INFO] to ask for a missing amount or to confirm a large transfer; the continuation is managed automatically by the framework — just follow the message to guide the player (no need to reconstruct parameters or fill a confirmation flag for confirm/supplement)"
  auction_item: "Start an auction. Player must hold the target item in main hand. Optional parameters: price (starting bid), quantity (defaults to stack size). If price is missing, returns reference price for confirmation. Use when user says 'auction this sword', 'starting bid 500', 'put this up for auction'. Note: item must be in player's main hand"
  sell_inventory: "Bulk sell items. Required parameter: price (unit price). Opens bulk listing GUI for the player to place items and confirm. Use when user says 'bulk sell', 'bulk list', 'sell everything'"
  buy_inventory: "Bulk buy items. Required parameter: price (unit price/deposit). Opens bulk purchase GUI for the player to place items and confirm. Use when user says 'bulk buy', 'mass purchase', 'I want to buy others' items'"

# Additional hints (for guiding LLM to use skills correctly)
hints:
  - "**Listing flow**: If sell_item returns a message starting with [NEED_INFO], it means the price parameter is missing. Present the reference price to the user and ask for confirmation, then call sell_item again with the price parameter"
  - "**Price parameter**: sell_item/buy_item/auction_item/sell_inventory/buy_inventory price must be a pure number (e.g. '100' or '50.5'), no currency symbols. quantity must be an integer"
  - "**Search ≠ Purchase**: search_item only opens a GUI for the player to click and purchase. AI cannot complete purchases. Inform the player to select items in the opened page"
  - "**Parameter authenticity principle**: You must NOT fabricate or guess any parameter values. All parameters must come from the user's explicit statements. Absolutely forbidden to self-fill amounts or self-price. Parameters and confirmation for pending operations are managed automatically by the framework continuation — you do NOT need to reconstruct parameters or fill a confirmation flag"
  - "**Main hand item**: sell_item, buy_item, auction_item all require the player to hold the target item in their main hand first. sell_inventory and buy_inventory do NOT require held items -- the player puts items in the GUI themselves"
  - "**Cancel listing flow**: If cancel_listing returns [NEED_INFO], it contains active listings with numbers. User replies with a number, then call cancel_listing again with the uid parameter (can be a list number like '1' or a UID number)"
  - "**Multi-step assist**: If user asks 'how much can I sell my held item for', suggest calling bukkit_api.get_player_hand_item first, then market_query.query_price to check price, then inform user they can use sell_item to list it"
  - "**Transfer flow**: (1) Fuzzy amounts ('all', 'half', 'one third' etc.) use a multi-step task: step_0 calls market_query.query_balance, step_1 calls market_action.transfer_money with amount expressed as an arithmetic placeholder ({step_0.balance} for all, {step_0.balance}/2 for half, {step_0.balance}/3 for a third). After the system evaluates it, transfer_money returns [NEED_INFO] showing the concrete amount for the user to confirm (the money is never moved without explicit confirmation). Only when a ratio cannot be expressed as a single binary operation (+ - * /) should you inform the user of their balance and ask for a specific amount. (1.5) If market_query is NOT in the [Available Skills List] (cannot query balance), NEVER use {step_} placeholders — use a single transfer_money step with amount left empty, and the system will return [NEED_INFO] asking the player for a concrete amount. (2) NEVER extract old amount values from conversation history to guess current balance — balance changes in real-time and must be queried fresh. (3) When the user confirms or supplies a value, the framework automatically resumes execution using the snapshotted parameters — you do NOT need to reconstruct parameters or pass confirmed"
  - "**Currency unit**: This server's economy uses $ as the currency symbol (e.g. $100.00). Never use 'emerald' or any other Minecraft item name to refer to currency. All prices and amounts are in $ currency"
