# English version of MarketActionSkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Global Market Actions Skill (MarketActionSkill)
# Integrates write operations of the GlobalMarketPlus plugin: search/list/buy-order/cancel/mailbox/transfer/auction/bulk-sell/bulk-buy.
# Dependency: third-party plugin GlobalMarketPlus (isAvailable runtime gate).
# Permission: kilacraft.market_action as the base permission.
# ═══════════════════════════════════════════════════════════

description: |
  Global market WRITE-operations skill (interfaces with the GlobalMarketPlus plugin). Performs write operations against the market: search an item and open its purchase page (search_item), list the main-hand item for sale (sell_item), pickup mailbox items (pickup_mail), create a buy order (buy_item), cancel a listing (cancel_listing), transfer money to another player (transfer_money), start an auction (auction_item), bulk sell inventory items of one kind (sell_inventory), bulk buy inventory items of one kind (buy_inventory).
  Trigger: use when the user expresses a write intent — "sell/buy/list/delist/auction/transfer/pickup mail".
  Reverse boundary: this skill only performs write operations. Read-only queries (balance, prices, item lists, stats) are handled by MarketQuerySkill — do NOT use this skill to check prices or balance.

action_descriptions:
  search_item: |
    Function: search and open the purchase page (GUI) for a specified item; opens the search results GUI for the player to click and purchase.
    Parameters:
      - item (required, item name): item name; Chinese or English accepted.
    Trigger: user says "buy diamond", "search diamond", "open market to buy xxx", "want to buy xxx".

  sell_item: |
    Function: list the player's main-hand item on the global market.
    Parameters:
      - price (optional, decimal): unit price; if missing returns [NEED_INFO] with the market reference price — the user must confirm and re-call with price.
      - quantity (optional, defaults to stack size, integer): quantity.
    Precondition: item must be in the player's main hand (sell_inventory/buy_inventory do not require this).
    Trigger: user says "sell what I'm holding", "list this", "sell my diamonds", "put on market".

  pickup_mail: |
    Function: pickup items from the player's mailbox.
    Parameters:
      - target (optional, defaults to all, string): pickup target; "all" for all items, or a specific mail UID.
    Trigger: user says "check my mail", "pickup mailbox items", "collect my mail".

  buy_item: |
    Function: create a buy order (wanted listing).
    Parameters:
      - price (optional, decimal): buy price per unit; if missing returns the reference price for confirmation.
      - quantity (optional, defaults to 1, integer): quantity.
    Precondition: item must be in the player's main hand.
    Trigger: user says "I want to buy diamonds", "create a buy order", "looking to purchase".

  cancel_listing: |
    Function: cancel a player's active listing.
    Parameters:
      - uid (optional, string): merchandise UID or list number; if missing returns the active listings for the user to choose from.
    Trigger: user says "cancel that diamond listing", "take that off the market", "delist".

  transfer_money: |
    Function: transfer money to another player.
    Parameters:
      - target_player (required, player name): recipient name.
      - amount (optional, decimal): amount — a pure number, OR an arithmetic placeholder based on a prior query result (such as {step_0.balance}/3 meaning one third of the balance — auto-evaluated by the system at execution time); returns [NEED_INFO] prompting the player to supply it when missing.
    May return [NEED_INFO] to ask for a missing amount or to confirm a large transfer; the continuation is managed automatically by the framework — just follow the message to guide the player (no need to reconstruct parameters or fill a confirmation flag for confirm/supplement).
    Trigger: user says "send Steve 100", "pay that guy", "transfer money".

  auction_item: |
    Function: start an auction.
    Parameters:
      - price (optional, decimal): starting bid; if missing returns the reference price for confirmation.
      - quantity (optional, defaults to stack size, integer): quantity.
    Precondition: item must be in the player's main hand.
    Trigger: user says "auction this sword", "starting bid 500", "put this up for auction".

  sell_inventory: |
    Function: bulk sell items; opens the bulk listing GUI for the player to place items and confirm.
    Parameters:
      - price (required, decimal): unit price.
    Trigger: user says "bulk sell", "bulk list", "sell everything".

  buy_inventory: |
    Function: bulk buy items; opens the bulk purchase GUI for the player to place items and confirm.
    Parameters:
      - price (required, decimal): unit price / deposit.
    Trigger: user says "bulk buy", "mass purchase", "I want to buy others' items".

hints:
  - |
    Listing flow: if sell_item returns a message starting with [NEED_INFO], the price parameter is missing. Present the reference price to the user and ask for confirmation, then call sell_item again with the price parameter.
  - |
    Price parameter: sell_item/buy_item/auction_item/sell_inventory/buy_inventory price must be a pure number (e.g. "100" or "50.5"), no currency symbols. quantity must be an integer.
  - |
    Search ≠ Purchase: search_item only opens a GUI for the player to click and purchase. AI cannot complete purchases. Inform the player to select items in the opened page.
  - |
    Parameter authenticity principle: you must NOT fabricate or guess any parameter values. All parameters must come from the user's explicit statements. Absolutely forbidden to self-fill amounts or self-price. Parameters and confirmation for pending operations are managed automatically by the framework continuation — you do NOT need to reconstruct parameters or fill a confirmation flag.
  - |
    Main hand item: sell_item, buy_item, auction_item all require the player to hold the target item in their main hand first. sell_inventory and buy_inventory do NOT require held items — the player puts items in the GUI themselves.
  - |
    Cancel listing flow: if cancel_listing returns [NEED_INFO], it contains active listings with numbers. The user replies with a number, then call cancel_listing again with the uid parameter (can be a list number like "1" or a UID number).
  - |
    Multi-step assist: if the user asks "how much can I sell my held item for", suggest calling bukkit_api.get_player_hand_item first, then market_query.query_price to check the price, then inform the user they can use sell_item to list it.
  - |
    Transfer flow: (1) Fuzzy amounts ("all", "half", "one third" etc.) use a multi-step task: step_0 calls market_query.query_balance, step_1 calls market_action.transfer_money with amount expressed as an arithmetic placeholder ({step_0.balance} for all, {step_0.balance}/2 for half, {step_0.balance}/3 for a third). After the system evaluates it, transfer_money returns [NEED_INFO] showing the concrete amount for the user to confirm (the money is never moved without explicit confirmation). Only when a ratio cannot be expressed as a single binary operation (+ - * /) should you inform the user of their balance and ask for a specific amount. (1.5) If market_query is NOT in the [Available Skills List] (cannot query balance), NEVER use {step_} placeholders — use a single transfer_money step with amount left empty, and the system will return [NEED_INFO] asking the player for a concrete amount. (2) NEVER extract old amount values from conversation history to guess the current balance — balance changes in real time and must be queried fresh. (3) When the user confirms or supplies a value, the framework automatically resumes execution using the snapshotted parameters — you do NOT need to reconstruct parameters or pass confirmed.
  - |
    Currency unit: this server's economy uses $ as the currency symbol (e.g. $100.00). Never use "emerald" or any other Minecraft item name to refer to currency. All prices and amounts are in $ currency.
