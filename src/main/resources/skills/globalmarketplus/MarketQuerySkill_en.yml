# MarketQuerySkill Configuration (English)
# This file is auto-generated by the plugin and can be modified

# This description is sent to the LLM to help it understand when to use this skill
description: "Query GlobalMarketPlus plugin information, including player balance, market prices, item listings, item availability, personal items, mailbox, market stats, and other read-only query operations. This skill only supports querying, and does not support purchasing, selling, listing, or other write operations. Use this skill when users ask about money, balance, prices, item prices, what's on the market, if an item is for sale, what I'm selling, my items, mailbox, mail, or market statistics."

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  query_balance: "Query player account balance. Returned data contains balance field, available for subsequent step references. Use when user asks 'how much money do I have', 'balance', 'my money'"
  query_price: "Query market price for specified item. Required parameter: item (item name and quantity, format 'item_name:quantity'). Returned data contains total_price, item_count fields, single item queries also include item_name and price fields, available for subsequent step references. Use when user asks about item prices (e.g. 'how much is diamond', 'how much for 5 sticks'). Note: this is a price query only, cannot be used for purchasing"
  query_items: "Query market listed items. Returned data contains items field (item name list) and count field (item count), available for subsequent step references. Use when user asks 'what's on the market', 'list all items', 'market item list'"
  query_availability: "Query if a specified item is for sale, available quantity and seller info. Required parameter: item (item name). Returned data contains available (boolean: is for sale), total_stock (number: total available quantity), min_price (number: lowest price), max_price (number: highest price), seller_count (number: seller count) fields, available for subsequent step references or as AFK task condition_plan result_path. Use when user asks 'is anyone selling this item', 'is xxx on the market', 'is my held item for sale on the market'"
  query_my_items: "Query player's own listed items. Returned data contains my_items field (item array, each item has item_name, english_name, amount, price, seller_name fields) and count field (item count), available for subsequent step references. Use when user asks 'what am I selling', 'my items', 'what did I list'"
  query_seller_items: "Query items listed by a specific seller. Required parameter: seller_name (seller player name). Returned data contains seller_items field (item array, each item has item_name, english_name, amount, price, seller_name fields) and count field (item count), available for subsequent step references. Use when user asks 'what is xxx selling', 'xxx's shop', 'what does xxx sell'"
  query_mailbox: "Query player mailbox pending mail. Returned data contains mails field (mail array, each mail has item_name, english_name, amount, sender_name fields) and count field (mail count), available for subsequent step references. Use when user asks 'do I have mail', 'what's in my mailbox', 'check mailbox'"
  query_market_stats: "Query market statistics. Returned data contains total_items field (number: total item count) and total_sellers field (number: total seller count), available for subsequent step references or as AFK task condition_plan result_path. Use when user asks 'how many items on market', 'market stats', 'market total'"

# Additional hints (for guiding LLM to use skills correctly)
hints:
  - "**Format specification**: entities.item must use English commas to separate multiple items, each format as 'item_name:quantity' (unspecified quantity defaults to :1), don't use 'and/with/&' to connect. E.g. 'diamond:2,stick:1'"
  - "**Key requirement**: When user mentions a specific item name, it must be extracted to entities.item field, cannot be empty. Use query_availability to check if for sale, not query_price"
  - "**Multi-step tasks**: If user asks 'how much is the item in my hand', need to first call bukkit_api.get_player_hand_item to get item name, then call query_price to check price"
  - "**Balance real-time query (mandatory)**: Any time balance is involved (including 'what can I afford', 'do I have enough money', 'how much money do I have left'), you MUST query via query_balance in real-time. Strictly forbidden to read old balance from conversation history for inference. Balance changes after buying, selling, listing, delisting, and transfers — historical data is stale. If the user's question requires combining balance and item info, use multi-step task: step_0 query_balance, step_1 query items"
  - "**Currency unit**: This server's economy uses $ as the currency symbol (e.g. $100.00). Never use 'emerald' or any other Minecraft item name to refer to currency. All prices and amounts are in $ currency"
