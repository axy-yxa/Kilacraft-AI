# English version of MarketQuerySkill.yml — keep action keys in sync with the Chinese version
# ═══════════════════════════════════════════════════════════
# Global Market Query Skill (MarketQuerySkill)
# Integrates read-only queries of the GlobalMarketPlus plugin: balance/price/item-list/availability/own-items/seller-items/mailbox/market-stats.
# Dependency: third-party plugin GlobalMarketPlus (isAvailable runtime gate).
# Permission: kilacraft.market.query as the base permission.
# ═══════════════════════════════════════════════════════════

description: |
  Global market query skill. Supports: query player account balance (query_balance), query market price for a specified item (query_price), query all listed market items (query_items), query whether a specified item is for sale and seller info (query_availability), query the player's own listed items (query_my_items), query items listed by a specific seller (query_seller_items), query player mailbox pending mail (query_mailbox), query market statistics (query_market_stats).
  Covered scenarios: use when users ask about money, balance, prices, item prices, what's on the market, if an item is for sale, what am I selling, my items, mailbox, mail, or market statistics.
  Reverse boundary: this skill supports read-only queries only; it does not support purchasing, selling, listing, delisting, transfers, or other write operations (those are handled by MarketActionSkill).

action_descriptions:
  query_balance: |
    Function: query the player's account balance.
    Returned data fields: balance (decimal).
    Trigger: user asks "how much money do I have", "balance", "my money".

  query_price: |
    Function: query the market price for a specified item, supporting multi-item combined queries and quantities. Returns the optimal total price for each item (buying the specified quantity from cheapest to dearest); returns all listed info when stock is insufficient. This is a price query only and cannot be used for purchasing.
    Parameters:
      - item (required, item name): item name and quantity; separate multiple items with English commas, each formatted as "item_name:quantity" (unspecified quantity defaults to :1). E.g. "diamond:2,stick:1".
    Returned data fields: total_price (decimal), item_count (integer); single-item queries also include item_name (string), price (decimal).
    Trigger: user asks about item prices (e.g. "how much is diamond", "how much for 5 sticks").

  query_items: |
    Function: query the full list of items listed on the market.
    Returned data fields: items (array, each element an item name string), count (integer).
    Trigger: user asks "what's on the market", "list all items", "market item list".

  query_availability: |
    Function: query whether a specified item is for sale, the available quantity, and seller info.
    Parameters:
      - item (required, item name): item name.
    Returned data fields: available (boolean: is for sale), total_stock (integer: total available quantity), min_price (decimal: lowest price), max_price (decimal: highest price), seller_count (integer: seller count).
    Trigger: user asks "is anyone selling this item", "is xxx on the market", "is my held item for sale on the market".

  query_my_items: |
    Function: query the player's own listed items.
    Returned data fields: my_items (array, each item has item_name, amount, price, seller_name), count (integer: item count).
    Trigger: user asks "what am I selling", "my items", "what did I list".

  query_seller_items: |
    Function: query items listed by a specific seller.
    Parameters:
      - seller_name (required, player name): seller player name.
    Returned data fields: seller_items (array, each item has item_name, amount, price, seller_name), count (integer: item count).
    Trigger: user asks "what is xxx selling", "xxx's shop", "what does xxx sell".

  query_mailbox: |
    Function: query the player's mailbox pending mail.
    Returned data fields: mails (array, each mail has item_name, amount, sender_name), count (integer: mail count).
    Trigger: user asks "do I have mail", "what's in my mailbox", "check mailbox".

  query_market_stats: |
    Function: query market statistics.
    Returned data fields: total_items (integer: total item count), total_sellers (integer: total seller count).
    Trigger: user asks "how many items on market", "market stats", "market total".

hints:
  - |
    Format specification: entities.item must use English commas to separate multiple items, each formatted as "item_name:quantity" (unspecified quantity defaults to :1), don't use "and/with/&" to connect. E.g. "diamond:2,stick:1".
  - |
    Key requirement: when the user mentions a specific item name, it must be extracted to the entities.item field and cannot be empty. Use query_availability to check if an item is for sale, not query_price.
  - |
    Multi-step tasks: if the user asks "how much is the item in my hand", first call player_inventory.get_player_hand_item to get the item name, then call query_price to check the price.
  - |
    Balance real-time query (mandatory): any time balance is involved (including "what can I afford", "do I have enough money", "how much money do I have left"), you MUST query via query_balance in real-time. It is strictly forbidden to read old balances from conversation history for inference. Balance changes after buying, selling, listing, delisting, and transfers — historical data is stale. If the user's question requires combining balance and item info, use a multi-step task: step_0 query_balance, step_1 query items. Placeholder usage: reference the balance with {step_0.balance}.
  - |
    Currency unit: this server's economy uses $ as the currency symbol (e.g. $100.00). Never use "emerald" or any other Minecraft item name to refer to currency. All prices and amounts are in $ currency.
