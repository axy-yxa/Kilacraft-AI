# MarketQuerySkill Configuration (English)
# This file is auto-generated by the plugin and can be modified

# This description is sent to the LLM to help it understand when to use this skill
description: "Query GlobalMarketPlus plugin information, including player balance, market prices, item listings, item availability, personal items, mailbox, market stats, and other read-only operations. Use this skill when users ask about money, balance, prices, item prices, what's on the market, if an item is for sale, what I'm selling, my items, mailbox, mail, or market statistics."

# Action descriptions (Map format, key=action name, value=action description)
action_descriptions:
  query_balance: "Query player account balance. Returned data contains balance field, available for subsequent step references. Use when user asks 'how much money do I have', 'balance', 'my money'"
  query_price: "Query market price for specified item. Required parameter: item (item name and quantity, format 'item_name:quantity'). Returned data contains total_price, item_count fields, single item queries also include item_name and price fields, available for subsequent step references. Use when user asks about item prices, buying items (e.g. 'buy 5 sticks', 'how much is diamond')"
  query_items: "Query market listed items. Returned data contains items field (item name list) and count field (item count), available for subsequent step references. Use when user asks 'what's on the market', 'list all items', 'market item list'"
  query_availability: "Query if a specified item is for sale, available quantity and seller info. Required parameter: item (item name). Returned data contains available (boolean: is for sale), total_stock (total available quantity), min_price (lowest price), max_price (highest price), seller_count (seller count) fields, available for subsequent step references or as AFK task condition_plan result_path. Use when user asks 'is anyone selling this item', 'is xxx on the market', 'is my held item for sale on the market'"
  query_my_items: "Query player's own listed items. Returned data contains my_items field (item array, each item has item_name, english_name, amount, price, seller_name fields) and count field (item count), available for subsequent step references. Use when user asks 'what am I selling', 'my items', 'what did I list'"
  query_mailbox: "Query player mailbox pending mail. Returned data contains mails field (mail array, each mail has item_name, english_name, amount, sender_name fields) and count field (mail count), available for subsequent step references. Use when user asks 'do I have mail', 'what's in my mailbox', 'check mailbox'"
  query_market_stats: "Query market statistics. Returned data contains total_items field (total item count) and total_sellers field (total seller count), available for subsequent step references or as AFK task condition_plan result_path. Use when user asks 'how many items on market', 'market stats', 'market total'"

# Additional hints (for guiding LLM to use skills correctly)
hints:
  - "**Format specification**: entities.item must use English commas to separate multiple items, each format as 'item_name:quantity' (unspecified quantity defaults to :1), don't use 'and/with/&' to connect. E.g. 'diamond:2,stick:1'"
  - "**Key requirement**: When user mentions a specific item name, it must be extracted to entities.item field, cannot be empty. Use query_availability to check if for sale, not query_price"
  - "**Multi-step tasks**: If user asks 'how much is the item in my hand', need to first call bukkit_api.get_player_hand_item to get item name, then call query_price to check price"
