# MarketActionSkill 技能配置
# 此文件由插件自动生成，可根据需要修改

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: "全球市场操作技能，支持搜索商品（打开购买页面）和上架手中商品。当用户想购买商品、搜索商品、查看商品购买页面时使用 search_item；当用户想上架、出售、卖出手中物品时使用 sell_item。上架时如果未指定价格，会返回市场参考价供用户确认。"

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  search_item: "搜索并打开指定商品的购买页面（GUI）。需要参数：item（物品名称，中英文均可）。执行后会为玩家打开搜索结果 GUI，玩家可自行点击购买。当用户说'帮我买钻石'、'搜索钻石'、'打开市场买xxx'、'想买xxx'时使用"
  sell_item: "上架玩家手中的商品到全球市场。可选参数：price（单价，数字）、quantity（数量，数字）。如果用户未指定价格，会返回 [NEED_INFO] 和市场参考价信息，需要用户确认后再次调用此技能并传入 price 参数。当用户说'帮我卖掉手中的东西'、'上架这个'、'卖掉手中的钻石'、'出售'时使用。注意：物品必须在玩家主手"

# 额外提示信息（用于指导 LLM 正确使用技能）
hints:
  - "**上架流程**：如果 sell_item 返回 [NEED_INFO] 开头的失败消息，说明缺少价格参数，你需要将参考价反馈给用户并询问确认价格，然后用户回答后重新调用 sell_item 并带上 price 参数"
  - "**价格参数**：sell_item 的 price 参数必须是纯数字（如 '100' 或 '50.5'），不要包含货币符号或单位。quantity 同理必须是整数"
  - "**搜索 ≠ 购买**：search_item 只打开 GUI 供玩家自行点击购买，AI 无法代替玩家完成购买操作，请告知玩家在弹出的页面中选购"
  - "**多步骤辅助**：如果用户问'我手上的东西能卖多少钱'，建议先调用 bukkit_api.get_player_hand_item 获取物品名，再调用 market_query.query_price 查询价格，最后告知用户可以调用 sell_item 上架"
