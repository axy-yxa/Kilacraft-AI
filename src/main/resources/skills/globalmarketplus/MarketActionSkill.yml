# MarketActionSkill 技能配置
# 此文件由插件自动生成，可根据需要修改

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: "全球市场操作技能。支持：搜索商品并打开购买页面(search_item)、上架手中商品(sell_item)、领取邮箱物品(pickup_mail)、发起收购/求购(buy_item)、下架指定商品(cancel_listing)、向其他玩家转账(transfer_money)、发起拍卖(auction_item)、批量出售背包内同类物品(sell_inventory)、批量收购背包内同类物品(buy_inventory)。"

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  search_item: "搜索并打开指定商品的购买页面（GUI）。需要参数：item（物品名称，中英文均可）。执行后会为玩家打开搜索结果 GUI，玩家可自行点击购买。当用户说'帮我买钻石'、'搜索钻石'、'打开市场买xxx'、'想买xxx'时使用"
  sell_item: "上架玩家手中的商品到全球市场。可选参数：price（单价，数字）、quantity（数量，数字）。如果用户未指定价格，会返回 [NEED_INFO] 和市场参考价信息，需要用户确认后再次调用此技能并传入 price 参数。当用户说'帮我卖掉手中的东西'、'上架这个'、'卖掉手中的钻石'、'出售'时使用。注意：物品必须在玩家主手"
  pickup_mail: "领取玩家邮箱中的物品。可选参数：target（领取目标，默认为 'all' 全部领取，也可以指定邮件 UID）。当用户说'帮我收邮件'、'领一下邮箱'、'收取邮件'时使用"
  buy_item: "发起物品收购（求购）。需要玩家将目标物品拿在主手中。可选参数：price（收购单价）、quantity（数量，默认1）。如果缺少价格，会返回市场参考价供确认。当用户说'帮我收购钻石'、'我想收铁锭'、'发个求购单'时使用。注意：物品必须在玩家主手"
  cancel_listing: "下架玩家在售的指定商品。可选参数：uid（商品UID或编号）。如果未指定，会返回在售商品列表供用户选择。当用户说'下架那个钻石'、'不卖那个了'、'取消上架'时使用"
  transfer_money: "向其他玩家转账。需要参数：target_player（收款玩家名称）、amount（金额：纯数字，或基于前置查询结果的算术占位符如 {step_0.balance}/3 表示余额的三分之一，系统在执行时自动求值）。当用户说'给Steve转100块'、'付钱给那个人'、'转账'时使用。本动作可能返回 [NEED_INFO] 要求补充金额或确认大额转账；续体由框架自动管理，按消息引导玩家即可（确认/补参无需你重建参数或填写确认标记）"
  auction_item: "发起拍卖。需要玩家将目标物品拿在主手中。可选参数：price（起拍价）、quantity（数量，默认为物品堆叠数）。如果缺少价格，会返回参考价供确认。当用户说'拍卖这把剑'、'起拍价500'、'拿去拍卖'时使用。注意：物品必须在玩家主手"
  sell_inventory: "批量出售物品。需要参数：price（单价）。执行后会为玩家打开批量上架 GUI，玩家在 GUI 中自行放入要出售的物品并确认。当用户说'批量出售'、'批量上架'、'把东西都卖了'时使用"
  buy_inventory: "批量收购物品。需要参数：price（定金/单价）。执行后会为玩家打开批量收购 GUI，玩家在 GUI 中自行放入要收购的物品并确认。当用户说'批量收购'、'大量收'、'我想买别人的东西'时使用"

# 额外提示信息（用于指导 LLM 正确使用技能）
hints:
  - "**上架流程**：如果 sell_item 返回 [NEED_INFO] 开头的消息，说明缺少价格参数，你需要将参考价反馈给用户并询问确认价格，然后用户回答后重新调用 sell_item 并带上 price 参数"
  - "**价格参数**：sell_item/buy_item/auction_item/sell_inventory/buy_inventory 的 price 参数必须是纯数字（如 '100' 或 '50.5'），不要包含货币符号或单位。quantity 同理必须是整数"
  - "**搜索 ≠ 购买**：search_item 只打开 GUI 供玩家自行点击购买，AI 无法代替玩家完成购买操作，请告知玩家在弹出的页面中选购"
  - "**参数真实性原则**：你不得自行编造或猜测任何参数值。所有参数必须来自用户的明确表述。绝对禁止自行填入金额或自行定价。待确认操作的参数与确认由框架续体自动管理，你无需重建参数或填写确认标记"
  - "**主手物品**：sell_item、buy_item、auction_item 都需要玩家先将物品拿在主手中。sell_inventory 和 buy_inventory 不需要手持物品，GUI 打开后玩家自行放入物品"
  - "**下架流程**：cancel_listing 如果返回 [NEED_INFO]，里面包含在售商品列表和编号，用户回复编号后再次调用 cancel_listing 并传入 uid 参数（可以是编号如 '1' 或直接传 UID 数字）"
  - "**多步骤辅助**：如果用户问'我手上的东西能卖多少钱'，建议先调用 bukkit_api.get_player_hand_item 获取物品名，再调用 market_query.query_price 查询价格，最后告知用户可以调用 sell_item 上架"
  - "**转账流程**：(1) 模糊金额（'全部'、'一半'、'三分之一'等）必须用多步骤任务：step_0 调用 market_query.query_balance 查询余额，step_1 调用 market_action.transfer_money。amount 用算术占位符表达比例（{step_0.balance} 表示全部、{step_0.balance}/2 一半、{step_0.balance}/3 三分之一），系统求值后 transfer_money 会返回 [NEED_INFO] 显示具体金额供用户确认（钱转走前必显式确认）。仅当比例无法用单次二元运算（+ - * /）表达时，才先告知用户余额并询问具体数额。(1.5) 若 market_query 不在【可用技能列表】中（无法查余额），严禁使用 {step_} 占位符——改用单步 transfer_money 且 amount 留空，系统会返回 [NEED_INFO] 询问玩家具体金额。(2) 严禁从历史对话提取旧的 amount 值猜测当前余额，余额是实时变化的，必须现场查询。(3) 用户确认或补值时框架会自动用已快照的参数恢复执行，你无需重建参数或填写 confirmed"
  - "**货币单位**：本服经济系统的货币符号为 $（如 $100.00）。绝对不要使用'绿宝石'、'emerald'或其他 Minecraft 物品名称指代货币，所有金额都是 $ 货币单位"
