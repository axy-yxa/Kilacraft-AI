# ═══════════════════════════════════════════════════════════
# 全球市场操作技能（MarketActionSkill）
# 对接 GlobalMarketPlus 插件的写操作：搜索/上架/收购/下架/邮箱/转账/拍卖/批量出售/批量收购。
# 依赖：第三方插件 GlobalMarketPlus（isAvailable 运行时闸门）。
# 权限：kilacraft.market_action 为基础权限。
# ═══════════════════════════════════════════════════════════

description: |
  全球市场写操作技能（对接 GlobalMarketPlus 插件）。向市场执行写入类操作：搜索商品并打开购买页面（search_item）、上架主手物品（sell_item）、领取邮箱物品（pickup_mail）、发起收购/求购（buy_item）、下架商品（cancel_listing）、向其他玩家转账（transfer_money）、发起拍卖（auction_item）、批量出售背包同类物品（sell_inventory）、批量收购背包同类物品（buy_inventory）。
  触发场景：用户表达"卖/买/上架/下架/拍卖/转账/收邮件"等写入意图时使用。
  反向边界：本技能仅负责写入操作。只读查询（余额、物价、商品列表、统计等）由 MarketQuerySkill 负责——请勿用本技能查价或查余额。

action_descriptions:
  search_item: |
    功能：搜索并打开指定商品的购买页面（GUI），执行后为玩家打开搜索结果 GUI，玩家自行点击购买。
    参数：
      - item（必填，物品名）：物品名称，中英文均可。
    触发场景：用户说"帮我买钻石"、"搜索钻石"、"打开市场买 xxx"、"想买 xxx"。

  sell_item: |
    功能：上架玩家主手中的商品到全球市场。
    参数：
      - price（可选，数值（小数））：单价；缺失时返回 [NEED_INFO] 与市场参考价，需用户确认后带 price 重新调用。
      - quantity（可选，默认物品堆叠数，数值（整数））：数量。
    前置条件：物品必须在玩家主手（sell_inventory/buy_inventory 不需要）。
    触发场景：用户说"帮我卖掉手中的东西"、"上架这个"、"卖掉手中的钻石"、"出售"。

  pickup_mail: |
    功能：领取玩家邮箱中的物品。
    参数：
      - target（可选，默认 all，字符串）：领取目标，"all" 为全部领取，也可指定邮件 UID。
    触发场景：用户说"帮我收邮件"、"领一下邮箱"、"收取邮件"。

  buy_item: |
    功能：发起物品收购（求购）。
    参数：
      - price（可选，数值（小数））：收购单价；缺失时返回市场参考价供确认。
      - quantity（可选，默认 1，数值（整数））：数量。
    前置条件：物品必须在玩家主手。
    触发场景：用户说"帮我收购钻石"、"我想收铁锭"、"发个求购单"。

  cancel_listing: |
    功能：下架玩家在售的指定商品。
    参数：
      - uid（可选，字符串）：商品 UID 或编号；未指定时返回在售商品列表供用户选择。
    触发场景：用户说"下架那个钻石"、"不卖那个了"、"取消上架"。

  transfer_money: |
    功能：向其他玩家转账。
    参数：
      - target_player（必填，玩家名）：收款玩家名称。
      - amount（可选，数值（小数））：金额，纯数字或基于前置查询结果的算术占位符（如 {step_0.balance}/3 表示余额的三分之一，系统执行时自动求值）；缺失时返回 [NEED_INFO] 引导玩家补充。
    可能返回 [NEED_INFO] 要求补充金额或确认大额转账；续体由框架自动管理，按消息引导玩家即可（确认/补参无需重建参数或填写确认标记）。
    触发场景：用户说"给 Steve 转 100 块"、"付钱给那个人"、"转账"。

  auction_item: |
    功能：发起拍卖。
    参数：
      - price（可选，数值（小数））：起拍价；缺失时返回参考价供确认。
      - quantity（可选，默认物品堆叠数，数值（整数））：数量。
    前置条件：物品必须在玩家主手。
    触发场景：用户说"拍卖这把剑"、"起拍价 500"、"拿去拍卖"。

  sell_inventory: |
    功能：批量出售物品，执行后为玩家打开批量上架 GUI，玩家在 GUI 中自行放入要出售的物品并确认。
    参数：
      - price（必填，数值（小数））：单价。
    触发场景：用户说"批量出售"、"批量上架"、"把东西都卖了"。

  buy_inventory: |
    功能：批量收购物品，执行后为玩家打开批量收购 GUI，玩家在 GUI 中自行放入要收购的物品并确认。
    参数：
      - price（必填，数值（小数））：定金/单价。
    触发场景：用户说"批量收购"、"大量收"、"我想买别人的东西"。

hints:
  - |
    上架流程：如果 sell_item 返回 [NEED_INFO] 开头的消息，说明缺少价格参数，你需要将参考价反馈给用户并询问确认价格，然后用户回答后重新调用 sell_item 并带上 price 参数。
  - |
    价格参数：sell_item/buy_item/auction_item/sell_inventory/buy_inventory 的 price 参数必须是纯数字（如 "100" 或 "50.5"），不要包含货币符号或单位。quantity 同理必须是整数。
  - |
    搜索 ≠ 购买：search_item 只打开 GUI 供玩家自行点击购买，AI 无法代替玩家完成购买操作，请告知玩家在弹出的页面中选购。
  - |
    参数真实性原则：你不得自行编造或猜测任何参数值。所有参数必须来自用户的明确表述。绝对禁止自行填入金额或自行定价。待确认操作的参数与确认由框架续体自动管理，你无需重建参数或填写确认标记。
  - |
    主手物品：sell_item、buy_item、auction_item 都需要玩家先将物品拿在主手中。sell_inventory 和 buy_inventory 不需要手持物品，GUI 打开后玩家自行放入物品。
  - |
    下架流程：cancel_listing 如果返回 [NEED_INFO]，里面包含在售商品列表和编号，用户回复编号后再次调用 cancel_listing 并传入 uid 参数（可以是编号如 "1" 或直接传 UID 数字）。
  - |
    多步骤辅助：如果用户问"我手上的东西能卖多少钱"，建议先调用 bukkit_api.get_player_hand_item 获取物品名，再调用 market_query.query_price 查询价格，最后告知用户可以调用 sell_item 上架。
  - |
    转账流程：(1) 模糊金额（"全部"、"一半"、"三分之一"等）必须用多步骤任务：step_0 调用 market_query.query_balance 查询余额，step_1 调用 market_action.transfer_money。amount 用算术占位符表达比例（{step_0.balance} 表示全部、{step_0.balance}/2 一半、{step_0.balance}/3 三分之一），系统求值后 transfer_money 会返回 [NEED_INFO] 显示具体金额供用户确认（钱转走前必显式确认）。仅当比例无法用单次二元运算（+ - * /）表达时，才先告知用户余额并询问具体数额。(1.5) 若 market_query 不在【可用技能列表】中（无法查余额），严禁使用 {step_} 占位符——改用单步 transfer_money 且 amount 留空，系统会返回 [NEED_INFO] 询问玩家具体金额。(2) 严禁从历史对话提取旧的 amount 值猜测当前余额，余额是实时变化的，必须现场查询。(3) 用户确认或补值时框架会自动用已快照的参数恢复执行，你无需重建参数或填写 confirmed。
  - |
    货币单位：本服经济系统的货币符号为 $（如 $100.00）。绝对不要使用"绿宝石"、"emerald"或其他 Minecraft 物品名称指代货币，所有金额都是 $ 货币单位。
