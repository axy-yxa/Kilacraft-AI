# MarketQuerySkill 技能配置
# 此文件由插件自动生成，可根据需要修改

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: "查询全球市场插件信息，包括玩家余额、市场价格、商品列表、商品是否在售、个人商品、邮箱、市场统计等只读查询操作。此技能仅支持查询，不支持购买、出售、上架等写入操作。当用户询问金钱、余额、物价、商品价格、市场有什么物品、某物品有没有在卖、我在卖什么、我的商品、邮箱、邮件、市场统计时使用此技能。"

# 动作描述（Map 格式，key=动作名称，value=动作描述）
# 每个动作的描述会发送给LLM，帮助其选择正确的action并提取参数
action_descriptions:
  query_balance: "查询玩家账户余额。返回的 data 中包含 balance 字段，可供后续步骤引用。当用户问'我有多少钱'、'余额'、'我的钱'时使用"
  query_price: "查询指定物品的市场价格。需要参数：item（物品名称和数量，格式为'物品名:数量'）。返回的 data 中包含 total_price、item_count 字段，单物品查询时还包含 item_name 和 price 字段，可供后续步骤引用。当用户询问物品价格（如'钻石多少钱'、'5 个木棍多少钱'）时使用。注意：此操作仅为价格查询，不能用于购买"
  query_items: "查询市场上架的商品列表。返回的 data 中包含 items 字段（商品名称列表）和 count 字段（商品数量），可供后续步骤引用。当用户问'市场上有什么'、'列出所有商品'、'市场商品列表'时使用"
  query_availability: "查询指定物品是否在售、在售数量和卖家信息。需要参数：item（物品名称）。返回的 data 中包含 available（布尔：是否在售）、total_stock（数值：在售总数量）、min_price（数值：最低价）、max_price（数值：最高价）、seller_count（数值：卖家数）字段，可供后续步骤引用或作为玩家自定义监听（WatchSkill polling 模式）的 result_path。当用户问'这个物品有人卖吗'、'市场上有没有xxx'、'我手上的东西市场有卖吗'时使用"
  query_my_items: "查询玩家自己在售的商品。返回的 data 中包含 my_items 字段（商品数组，每个商品包含 item_name、english_name、amount、price、seller_name 字段）和 count 字段（商品数量），可供后续步骤引用。当用户问'我在卖什么'、'我的商品'、'我上架了什么'时使用"
  query_seller_items: "查询指定卖家在售的商品。需要参数：seller_name（卖家玩家名称）。返回的 data 中包含 seller_items 字段（商品数组，每个商品包含 item_name、english_name、amount、price、seller_name 字段）和 count 字段（商品数量），可供后续步骤引用。当用户问'xxx在卖什么'、'xxx的商店'、'xxx卖什么呢'时使用"
  query_mailbox: "查询玩家邮箱待领取邮件。返回的 data 中包含 mails 字段（邮件数组，每封邮件包含 item_name、english_name、amount、sender_name 字段）和 count 字段（邮件数量），可供后续步骤引用。当用户问'我有邮件吗'、'邮箱里有什么'、'查邮箱'时使用"
  query_market_stats: "查询市场统计信息。返回的 data 中包含 total_items 字段（数值：商品总数）和 total_sellers 字段（数值：卖家总数），可供后续步骤引用或作为玩家自定义监听（WatchSkill polling 模式）的 result_path。当用户问'市场有多少商品'、'市场统计'、'市场总数'时使用"

# 额外提示信息（用于指导 LLM 正确使用技能）
hints:
  - "**格式规范**：entities.item 必须用英文逗号分隔多个物品，每个格式为'物品名:数量'（未指定数量默认:1），不要用'和/与/及'连接。如'钻石:2,木棍:1'"
  - "**关键要求**：用户提到具体物品名时必须提取到 entities.item 字段，不能为空。查询是否在售用 query_availability 而非 query_price"
  - "**多步骤任务**：如果用户问'我手上的东西多少钱'，需要先调用 bukkit_api.get_player_hand_item 获取物品名，再调用 query_price 查询价格"
  - "**余额实时查询（强制）**：任何时候涉及到余额（包括'我能买什么'、'我够不够钱'、'我还有多少钱'等），都必须通过 query_balance 实时查询，严禁从历史对话中读取旧余额进行推算。余额在买卖、上下架、转账后都会变化，历史数据已经失效。如果用户的问题需要结合余额和商品信息，必须用多步骤任务：step_0 查询余额，step_1 查询商品"
  - "**货币单位**：本服经济系统的货币符号为 $（如 $100.00）。绝对不要使用'绿宝石'、'emerald'或其他 Minecraft 物品名称指代货币，所有金额都是 $ 货币单位"
