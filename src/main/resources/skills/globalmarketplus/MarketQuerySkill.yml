# MarketQuerySkill 技能配置
# 此文件由插件自动生成，可根据需要修改

# 此描述会发送给LLM，帮助其理解何时调用此技能
description: "查询全球市场插件信息，包括玩家余额、市场价格、商品列表、商品是否在售、个人商品、邮箱、市场统计等只读操作。当用户询问金钱、余额、物价、商品价格、市场有什么物品、某物品有没有在卖、我在卖什么、我的商品、邮箱、邮件、市场统计时使用此技能。"

# 动作描述（Map 格式，key=动作名称，value=动作描述）
# 每个动作的描述会发送给LLM，帮助其选择正确的action并提取参数
action_descriptions:
  query_balance: "查询玩家账户余额。返回的 data 中包含 balance 字段，可供后续步骤引用。当用户问'我有多少钱'、'余额'、'我的钱'时使用"
  query_price: "查询指定物品的市场价格。需要参数：item（物品名称和数量，格式为'物品名:数量'）。返回的 data 中包含 total_price、item_count 字段，单物品查询时还包含 item_name 和 price 字段，可供后续步骤引用。当用户询问物品价格、购买物品（如'买 5 个木棍'、'钻石多少钱'）时使用"
  query_items: "查询市场上架的商品列表。当用户问'市场上有什么'、'列出所有商品'、'市场商品列表'时使用"
  query_availability: "查询指定物品是否在售、在售数量和卖家信息。需要参数：item（物品名称）。当用户问'这个物品有人卖吗'、'市场上有没有xxx'、'我手上的东西市场有卖吗'时使用"
  query_my_items: "查询玩家自己在售的商品。当用户问'我在卖什么'、'我的商品'、'我上架了什么'时使用"
  query_mailbox: "查询玩家邮箱待领取邮件。当用户问'我有邮件吗'、'邮箱里有什么'、'查邮箱'时使用"
  query_market_stats: "查询市场统计信息。当用户问'市场有多少商品'、'市场统计'、'市场总数'时使用"

# 额外提示信息（用于指导 LLM 正确使用技能）
hints:
  - "所有市场查询都是只读操作，不会消耗玩家物品或金钱"
  - "**重要格式规范**：当用户询问多个物品时，entities.item 字段必须使用英文逗号 ',' 分隔每个物品"
  - "**重要格式规范**：每个物品的格式为'物品名称：数量'，例如：'木棍:2，钻石:1'"
  - "**重要格式规范**：如果用户没有指定数量，默认数量为 1，例如：'钻石'应写为'钻石:1'"
  - "**重要格式规范**：不要使用'和'、'与'、'及'等连接词，统一用逗号分隔"
  - "**关键要求**：当用户输入中提到具体物品名称时，必须提取到 entities.item 字段，不能为空"
  - "**动作选择**：当用户想知道某物品是否在售、有多少人在卖时，使用 query_availability 而不是 query_price"
  - "**多步骤任务**：如果用户问'我手上的东西多少钱'，需要先调用 bukkit_api.get_player_hand_item 获取物品名，再调用 query_price 查询价格"

# 返回消息模板（支持自定义 value，key 是预定义的）
# 支持变量占位符：{balance}, {item}, {price}, {error}
response_messages:
  # 通用消息
  unknown_action: "抱歉，我还不会查询其他市场信息。你可以问我：'我的余额是多少'、'市场上有什么商品'等"
  query_error: "查询失败：{error}"
  
  # 查询余额
  balance_not_player: "请在游戏中使用此功能"
  balance_api_error: "无法获取余额信息，请确保 GlobalMarketPlus 插件已正确安装"
  balance_success: "§f你的余额为：§a${balance}"
  
  # 查询价格
  price_no_item: "请指定要查询的物品名称，例如：'钻石的价格'"
  price_not_found: "未找到物品 '{item}' 的价格信息"
  price_success: "§f{item} 当前价格：§a${price}"
  
  # 查询商品列表
  items_empty: "§f市场上暂无商品"
  items_header: "§f市场商品列表:\n"
  items_format: "§7- "
  
  # 查询商品是否在售
  availability_no_item: "请指定要查询的物品名称"
