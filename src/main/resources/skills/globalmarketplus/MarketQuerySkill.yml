# MarketQuerySkill 技能配置
# 此文件由插件自动生成，可根据需要修改

# 技能描述（用于 LLM 意图识别）
description: "查询全球市场插件信息，包括玩家余额、市场价格、商品列表等只读操作。当用户询问金钱、余额、物价、商品价格、市场有什么物品时使用此技能。"

# 动作描述（Map 格式，key=动作名称，value=动作描述）
action_descriptions:
  query_balance: "查询玩家账户余额，当用户问'我有多少钱'、'余额'时使用"
  query_price: "查询指定物品的市场价格，当用户询问物品价格、购买物品（如'买 5 个木棍'、'钻石多少钱'）时使用，需提取物品名称和数量"
  query_items: "查询市场上架的商品列表，当用户问'市场上有什么'、'列出所有商品'时使用"

# 返回消息模板（支持自定义 value，key 是预定义的）
# 支持变量占位符：{balance}, {item}, {price}, {error}
response_messages:
  # 通用消息
  unknown_action: "抱歉，我还不会查询其他市场信息。你可以问我：'我的余额是多少'、'市场上有什么商品'等"
  query_error: "查询失败：{error}"
  
  # 查询余额
  balance_not_player: "请在游戏中使用此功能"
  balance_api_error: "无法获取余额信息，请确保 GlobalMarketPlus 插件已正确安装"
  balance_success: "§e[GlobalMarketPlus] §f你的余额为：§a${balance}"
  
  # 查询价格
  price_no_item: "请指定要查询的物品名称，例如：'钻石的价格'"
  price_not_found: "未找到物品 '{item}' 的价格信息"
  price_success: "§e[GlobalMarketPlus] §f{item} 当前价格：§a${price}"
  
  # 查询商品列表
  items_empty: "§e[GlobalMarketPlus] §f市场上暂无商品"
  items_header: "§e[GlobalMarketPlus] §f市场商品列表:\n"
  items_format: "§7- "
