# ═══════════════════════════════════════════════════════════
# 全球市场查询技能（MarketQuerySkill）
# 对接 GlobalMarketPlus 插件的只读查询：余额/价格/商品列表/在售情况/个人商品/卖家商品/邮箱/市场统计。
# 依赖：第三方插件 GlobalMarketPlus（isAvailable 运行时闸门）。
# 权限：kilacraft.market.query 为基础权限。
# ═══════════════════════════════════════════════════════════

description: |
  全球市场查询技能。支持：查询玩家账户余额（query_balance）、查询指定物品市场价格（query_price）、查询市场上架商品列表（query_items）、查询指定物品是否在售及卖家信息（query_availability）、查询玩家自己在售商品（query_my_items）、查询指定卖家在售商品（query_seller_items）、查询玩家邮箱待领取邮件（query_mailbox）、查询市场统计信息（query_market_stats）。
  覆盖场景：用户询问金钱、余额、物价、商品价格、市场上有什么、某物品有没有在卖、我在卖什么、我的商品、邮箱、邮件、市场统计时使用。
  反向边界：此技能仅支持只读查询，不支持购买、出售、上架、下架、转账等写入操作（写操作由 MarketActionSkill 负责）。

action_descriptions:
  query_balance: |
    功能：查询玩家账户余额。
    返回 data 字段：balance（数值（小数））。
    触发场景：用户问"我有多少钱"、"余额"、"我的钱"。

  query_price: |
    功能：查询指定物品的市场价格，支持多物品联合查询和数量。返回每个物品的最优总价（从便宜到贵购买指定数量），库存不足时返回所有在售信息。此操作仅为价格查询，不能用于购买。
    参数：
      - item（必填，物品名）：物品名称与数量，多个物品用英文逗号分隔，每个格式为"物品名:数量"（未指定数量默认 :1）。如"钻石:2,木棍:1"。
    返回 data 字段：total_price（数值（小数））、item_count（数值（整数））；单物品查询时还包含 item_name（字符串）、price（数值（小数））。
    触发场景：用户询问物品价格（如"钻石多少钱"、"5 个木棍多少钱"）。

  query_items: |
    功能：查询市场上架的全部商品列表。
    返回 data 字段：items（数组，元素为商品名称字符串）、count（数值（整数））。
    触发场景：用户问"市场上有什么"、"列出所有商品"、"市场商品列表"。

  query_availability: |
    功能：查询指定物品是否在售、在售数量和卖家信息。
    参数：
      - item（必填，物品名）：物品名称。
    返回 data 字段：available（布尔：是否在售）、total_stock（数值（整数）：在售总数量）、min_price（数值（小数）：最低价）、max_price（数值（小数）：最高价）、seller_count（数值（整数）：卖家数）。
    触发场景：用户问"这个物品有人卖吗"、"市场上有没有 xxx"、"我手上的东西市场有卖吗"。

  query_my_items: |
    功能：查询玩家自己在售的商品。
    返回 data 字段：my_items（数组，每项含 item_name、amount、price、seller_name）、count（数值（整数）：商品数量）。
    触发场景：用户问"我在卖什么"、"我的商品"、"我上架了什么"。

  query_seller_items: |
    功能：查询指定卖家在售的商品。
    参数：
      - seller_name（必填，玩家名）：卖家玩家名称。
    返回 data 字段：seller_items（数组，每项含 item_name、amount、price、seller_name）、count（数值（整数）：商品数量）。
    触发场景：用户问"xxx 在卖什么"、"xxx 的商店"、"xxx 卖什么呢"。

  query_mailbox: |
    功能：查询玩家邮箱待领取邮件。
    返回 data 字段：mails（数组，每项含 item_name、amount、sender_name）、count（数值（整数）：邮件数量）。
    触发场景：用户问"我有邮件吗"、"邮箱里有什么"、"查邮箱"。

  query_market_stats: |
    功能：查询市场统计信息。
    返回 data 字段：total_items（数值（整数）：商品总数）、total_sellers（数值（整数）：卖家总数）。
    触发场景：用户问"市场有多少商品"、"市场统计"、"市场总数"。

hints:
  - |
    格式规范：entities.item 必须用英文逗号分隔多个物品，每个格式为"物品名:数量"（未指定数量默认 :1），不要用"和/与/及"连接。如"钻石:2,木棍:1"。
  - |
    关键要求：用户提到具体物品名时必须提取到 entities.item 字段，不能为空。查询是否在售用 query_availability 而非 query_price。
  - |
    多步骤任务：如果用户问"我手上的东西多少钱"，需要先调用 player_inventory.get_player_hand_item 获取物品名，再调用 query_price 查询价格。
  - |
    余额实时查询（强制）：任何时候涉及到余额（包括"我能买什么"、"我够不够钱"、"我还有多少钱"等），都必须通过 query_balance 实时查询，严禁从历史对话中读取旧余额进行推算。余额在买卖、上下架、转账后都会变化，历史数据已经失效。如果用户的问题需要结合余额和商品信息，必须用多步骤任务：step_0 查询余额，step_1 查询商品。占位符用法：用 {step_0.balance} 引用余额。
  - |
    货币单位：本服经济系统的货币符号为 $（如 $100.00）。绝对不要使用"绿宝石"、"emerald"或其他 Minecraft 物品名称指代货币，所有金额都是 $ 货币单位。
