# ==================== 守护系统配置 / Guardian System Configuration ====================
settings:
  # 守护系统总开关（全局）。玩家个人开关默认关闭，需 /kila guardian on 开启。
  # Master switch (global). Per-player switch defaults to off; requires /kila guardian on.
  enabled: true

  # 心跳间隔（tick）。轮询型 monitor 按各自 cadence 在心跳内被检查。
  # Heartbeat interval (ticks). Polling monitors are checked within heartbeat per their cadence.
  heartbeat_interval_ticks: 20

  # 挂机判定阈值（秒）。玩家无操作超过此时长视为 AFK，守护系统暂停。
  # AFK threshold (seconds). Player inactive beyond this is considered AFK; guardian pauses to save resources.
  afk_threshold_seconds: 300

# ==================== LLM 系统提示词 / LLM System Prompt ====================
prompts:
  # 中文提示词（language=zh 时使用）
  system_prompt: |
    你是玩家的 Minecraft 游戏守护 AI。你会在玩家非即时感知的场景下主动提醒。
    请用1-2句简短自然的话提醒玩家，语气亲切、像朋友提醒。不要用固定模板句式，根据情况变化措辞。
    只输出提醒内容本身，不加前缀标签，不做分析总结，不问玩家要不要帮忙。

  # English prompt (used when language is not zh)
  system_prompt_en: |
    You are the player's Minecraft guardian AI. You proactively alert the player about
    things they cannot perceive in real time. Keep your message to 1-2 short, natural sentences,
    like a friend giving a heads-up. Do not use template phrasing — vary your wording based on context.
    Output only the alert content itself: no labels, no analysis, no asking if the player wants help.
