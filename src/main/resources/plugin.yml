# 插件名称
name: Kilacraft-AI
# 插件版本号
version: '1.4.6'
# 主类路径（插件入口）
main: com.zm.kilacraftAI.KilacraftAI
# Bukkit API 版本（支持的最低服务端版本）
api-version: '1.16'
# 声明支持 Folia 区域化线程调度
folia-supported: true
# 作者信息
author: Zm_Mmm
# 插件描述
description: "一款强大的 Minecraft AI Agent 插件，基于 LLM 意图识别与技能执行框架，支持自然语言交互、多步骤任务规划、挂机任务系统、知识库增强等功能。"
# 插件加载时机（POSTWORLD 表示在世界加载后加载，确保依赖插件已加载）
load: POSTWORLD
# 软依赖列表（如果这些插件存在则会集成其功能）
softdepend:
  - MythicMobs          # MythicMobs 怪物插件，用于占位符功能
  - GlobalMarketPlus    # GlobalMarketPlus 市场插件，用于经济系统功能
  - Vault               # Vault 经济接口，用于多货币支持
  - CMI                 # CMI 管理插件，用于传送/家/地标等功能

# 命令定义
commands:
  kilacraft:
    description: 与 AI 对话
    usage: /<command> <消息>   # 命令使用格式说明
    aliases: [ kila, ai, zm ]    # 命令别名（可以使用/kila、/ai、/zm 代替/kilacraft）

# 权限节点定义
permissions:
  kilacraft.clear.self:
    description: 允许清除自己的对话历史
    default: true              # 默认拥有此权限（所有玩家可用）
  kilacraft.clear.other:
    description: 允许清除其他玩家的对话历史
    default: op                # 默认仅 OP 拥有此权限
  kilacraft.reload:
    description: 允许重载配置
    default: op                # 默认仅 OP 拥有此权限
  kilacraft.knowledge:
    description: 允许管理知识库
    default: op                # 默认仅 OP 拥有此权限
  kilacraft.personalities:
    description: 允许管理人格配置
    default: op                # 默认仅 OP 拥有此权限
  kilacraft.afk:
    description: 允许查询和取消挂机任务
    default: true              # 默认所有玩家可用

  # Bukkit API 技能权限（按功能类别分组）
  # 玩家相关 API 分为三类：inventory(物品栏)、status(实时状态)、info(基础信息)
  kilacraft.api.player.inventory:
    description: 查询玩家物品栏（主手/副手物品）
    default: true
  kilacraft.api.player.status:
    description: 查询玩家实时状态（生命值、饥饿、氧气、经验、睡眠、攻击冷却、着火、冰冻、挂机等）
    default: true
  kilacraft.api.player.info:
    description: 查询玩家基础信息（位置、游戏模式、飞行、Ping、客户端、载具、死亡点等）
    default: true
  kilacraft.api.world.info:
    description: 查询世界信息（时间、天气、世界类型、种子、出生点、高度限制、生物生成、PVP等）
    default: true
  kilacraft.api.server.info:
    description: 查询服务器信息（在线玩家、最大人数、版本、MOTD、世界列表、服务器设置、TPS等）
    default: true
  kilacraft.api.*:
    description: 允许使用所有 Bukkit API 技能（包含以上全部）
    default: true
    children:
      kilacraft.api.player.inventory: true
      kilacraft.api.player.status: true
      kilacraft.api.player.info: true
      kilacraft.api.world.info: true
      kilacraft.api.server.info: true

  # CMI 插件技能权限
  kilacraft.cmi.query:
    description: 查询 CMI 信息（家、地标、玩家信息、物品价值、套装列表等）
    default: true
  kilacraft.cmi.teleport:
    description: 使用 CMI 传送功能（回家、地标传送、传送请求）
    default: true
  kilacraft.cmi.*:
    description: 允许使用所有 CMI 技能（包含以上全部）
    default: true
    children:
      kilacraft.cmi.query: true
      kilacraft.cmi.teleport: true

  # 命令执行技能权限
  kilacraft.command.execute:
    description: 允许 AI 帮助执行服务器命令（以玩家身份执行，受服务器权限约束）
    default: op                # 默认仅 OP 拥有此权限，服主可按需开放

  # Bukkit 音效与粒子效果技能权限
  kilacraft.bukkit_fx:
    description: 允许播放音效和显示粒子效果（仅自己听到/看到）
    default: true              # 默认所有玩家可用

  # Bukkit 原版统计数据查询权限
  kilacraft.bukkit_stats:
    description: 允许查询 Minecraft 原版统计数据（生涯累计统计）
    default: true              # 默认所有玩家可用