name: Kilacraft-AI
version: '1.2.0'
main: com.zm.kilacraftAI.KilacraftAI
api-version: '1.21'
author: Zm_Mmm
description: Kilacraft 服务器 AI 插件

commands:
  kilacraft:
    description: 与 AI 对话
    usage: /<command> <消息>
    aliases: [kila, ai, zm]

permissions:
  kilacraft.use:
    description: 允许使用 kilacraft 命令
    default: true
  kilacraft.clear.self:
    description: 允许清除自己的对话历史
    default: true
  kilacraft.clear.other:
    description: 允许清除其他玩家的对话历史
    default: op
  kilacraft.reload:
    description: 允许重载配置
    default: op
  kilacraft.knowledge:
    description: 允许管理知识库
    default: op
  kilacraft.personalities:
    description: 允许管理人格配置
    default: op