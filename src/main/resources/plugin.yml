name: Kilacraft-AI
version: '1.2.0'
main: com.zm.kilacraftAI.KilacraftAI
api-version: '1.21'
author: Zm_Mmm
description: Kilacraft 服务器 AI 插件

commands:
  kilacraft:
    description: 与 AI 对话
    usage: /<command> <消息>
    aliases: [kila, ai, zm]

permissions:
  kilacraft.use:
    description: 允许使用kilacraft命令
    default: true
  kilacraft.reload:
    description: 允许重载配置
    default: op