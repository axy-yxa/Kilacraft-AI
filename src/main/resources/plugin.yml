# 插件名称 / Plugin Name
name: ${project.name}
# 插件版本号 / Plugin version number
version: '${project.version}'
# 主类路径 / Main class path
main: com.zm.kilacraftAI.KilacraftAI
# Bukkit API 版本 / Bukkit API version
api-version: '1.16'
# 声明支持 Folia 区域化线程调度 / Declare support for Folia regionalized thread scheduling
folia-supported: true
# 作者 / author
author: Zm_Mmm
# 描述 / description
description: ${project.description}
# 加载时机 / Loading timing
load: POSTWORLD
# 软依赖列表 / Soft Dependency List
softdepend:
  - MythicMobs
  - GlobalMarketPlus
  - Vault
  - CMI
  - Spark

# 命令定义 / command definition
commands:
  kilacraft:
    description: 与 AI 对话
    usage: /<command> <消息>
    aliases: [ kila, ai, zm ]

# 权限节点定义 / Definition of permission nodes
permissions:
  kilacraft.clear.self:
    description: 允许清除自己的对话历史
    default: true              # 所有玩家可用 / available to all players
  kilacraft.clear.other:
    description: 允许清除其他玩家的对话历史
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.reload:
    description: 允许重载配置
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.knowledge:
    description: 允许管理知识库
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.personalities:
    description: 允许管理人格配置
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.tasks:
    description: 允许查看定时任务运行状态
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.player_watch:
    description: 允许订阅其他玩家上线/下线通知
    default: true              # 所有玩家可用 / available to all players
  kilacraft.watch:
    description: 允许使用玩家自定义监听系统
    default: true              # 所有玩家可 / available to all players

  # 查询类命令权限（用量 / 对话历史 / 画像） / Query command permissions (usage / history / profile)
  kilacraft.query.self:
    description: 查看自己的 AI 数据（用量 / 对话历史 / 画像）
    default: true              # 所有玩家可用 / available to all players
  kilacraft.usage.other:
    description: 查看任意玩家的 AI 用量统计及全服概览
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.history.other:
    description: 查看任意玩家的对话历史
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.memory.other:
    description: 查看任意玩家的玩家画像 / AI 记忆
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission

  # Bukkit API 技能权限（按功能类别分组）
  # 玩家相关 API 分为三类：inventory(物品栏)、status(实时状态)、info(基础信息)
  # Bukkit API skill permissions (grouped by functional category)
  # Player related APIs are divided into three categories: inventory, status, and info
  kilacraft.api.player.inventory:
    description: 查询玩家物品栏（主手/副手物品）
    default: true
  kilacraft.api.player.status:
    description: 查询玩家实时状态（生命值、饥饿、氧气、经验、睡眠、攻击冷却、着火、冰冻、挂机等）
    default: true
  kilacraft.api.player.info:
    description: 查询玩家基础信息（位置、游戏模式、飞行、Ping、客户端、载具、死亡点等）
    default: true
  kilacraft.api.world.info:
    description: 查询世界信息（时间、天气、世界类型、种子、出生点、高度限制、生物生成、PVP等）
    default: true
  kilacraft.api.server.info:
    description: 查询服务器信息（在线玩家、最大人数、版本、MOTD、世界列表、服务器设置、TPS等）
    default: true
  kilacraft.api.*:
    description: 允许使用所有 Bukkit API 技能（包含以上全部）
    default: true
    children:
      kilacraft.api.player.inventory: true
      kilacraft.api.player.status: true
      kilacraft.api.player.info: true
      kilacraft.api.world.info: true
      kilacraft.api.server.info: true

  # CMI 插件技能权限 / CMI plugin skill permissions
  kilacraft.cmi.query:
    description: 查询 CMI 信息（家、地标、玩家信息、物品价值、套装列表等）
    default: true
  kilacraft.cmi.teleport:
    description: 使用 CMI 传送功能（回家、地标传送、传送请求）
    default: true
  kilacraft.cmi.*:
    description: 允许使用所有 CMI 技能（包含以上全部）
    default: true
    children:
      kilacraft.cmi.query: true
      kilacraft.cmi.teleport: true

  # 命令执行技能权限 / Command execution skill permissions
  kilacraft.command.execute:
    description: 允许 AI 帮助执行服务器命令（以玩家身份执行，受服务器权限约束）
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission

  # Bukkit 音效与粒子效果技能权限 / Bukkit sound effects and particle effects skill permissions
  kilacraft.bukkit_fx:
    description: 允许播放音效和显示粒子效果（仅自己听到/看到）
    default: true              # 所有玩家可用 / available to all players

  # Bukkit 原版统计数据查询权限 / Bukkit original statistical data query permission
  kilacraft.bukkit_stats:
    description: 允许查询 Minecraft 原版统计数据（生涯累计统计）
    default: true              # 所有玩家可用 / available to all players

  # 通用工具技能权限（按动作细分） / General tool skill permissions (subdivided by action)
  kilacraft.utility:
    description: 允许使用 AI 通用工具技能（延迟等待、主动通知等）
    default: true              # 所有玩家可用 / available to all players
  kilacraft.utility.delay_wait:
    description: 允许使用 AI 工具技能的延迟等待功能
    default: true              # 所有玩家可用 / available to all players
  kilacraft.utility.notify_player:
    description: 允许使用 AI 工具技能的主动中途通知功能
    default: true              # 所有玩家可用 / available to all players
  kilacraft.utility.broadcast:
    description: 允许使用 AI 工具技能的全服广播功能（仅限 OP 管理员使用）
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission

  # 市场技能权限（GlobalMarketPlus） / Market Skills Authority (GlobalMarketPlus)
  kilacraft.market.query:
    description: 允许使用 AI 查询市场信息（余额、价格、商品等）
    default: true              # 所有玩家可用 / available to all players
  kilacraft.market.action:
    description: 允许使用 AI 执行市场操作（上架、下架、购买、转账等）
    default: true              # 所有玩家可用 / available to all players
  kilacraft.market.*:
    description: 允许使用所有市场技能（包含以上全部）
    default: true
    children:
      kilacraft.market.query: true
      kilacraft.market.action: true

  # 管理员功能权限 / Administrator functional permissions
  kilacraft.admin.health:
    description: 服务器健康监控（实时快照、自动诊断报告、手动性能采样）
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.admin.player:
    description: 玩家行为分析（在线趋势、活跃排行、新玩家流入、画像覆盖率、社交图谱）
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.admin.audit:
    description: 技能执行审计日志查询（执行记录、使用统计、失败日志）
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.admin.info:
    description: 插件运行信息与配置自检（/kila doctor 自检、/kila about 版本检查）
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.admin.cache:
    description: 大模型缓存命中率统计查看
    default: op                # 仅 OP 拥有此权限 / Only OP has this permission
  kilacraft.admin.*:
    description: 允许使用所有管理员功能（包含以上全部）
    default: op
    children:
      kilacraft.admin.health: true
      kilacraft.admin.player: true
      kilacraft.admin.audit: true
      kilacraft.admin.info: true
      kilacraft.admin.cache: true

  # Web 搜索与抓取技能权限 / Web search & fetch skill permissions
  kilacraft.websearch:
    description: 允许使用联网搜索技能（WebSearchSkill）
    default: true              # 所有玩家可用（需服主配置搜索 API Key）/ available to all players (requires API Key config)
  kilacraft.webfetch:
    description: 允许使用网页抓取技能（WebFetchSkill）
    default: true              # 所有玩家可用（零配置）/ available to all players (zero config)