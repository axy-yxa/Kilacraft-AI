# ==================== Kilacraft-AI Language Configuration (English) ====================
# This configuration file manages all player-facing message text
# Server admins can customize these messages to match their server's style
# Supports color codes (§ + number/letter) and variable placeholders (e.g. {player}, {seconds})
#
# Note: This file only controls "messages players see in-game"
# - AI responses (generated by LLM): controlled by config.yml agent.prompts
# - Internal error messages (e.g. health monitor errors): hardcoded, not configurable here
# - Console logs: controlled by the logs section below
#
# Use /kila reload to apply changes without restarting the server

# ==================== Command Help Messages ====================
# Unified format: §b/command §7[optional] <required> §8- §fdescription
help:
  messages:
    - "§b▌§f Kilacraft-AI §7— §fChat with AI: /kila <message>"
    - "§7Aliases: /kilacraft, /ai, /zm"
    - " §b/kila chat §8- §fEnter/exit continuous chat mode"

  reload: " §b/kila reload §8- §fHot-reload all configuration"

  clear-self: " §b/kila clear §8- §fClear your own chat history"
  clear-other: " §b/kila clear §7<player> §8- §fClear a player's history"

  knowledge: " §b/kila knowledge reload §8- §fReload knowledge base"
  personalities: " §b/kila personalities reload §8- §fReload personalities"

  suggestion: " §b/kila suggestion §7<on|off|status> §8- §fManage conversation suggestions"

  profile: " §b/kila profile start §7[seconds] §8- §fStart performance profiling (30~120s)"
  profile-subcommands: " §b/kila profile stop | status §8- §fAbort profiling / View status"
  notify: " §b/kila notify test §8- §fTest external notification channels"

  usage: " §b/kila usage §7[player|all] [range] §8- §fView AI usage stats"
  history: " §b/kila history §7[player] [page] [-f] §8- §fView chat history (-f show full content)"
  memory: " §b/kila memory §7[player] §8- §fView player profile"

  skills: " §b/kila skills §7[page] §8- §fList available skills"
  run: " §b/kila run §7<skill> <prompt> §8- §fForce-execute a specific skill"

  doctor: " §b/kila doctor §8- §fRun configuration diagnostics"
  about: " §b/kila about §8- §fVersion & update check"

  tasks: " §b/kila tasks §8- §fView scheduled task status"

  cache: " §b/kila cache §7[page] §8- §fView LLM cache statistics"
  cache-reset: " §b/kila cache reset §8- §fReset cache statistics"

# ==================== Permission Messages ====================
permissions:
  reload: "§cYou don't have permission to reload the configuration!"
  clear-self: "§cYou don't have permission to clear your own chat history!"
  clear-other: "§cYou don't have permission to clear other players' history!"
  knowledge: "§cYou don't have permission to manage the knowledge base!"
  personalities: "§cYou don't have permission to manage personality configuration!"

# ==================== Feature Status Messages ====================
features:
  chat-mode-disabled: "§cContinuous chat mode is disabled!"
  chat-mode-player-only: "§cOnly players can use continuous chat mode!"
  chat-mode-enter: "§aEntered continuous chat mode! Everything you say will be sent to Kilacraft-AI."
  chat-mode-enter-subtitle: "§7Type §b/kila chat§7 to exit continuous chat mode"
  chat-mode-exit: "§7Exited continuous chat mode"

# ==================== Command Result Messages ====================
commands:
  # /kila reload success (unified message, covers all sub-modules)
  reload-success: "§aConfiguration reloaded!"
  # /kila reload failure
  reload-failure: "§cConfiguration reload failed: "
  # /kila clear cleared own history
  clear-self-success: "§aYour chat history has been cleared!"
  # /kila clear <player> cleared other's history — var: {player}=player name
  clear-other-success: "§aCleared chat history for player {player}!"
  # Console runs /kila clear without specifying a player
  clear-console-hint: "§cPlease specify a player name to clear their history: /kila clear <player name>"
  # /kila knowledge reload success
  knowledge-reload-success: "§aKnowledge base reloaded!"
  # /kila knowledge reload failure
  knowledge-reload-failure: "§cKnowledge base reload failed: "
  # /kila personalities reload success
  personalities-reload-success: "§aPersonality configuration reloaded!"
  # /kila personalities reload failure
  personalities-reload-failure: "§cPersonality configuration reload failed: "
  # /kila <subcommand> unknown subcommand
  unknown-subcommand: "§cUnknown subcommand: "
  # /kila knowledge or personalities unknown subcommand hint
  available-subcommands: "§bAvailable subcommands: reload"
  # Player sends a message during cooldown — var: {seconds}=remaining seconds
  cooldown-warning: "§cPlease wait {seconds} seconds before trying again!"
  # Third-party plugin calls AI via console but player is on cooldown — var: {player}=name, {seconds}=remaining
  plugin-command-cooldown-warning: "§cPlayer {player} is on cooldown, please wait {seconds} seconds before trying again!"
  # Player sends a message in a banned_worlds world — var: {ai_name}=AI name (from config.yml)
  world-banned-hint: "§c{ai_name} is disabled in this world!"

  # ==================== /kila cache LLM cache statistics ====================
