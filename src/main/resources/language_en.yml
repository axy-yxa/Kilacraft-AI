# ==================== Kilacraft-AI Language Configuration (English) ====================
# This configuration file manages all player-facing message text
# Server admins can customize these messages to match their server's style
# Supports color codes (§ + number/letter) and variable placeholders (e.g. {player}, {seconds})
#
# Note: This file only controls "messages players see in-game"
# - AI responses (generated by LLM): controlled by config.yml agent.prompts
# - Internal error messages (e.g. AFK task errors): hardcoded, not configurable here
# - Console logs: controlled by the logs section below
#
# Use /kilacraft reload to apply changes without restarting the server

# ==================== Command Help Messages ====================
help:
  messages:
    - "§eUsage: /kilacraft <message>"
    - "§eAliases: /kila <message> or /ai <message> or /zm <message>"
    - "§eEnter continuous chat mode: /kilacraft chat"
    - "§eReload config: /kilacraft reload"
    - "§eReload knowledge base: /kilacraft knowledge reload"
    - "§eReload personalities: /kilacraft personalities reload"
  
  clear-self: "§eClear history: /kilacraft clear"
  clear-other: "§eClear player history: /kilacraft clear [player name]"
  
  knowledge: "§eUsage: /kilacraft knowledge reload"
  
  personalities: "§eUsage: /kilacraft personalities reload"
  personalities-subcommands: "§eAvailable subcommands: reload - Reload personality configuration"
  
  afk: "§eQuery AFK tasks: /kilacraft afk"
  afk-subcommands: "§eAvailable subcommands: query (query), cancel (cancel)"

  profile: "§eServer performance profiling: /kilacraft profile start [seconds(30~120, default 60)]"
  profile-subcommands: "§eAvailable subcommands: start (start profiling), stop (abort), status (view status)"
  notify: "§eTest external notifications: /kilacraft notify test"

# ==================== Permission Messages ====================
permissions:
  reload: "§cYou don't have permission to reload the configuration!"
  clear-self: "§cYou don't have permission to clear your own chat history!"
  clear-other: "§cYou don't have permission to clear other players' history!"
  knowledge: "§cYou don't have permission to manage the knowledge base!"
  personalities: "§cYou don't have permission to manage personality configuration!"

# ==================== Feature Status Messages ====================
features:
  chat-mode-disabled: "§cContinuous chat mode is disabled!"
  chat-mode-player-only: "§cOnly players can use continuous chat mode!"
  chat-mode-enter: "§aEntered continuous chat mode! Everything you say will be sent to Kilacraft-AI."
  chat-mode-enter-subtitle: "§7Type §e/kilacraft chat§7 to exit continuous chat mode"
  chat-mode-exit: "§7Exited continuous chat mode"

# ==================== Command Result Messages ====================
commands:
  reload-success: "§aConfiguration reloaded!"
  reload-failure: "§cConfiguration reload failed: "
  clear-self-success: "§aYour chat history has been cleared!"
  clear-other-success: "§aCleared chat history for player {player}!"
  clear-console-hint: "§cPlease specify a player name to clear their history: /kilacraft clear <player name>"
  knowledge-reload-success: "§aKnowledge base reloaded!"
  knowledge-reload-failure: "§cKnowledge base reload failed: "
  personalities-reload-success: "§aPersonality configuration reloaded!"
  personalities-reload-failure: "§cPersonality configuration reload failed: "
  unknown-subcommand: "§cUnknown subcommand: "
  available-subcommands: "§eAvailable subcommands: reload"
  cooldown-warning: "§cPlease wait {seconds} seconds before trying again!"
  plugin-command-cooldown-warning: "§cPlayer {player} is on cooldown, please wait {seconds} seconds before trying again!"
  world-banned-hint: "§c{ai_name} is disabled in this world!"

# ==================== Plugin Command Messages ====================
plugins-command:
  player-blocked: "§cPlease use /kilacraft <message>"
  insufficient-args: "§cInsufficient arguments! Usage: /kilacraft plugins <personality> <message> <player UUID> [callback commands...]"
  usage-example: "§eExample: /kilacraft plugins strict_teacher hello 069a79f4-44e9-4726-a5be-fca90e38aaf5"
  callback-hint: "§7Optional: Add callback commands at the end, will auto-execute when AI completes"
  callback-example: "§eWith callback: /kilacraft plugins mm_ai hello UUID testai handleAI {response} mm_ai"
  callback-placeholder-hint: "§7{response} will be replaced with the actual AI response"
  invalid-uuid: "§cInvalid player UUID format: "
  uuid-format-hint: "§ePlease ensure correct UUID format, e.g.: 069a79f4-44e9-4726-a5be-fca90e38aaf5"
  personality-not-found: "§cPersonality not found: "
  personality-list-hint: "§eAvailable personalities: "
  error: "§cAn error occurred: "

# ==================== Log Messages (Console Output) ====================
logs:
  config-reloaded: "Configuration reloaded by {sender}"
  knowledge-reloaded: "Knowledge base reloaded by {sender}"
  personalities-reloaded: "Personality configuration reloaded by {sender}"
  chat-mode-entered: "Player {player} entered continuous chat mode"
  chat-mode-exited: "Player {player} exited continuous chat mode"
  clear-self-logged: "Player {player} cleared their chat history"
  clear-other-logged: "{sender} cleared chat history for player {player}"
  player-command-attempt: "Player {player} attempted console-only command /kilacraft plugins"
  ai-request-error: "AI request error: "
  console-ai-error: "Console AI request error: "
  plugin-command-ai-error: "Plugin command AI request error: "
