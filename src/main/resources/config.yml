# ==================== 支持开发 ====================
# 如果 Kilacraft-AI 帮助到了你，欢迎支持项目持续发展：
# - 爱发电: https://afdian.com/a/Zm_Mmm
# 你的支持将用于功能更新、Bug 修复和文档完善！❤️

# ==================== LLM 提供商配置 ====================
llm:
  # LLM API 配置（通用，支持所有 OpenAI 标准格式的厂商）
  # 可用厂商示例：
  # - DeepSeek: https://api.deepseek.com/v1/chat/completions
  # - 智谱AI: https://open.bigmodel.cn/api/paas/v4/chat/completions
  # - Moonshot: https://api.moonshot.cn/v1/chat/completions
  api_url: "https://api.deepseek.com/v1/chat/completions"
  
  # API 密钥（从对应厂商获取）
  api_key: "your-api-key"
  
  # 模型名称（根据厂商配置）
  # DeepSeek 示例：deepseek-chat, deepseek-coder
  # 智谱AI 示例：glm-4-plus, glm-4-flash
  # Moonshot 示例：moonshot-v1-8k, moonshot-v1-32k
  model: "deepseek-chat"
  
  # 通用配置（覆盖各个提供商的默认值）
  # 温度参数（0-2之间）
  # 值越高回答越有创意和随机性
  # 值越低回答越保守和确定性
  # 0.7是平衡点，适合一般对话
  temperature: 0.7

  # 最大返回token数
  # 控制AI回复的最大长度（约1token≈0.75个中文）
  # 1000约等于750个中文字符
  max_tokens: 600

# ==================== 插件设置 ====================
settings:
  # 是否在控制台显示API请求日志
  # 调试时开启，正常使用建议关闭
  debug_mode: false

  # 是否启用匿名统计（bStats）
  # 收集匿名使用数据帮助改进插件，不收集任何敏感信息
  # 统计内容：技能调用次数、请求类型分布、挂机任务类型、LLM模型名、服务端类型
  # 数据公开查看：https://bstats.org/plugin/bukkit/Kilacraft-AI
  # 注意：修改此项后需要重启服务器才能生效，热重载不会更新此配置
  metrics: true

  # 是否启用聊天命令模式
  # true: 可以使用/kilacraft chat进入对话模式
  # false: 禁用聊天模式，只能用/kilacraft命令
  enable_chat_command: true

  # 是否启用关键词触发
  # 玩家在公共频道说"@kilacraft"即可触发AI回复
  enable_trigger: true

  # 触发关键词（多个用逗号分隔）
  trigger_keywords: "@kila,@ai,@zm"

  # 是否开启公屏回复（默认关闭）
  # true: 玩家通过关键词触发AI时，AI的回复会发送给所有在线玩家（公屏可见）
  #       上下文历史仍然只保存给触发AI的玩家
  # false: AI的回复只有触发AI的玩家能看到（私信模式）
  public_reply: false

  # 冷却时间（秒）
  # 防止玩家频繁调用 API 导致费用过高
  # 设置为 0 可禁用冷却
  cooldown_seconds: 5

  # 插件命令专用冷却时间（秒）
  # 仅针对 /kilacraft plugins 命令生效
  # 设置为 0 可禁用冷却，-1 表示与普通命令共用冷却时间
  plugins_cooldown_seconds: 3

  # 回调命令超时保护（秒）
  # 重要：无论第三方插件是同步还是异步处理，超过此时间都会记录警告并强制中断
  # 原因：第三方插件的逻辑不可控，可能出现死循环、长时间阻塞等风险
  # 建议值：2-5 秒（根据服务器性能和第三方插件复杂度调整）
  callback_timeout_seconds: 3

  # 最大历史消息数（用于上下文对话）
  # 保存最近的 N 轮对话作为上下文
  # max_history: 0 - 禁用历史记录（不保存）
  # max_history: 5 - 保存最近 5 轮对话（10 条消息）
  # max_history: 10 - 保存最近 10 轮对话（20 条消息）
  # max_history: 20 - 保存最近 20 轮对话（40 条消息）
  max_history: 10

  # 是否限制特定世界使用
  # 留空表示所有世界可用
  allowed_worlds:
  #- "world"

  # 禁止使用的世界（优先级更高，比allowed_worlds高，如果一个世界同时在两个列表中会被禁止）
  # 在这些世界中禁用AI功能
  banned_worlds:
  #- "world_nether"
  #- "world_the_end"

  # 系统提示词（AI 的默认回答方式和风格）
  # 使用 {player} 占位符，会被自动替换为实际玩家名称
  system_prompt: "你是一个 Minecraft 游戏助手，正在和玩家 {player} 对话。请用友好、简洁的方式回答，输出不超过200个汉字。可以提到 Minecraft 游戏相关的内容。"

# ==================== Agent 能力配置 ====================
# Agent 能力说明：
# 1. 启用后，AI 会先进行意图识别，判断是否需要调用技能（单意图或多步骤任务）
# 2. 意图识别失败或技能执行失败时，回退到普通 AI 对话
# 3. 关闭后，直接进入普通 AI 对话，不进行意图分析
agent:
  # 是否启用 Agent 能力（总开关，优先级高于以下两个独立配置）
  enabled: true
  
  # ChatListener 入口是否启用 Agent 能力（关键词触发、连续对话模式）
  # true: 玩家通过@ai 等关键词触发时，会先进行意图识别
  # false: 玩家通过关键词触发时，直接进入普通 AI 对话
  enable_chat_listener: true
  
  # KilacraftCommand 入口是否启用 Agent 能力（/kilacraft 命令）
  # true: 玩家使用/kilacraft 命令时，会先进行意图识别
  # false: 玩家使用/kilacraft 命令时，直接进入普通 AI 对话
  enable_command: true
  
  # 意图识别时的历史对话上下文数量(轮数)
  # 用于帮助 LLM 理解用户的连续对话意图
  # 例如：用户说"再查一下那个物品"，LLM 需要历史来理解"那个物品"指什么
  # 建议值：3-5，值越大上下文越丰富，但 token 消耗也越高
  intent_history_count: 5
  
  # 二次分析时的历史对话上下文数量(轮数)
  # 用于让 LLM 在分析 Skill 执行结果时参考对话上下文
  # 使最终回复更自然、能关联上下文
  # 建议值：1-2，精简历史即可满足大部分场景
  analysis_history_count: 2
  
  # LLM 分析执行结果并生成最终回复提示词配置
  prompts:
    # 系统提示词
    system_prompt: "你是一个热情有趣的 Minecraft 游戏助手，正在为玩家分析任务执行结果。优先根据执行结果数据回答问题，如果上下文中有知识库提供的相关信息，也可以适当补充。"
    
    # 分析提示词后缀
    # 用途：
    # 1. 作为提示词后缀：用于单意图和多步骤任务的 LLM 二次分析
    # 2. 作为关键词提取边界：用于知识库检索时排除提示词干扰
    # 注意：普通 AI 对话不使用此后缀作为提示词，但会用于关键词提取边界
    analysis_prompt_suffix: |
      
      【回复要求】
      1. 用简洁友好的自然语言直接回答玩家的问题，像朋友聊天一样自然
      2. 执行结果中的数据是核心事实，必须准确呈现，数值（如耐久度、生命值、数量、坐标等）必须使用原始数据，不得四舍五入、近似或概括（如479/481不得说成"满耐久"）
      3. 如果上下文中包含知识库检索到的相关信息，可以适当融入回答中作为补充，让回复更有价值
      4. 但不要编造执行结果和知识库中都不存在的数据，也不要凭空捏造游戏操作指南
      5. **严格约束：只描述执行结果中实际完成的操作，不要提及执行结果中未包含的功能（如音效、粒子效果、传送等），即使知识库或技能描述中有相关说明**
      6. 不要使用任何固定标题或模板（禁止"分析与建议"、"简要分析"、"当前市场情况"、"后续操作建议"等标题）
      7. 输出不超过400个汉字
      
      【关于部分失败的处理】
      - 如果执行结果中包含 [FAILURE] 标记，表示该步骤执行失败
      - 如果执行结果中包含 [SKIPPED] 标记，表示该步骤因依赖未满足或参数解析失败而被跳过
      - 请基于所有成功的步骤结果，尽可能形成对用户有用的回答
      - 对于失败或跳过的步骤，请明确指出哪些部分因何原因未能完成，并提供建议
      - 不要因为部分失败而完全拒绝回答，要充分利用已获取的信息

# ==================== 消息格式配置 ====================
messages:
  # AI 名称（用于提示语中的 AI 标识）
  # 例如："Kilacraft-AI"、"AI 助手" 等
  ai_name: "Kilacraft-AI"
  
  # AI 响应前缀（用于各种 AI 提示消息）
  # 支持颜色代码（§ + 数字/字母）
  # 例如：§7=灰色，§f=白色，§b=浅蓝色，§a=绿色，§c=红色
  # 可以使用任何符号包裹，如 []、【】、『』等，或者不用符号
  ai_prefix: "§7[Kilacraft-AI] §f"
  
  # "正在思考"提示文本
  thinking_message: "正在思考中..."

# ==================== AI 响应输出管线配置 ====================
# 说明：统一控制所有 AI 回复的输出载体（聊天栏/ActionBar/BossBar/Title/Sidebar）
# 默认使用 CHAT，可按场景精细化配置
output:
  # 全局默认输出载体
  # 可选值: CHAT, ACTION_BAR, BOSS_BAR, TITLE, SIDEBAR
  default_channel: CHAT
  
  # "正在思考"提示消息的输出载体
  # 可选值: CHAT, ACTION_BAR, BOSS_BAR, TITLE, SIDEBAR
  # 说明：默认为 default_channel，可独立配置
  # 示例：default_channel=BOSS_BAR, thinking_channel=CHAT → 思考提示在聊天框，回复也在聊天框（如果 normal_chat=CHAT）
  thinking_channel: ""
  
  # 流式输出配置（实时显示 AI 生成过程）
  # 说明：
  # 1. 启用后，AI 响应会逐字实时显示，而非等待完整响应
  # 2. 窗口期管理：请求发起后立即显示"生成中..."占位符
  # 3. 流式输出使用场景对应的载体（与最终结果一致）
  # 4. 推荐载体：SIDEBAR（最佳体验，适合长文本）/ BOSS_BAR（中长文本）/ ACTION_BAR（短文本）
  # 5. CHAT 载体不推荐（会刷屏），TITLE 载体不适合（会闪烁）
  stream:
    # 是否启用流式输出（总开关）
    enabled: false
  
  # AI 回复音效配置
  # 说明：
  # 1. 启用后，AI 开始回复时会播放提示音效（仅触发玩家听到）
  # 2. 音效时机：思考完成/开始生成时播放，与输出内容同步
  # 3. 适用场景：普通对话/技能结果/任务结果/挂机回调
  # 4. 提升沉浸式体验：声音与文字同步出现
  sound:
    # 是否启用 AI 回复音效（总开关，默认开启）
    enabled: true
    # 音效枚举名称（Bukkit Sound 枚举）
    # 推荐值：
    # - ENTITY_PLAYER_LEVELUP（升级音效，默认）
    # - ENTITY_EXPERIENCE_ORB_PICKUP（经验球拾取）
    # - BLOCK_NOTE_BLOCK_PLING（音符方块）
    # - UI_TOAST_CHALLENGE_COMPLETE（成就完成）
    sound_name: "ENTITY_PLAYER_LEVELUP"
    # 音量（0.0-1.0）
    volume: 0.5
    # 音调（0.5-2.0）
    pitch: 1.2
  
  # 场景级覆盖配置（可选，留空则使用 default_channel）
  # 场景说明：
  # - normal_chat: 普通 AI 对话（无技能调用）
  # - skill_result: 单意图技能执行结果（含 LLM 二次分析）
  # - task_result: 多步骤任务执行结果（含 LLM 二次分析）
  # - afk_callback: 挂机任务回调通知
  # - error: 错误消息
  scenarios:
    normal_chat: ""
    skill_result: ""
    task_result: ""
    afk_callback: ""
    error: ""
  
  # BossBar 专属配置（仅当载体为 BOSS_BAR 时生效）
  boss_bar:
    # BossBar 颜色
    # 可选值: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: PURPLE
    # BossBar 样式
    # 可选值: SOLID（实心）, SEGMENTED_6/10/12/20（分段）
    style: SOLID
    # 显示时长（秒），0=永久显示直到新消息覆盖
    duration_seconds: 15
  
  # Title 专属配置（仅当载体为 TITLE 时生效）
  title:
    # 主标题停留时间（ticks，20 ticks = 1秒）
    stay_ticks: 60
    # 淡入时间（ticks）
    fade_in_ticks: 10
    # 淡出时间（ticks）
    fade_out_ticks: 10
  
  # Scoreboard Sidebar 专属配置（仅当载体为 SIDEBAR 时生效）
  # 说明：
  # - 自动分页：超过 max_lines_per_page 行时自动拆分多页
  # - 持久显示：不遮挡游戏视野，适合长文本 AI 回复
  # 注意：
  # - 如果服务器有其他插件使用了 Scoreboard Sidebar（如计分板、排行榜等），可能会导致冲突
  # - 冲突表现：两个插件的 Sidebar 会互相覆盖，只能显示最后一个
  # - 解决方案：
  #   1. 检查是否有其他插件使用 Sidebar（如 Essentials、Stats、Factions 等）
  #   2. 如果有冲突，建议改用其他载体（CHAT/BOSS_BAR）
  #   3. 或者联系其他插件作者，看是否支持配置到其他显示槽位
  sidebar:
    # 显示时长（秒），0=永久显示直到新消息覆盖
    duration_seconds: 15
    
    # 每页最大行数（Minecraft Sidebar 上限为 15）
    # 建议值：10-15，值越大单页显示内容越多，但太高会影响游戏体验
    max_lines_per_page: 15
    
    # 每行最大字符数
    # 建议值：32-40，值越小 Sidebar 越窄，阅读体验越好
    # AI 回复一般不超过 400 汉字，32 字符/行约需 12-13 行
    max_chars_per_line: 32

# ==================== 知识库配置 ====================
# 知识库功能说明：
# 1. 在插件目录/plugins/Kilacraft-AI/knowledge/下创建 Markdown 或 TXT 文件
# 2. 将服务器特有的知识、规则、FAQ 等内容放入文件中
# 3. AI 会自动检索相关知识并基于知识回答
# 4. 使用 /kilacraft knowledge reload 命令重新加载知识库
knowledge:
  # 是否启用知识库检索（默认开启）
  enabled: true
  
  # 每次检索最多返回的相关知识数量（建议 1-5）
  max_relevant_chunks: 3
  
  # 知识库分段配置
  segment:
    # 每个片段最大字符数（超过此值会继续分割）
    max_size: 500
    
    # 每个片段最小字符数（小于此值的片段会被忽略）
    min_size: 25
    
    # 片段重叠字符数（保持上下文连贯性）
    overlap: 30
  
  # 关键词提取配置
  keywords:
    # 每次提取的关键词数量（建议 5-15）
    # 值越大召回率越高，但可能引入噪音
    top_k: 10
  
  # BM25 评分算法配置
  bm25:
    # k1 参数：控制词频饱和点（建议 1.2-2.0）
    # 值越小，词频影响越容易饱和
    k1: 1.5
    
    # b 参数：控制文档长度归一化（建议 0.5-0.8）
    # 值越大，长文档惩罚越重
    b: 0.75
  
  # 自定义词典配置
  # 用于添加专业术语、服务器特有词汇等，提升分词准确性
  custom_dictionary:
    # 是否启用自定义词典
    enabled: true
    
    # 自定义词汇列表（每行一个词）
    # 支持中文、英文、数字混合
    words:
      - "圈地"
      - "领地"
      - "红石"
      - "附魔"
      - "村民交易"
      - "刷怪塔"
      - "末影龙"

# ==================== 命令执行技能配置 ====================
# 命令执行技能说明：
# 1. 开启后 AI 可以代替玩家执行服务器命令（如 /back、/home 等）
# 2. AI 以玩家身份执行命令，权限边界等于玩家自身的权限
#    - 玩家没有的命令权限，AI 代执行也会被服务器拒绝
#    - 所有服务器安全机制（权限检查、冷却、安全区域等）均正常生效
#    - 不存在越权风险：玩家不能做的事，AI 也做不了
# 3. 权限要求：玩家必须拥有 kilacraft.command.execute 权限才能使用此功能
#    - 即使配置开启，没有权限的玩家也无法触发命令执行
#    - 建议在权限插件中按需分配（如只给 VIP 玩家）
# 4. 建议服主在开启前确认服务器权限配置符合预期
command_skill:
  # 是否启用命令执行技能（默认关闭，需手动开启）
  # 注意：开启配置后，还需要给玩家分配 kilacraft.command.execute 权限
  enabled: false

# ==================== 挂机任务配置 ====================
# 挂机任务功能说明：
# 1. 玩家可以通过 AI 对话或命令创建后台监控任务
# 2. 条件满足时自动通知玩家并执行动作
# 3. 每个玩家同时只能拥有一个挂机任务
# 4. 玩家下线或任务完成后自动释放资源
afk_task:
  # 是否启用挂机任务功能
  enabled: true
  
  # 最大并发任务数（全局限制）
  # 同时运行的最大挂机任务数量
  max_tasks: 10
  
  # 定时轮询间隔（单位：ticks，20 ticks = 1秒）
  # 仅用于没有对应 Bukkit 事件的场景
  check_interval_ticks: 20
  
  # 最大连续评估失败次数
  # 当条件评估连续失败超过此次数时，自动终止任务并通知玩家
  # 建议值：5-15，值太小可能误杀正常任务，值太大会浪费资源
  max_consecutive_failures: 10

# ==================== 安全配置 ====================
# 玩家数据隔离：防止通过AI技能查询/操作其他玩家的敏感数据
# 安全拦截器会扫描所有Skill参数值，如果匹配到在线玩家名且不是调用者自己，则自动替换为调用者名
security:
  player_isolation:
    # 是否启用玩家数据隔离（默认开启）
    enabled: true
    # 允许操作其他玩家的Skill动作白名单（服主可自行添加SPI Skill）
    # 格式：技能名.动作名（精确匹配）或 技能名（技能级白名单）
    # 修改后执行 /kilacraft reload 即可生效，无需重启服务器
    allowed_actions:
      - "cmi.send_tp_request"        # TPA传送请求：target_player是传送目的地
      - "AFKTask.create_task"        # 挂机任务：允许监控其他玩家（如"帮我盯着xxx"）
      - "command.execute_command"    # 命令执行：以玩家身份执行命令，权限边界等于玩家自身权限
