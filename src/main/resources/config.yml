# ==================== 插件设置 / Plugin Settings ====================
# 说明：此文件为 Kilacraft-AI 主配置文件
# LLM/Agent 配置已迁移至 llm.yml，输出管线配置已迁移至 output.yml
# 知识库配置已迁移至 knowledge.yml，问候配置已迁移至 greeting.yml
# Description: This is the main Kilacraft-AI config file
# LLM/Agent config moved to llm.yml, output pipeline config moved to output.yml
# Knowledge base config moved to knowledge.yml, greeting config moved to greeting.yml
settings:
  # 插件语言设置
  # zh = 中文，en = English
  # 影响范围：日志输出、技能消息、LLM提示词、AFK任务通知等
  # 修改后执行 /kilacraft reload 即时生效
  # Plugin language setting
  # zh = Chinese, en = English
  # Scope: log output, skill messages, LLM prompts, AFK task notifications, etc.
  # Run /kilacraft reload to apply changes immediately
  language: en

  # 是否在控制台显示API请求日志
  # 调试时开启，正常使用建议关闭
  # Whether to display API request logs in console
  # Enable for debugging, disable for normal use
  debug_mode: false

  # 是否启用匿名统计（bStats）
  # 收集匿名使用数据帮助改进插件，不收集任何敏感信息
  # 统计内容：技能调用次数、请求类型分布、挂机任务类型、LLM模型名、服务端类型
  # 数据公开查看：https://bstats.org/plugin/bukkit/Kilacraft-AI
  # 注意：修改此项后需要重启服务器才能生效，热重载不会更新此配置
  # Whether to enable anonymous statistics (bStats)
  # Collects anonymous usage data to help improve the plugin, no sensitive information collected
  # Statistics: skill call counts, request type distribution, AFK task types, LLM model names, server type
  # Public data: https://bstats.org/plugin/bukkit/Kilacraft-AI
  # Note: Requires server restart to take effect, hot reload will not update this config
  metrics: true

  # 是否启用聊天命令模式
  # true: 可以使用/kilacraft chat进入对话模式
  # false: 禁用聊天模式，只能用/kilacraft命令
  # Whether to enable chat command mode
  # true: Use /kilacraft chat to enter conversation mode
  # false: Disable chat mode, only /kilacraft command available
  enable_chat_command: true

  # 是否启用关键词触发
  # 玩家在公共频道说"@kilacraft"即可触发AI回复
  # Whether to enable keyword trigger
  # Players can trigger AI reply by saying "@kilacraft" in public chat
  enable_trigger: true

  # 触发关键词（多个用逗号分隔）
  # Trigger keywords (comma-separated)
  trigger_keywords: "@kila,@ai,@zm"

  # 是否开启公屏回复（默认关闭）
  # true: 玩家通过关键词触发AI时，AI的回复会发送给所有在线玩家（公屏可见）
  #       上下文历史仍然只保存给触发AI的玩家
  # false: AI的回复只有触发AI的玩家能看到（私信模式）
  # Whether to enable public reply (default: off)
  # true: AI reply is sent to all online players (publicly visible)
  #       Conversation history is still saved only for the triggering player
  # false: AI reply is visible only to the triggering player (private message mode)
  public_reply: false

  # 冷却时间（秒）
  # 防止玩家频繁调用 API 导致费用过高
  # 设置为 0 可禁用冷却
  # Cooldown time (seconds)
  # Prevents excessive API calls that may incur high costs
  # Set to 0 to disable cooldown
  cooldown_seconds: 5

  # 插件命令专用冷却时间（秒）
  # 仅针对 /kilacraft plugins 命令生效
  # 设置为 0 可禁用冷却，-1 表示与普通命令共用冷却时间
  # Plugin command-specific cooldown (seconds)
  # Only applies to /kilacraft plugins command
  # Set to 0 to disable, -1 to share cooldown with normal commands
  plugins_cooldown_seconds: 3

  # 最大历史消息数（用于上下文对话）
  # 保存最近的 N 轮对话作为上下文
  # max_history: 0 - 禁用历史记录（不保存）
  # max_history: 5 - 保存最近 5 轮对话（10 条消息）
  # max_history: 10 - 保存最近 10 轮对话（20 条消息）
  # max_history: 20 - 保存最近 20 轮对话（40 条消息）
  # Maximum history message count (for contextual conversation)
  # Saves the latest N rounds of conversation as context
  # max_history: 0 - Disable history (no saving)
  # max_history: 5 - Save latest 5 rounds (10 messages)
  # max_history: 10 - Save latest 10 rounds (20 messages)
  # max_history: 20 - Save latest 20 rounds (40 messages)
  max_history: 10

  # 是否限制特定世界使用
  # 留空表示所有世界可用
  # Whether to restrict usage to specific worlds
  # Leave empty to allow all worlds
  allowed_worlds:
  #- "world"

  # 禁止使用的世界（优先级更高，比allowed_worlds高，如果一个世界同时在两个列表中会被禁止）
  # 在这些世界中禁用AI功能
  # Banned worlds (higher priority than allowed_worlds; if a world is in both lists, it will be banned)
  # Disable AI features in these worlds
  banned_worlds:
  #- "world_nether"
  #- "world_the_end"

# ==================== 消息格式配置 / Message Format Configuration ====================
messages:
  # AI 名称（用于提示语中的 AI 标识）
  # 例如："Kilacraft-AI"、"AI 助手" 等
  # AI name (used as AI identifier in prompts)
  # Examples: "Kilacraft-AI", "AI Assistant", etc.
  ai_name: "Kilacraft-AI"
  
  # AI 响应前缀（用于各种 AI 提示消息）
  # 支持颜色代码（§ + 数字/字母）
  # 例如：§7=灰色，§f=白色，§b=浅蓝色，§a=绿色，§c=红色
  # 可以使用任何符号包裹，如 []、【】、『』等，或者不用符号
  # AI response prefix (for various AI prompt messages)
  # Supports color codes (§ + digit/letter)
  # Examples: §7=gray, §f=white, §b=light blue, §a=green, §c=red
  # Can be wrapped with any symbols like [], 【】, 『』, or no symbols at all
  ai_prefix: "§7[Kilacraft-AI] §f"
  
  # "正在思考"提示文本
  # "Thinking" prompt text
  thinking_message: "正在思考中..."
  # 英文版提示文本（language=en 时生效）
  # English prompt text (effective when language=en)
  thinking_message_en: "Thinking..."

# ==================== 命令执行技能配置 / Command Execution Skill Configuration ====================
# 命令执行技能说明：
# 1. 开启后 AI 可以代替玩家执行服务器命令（如 /back、/home 等）
# 2. AI 以玩家身份执行命令，权限边界等于玩家自身的权限
#    - 玩家没有的命令权限，AI 代执行也会被服务器拒绝
#    - 所有服务器安全机制（权限检查、冷却、安全区域等）均正常生效
#    - 不存在越权风险：玩家不能做的事，AI 也做不了
# 3. 权限要求：玩家必须拥有 kilacraft.command.execute 权限才能使用此功能
#    - 即使配置开启，没有权限的玩家也无法触发命令执行
#    - 建议在权限插件中按需分配（如只给 VIP 玩家）
# 4. 建议服主在开启前确认服务器权限配置符合预期
# Command execution skill description:
# 1. When enabled, AI can execute server commands on behalf of the player (e.g., /back, /home)
# 2. AI executes commands as the player, permission boundary equals the player's own permissions
#    - Commands the player doesn't have permission for will also be rejected when AI executes them
#    - All server security mechanisms (permission checks, cooldowns, safe zones, etc.) remain in effect
#    - No privilege escalation risk: what the player can't do, AI can't do either
# 3. Permission requirement: player must have kilacraft.command.execute permission to use this feature
#    - Even if config is enabled, players without permission cannot trigger command execution
#    - Recommended to assign via permission plugin as needed (e.g., VIP players only)
# 4. Server owners should verify permission configuration meets expectations before enabling
command_skill:
  # 是否启用命令执行技能
  # 注意：开启配置后，还需要给玩家分配 kilacraft.command.execute 权限
  # Whether to enable command execution skill
  # Note: After enabling config, players still need kilacraft.command.execute permission assigned
  enabled: false

# ==================== 挂机任务配置 / AFK Task Configuration ====================
# 挂机任务功能说明：
# 1. 玩家可以通过 AI 对话或命令创建后台监控任务
# 2. 条件满足时自动通知玩家并执行动作
# 3. 每个玩家同时只能拥有一个挂机任务
# 4. 玩家下线或任务完成后自动释放资源
# AFK task feature description:
# 1. Players can create background monitoring tasks via AI conversation or commands
# 2. Automatically notifies player and executes actions when conditions are met
# 3. Each player can only have one AFK task at a time
# 4. Resources are automatically released when player goes offline or task completes
afk_task:
  # 是否启用挂机任务功能
  # Whether to enable AFK task feature
  enabled: true
  
  # 最大并发任务数（全局限制）
  # 同时运行的最大挂机任务数量
  # Maximum concurrent tasks (global limit)
  # Maximum number of AFK tasks running simultaneously
  max_tasks: 10
  
  # 定时轮询间隔（单位：ticks，20 ticks = 1秒）
  # 仅用于没有对应 Bukkit 事件的场景
  # Polling interval (unit: ticks, 20 ticks = 1 second)
  # Only used for scenarios without corresponding Bukkit events
  check_interval_ticks: 20
  
  # 最大连续评估失败次数
  # 当条件评估连续失败超过此次数时，自动终止任务并通知玩家
  # 建议值：5-15，值太小可能误杀正常任务，值太大会浪费资源
  # Maximum consecutive evaluation failures
  # When condition evaluation fails consecutively beyond this count, task is automatically terminated and player is notified
  # Recommended: 5-15, too small may kill normal tasks, too large wastes resources
  max_consecutive_failures: 10

# ==================== 安全配置 / Security Configuration ====================
# 玩家数据隔离：防止通过AI技能查询/操作其他玩家的敏感数据
# 安全拦截器会扫描所有Skill参数值，如果匹配到在线玩家名且不是调用者自己，则自动替换为调用者名
# Player data isolation: prevents querying/manipulating other players' sensitive data via AI skills
# Security interceptor scans all Skill parameter values; if an online player name is matched and it's not the caller, it's auto-replaced with the caller's name
security:
  player_isolation:
    # 是否启用玩家数据隔离（默认开启）
    # Whether to enable player data isolation (default: on)
    enabled: true
    # 允许操作其他玩家的Skill动作白名单（服主可自行添加SPI Skill）
    # 格式：技能名.动作名（精确匹配）或 技能名（技能级白名单）
    # 修改后执行 /kilacraft reload 即可生效，无需重启服务器
    # Whitelist of Skill actions allowed to operate on other players (server owners can add SPI Skills)
    # Format: skill_name.action_name (exact match) or skill_name (skill-level whitelist)
    # Run /kilacraft reload to apply changes, no server restart required
    allowed_actions:
      - "cmi.send_tp_request"        # TPA传送请求：target_player是传送目的地 / TPA request: target_player is the teleport destination
      - "market_query.query_seller_items" # 市场查询：查看指定卖家在售商品（公开市场信息） / Market query: view a specific seller's listed items (public market info)
      - "AFKTask.create_task"        # 挂机任务：只允许监控其他玩家上线和下线 / AFK Task: Only allow monitoring of other players' online and offline activities
      - "command.execute_command"    # 命令执行：以玩家身份执行命令，权限边界等于玩家自身权限 / Command execution: executes as the player, permission boundary equals player's own permissions
      - "market_action.transfer_money" # 转账：target_player是收款人，需要允许指定其他玩家 / Money transfer: target_player is the recipient, must allow specifying other players
      - "utility.notify_player"      # 中途通知：仅通知文本，不执行操作，消息中可包含其他玩家名 / Mid-task notification: text-only, no operations, message may contain other player names
      - "utility.broadcast_message"    # 全服广播：仅输出公告文本，消息中可能包含其他玩家名 / Server-wide broadcast: announcement text output only, message may contain other player names
      - "player_analysis.player_relations" # 玩家社交关系查询：管理员查询指定玩家的社交关系 / Player social relation query: admin queries a specific player's social relations
      - "audit_log.query_logs"         # 技能执行日志查询：管理员查询指定玩家的技能使用记录 / Skill execution log query: admin queries a specific player's skill usage logs

# ==================== 社交关系配置 / Social Relation Configuration ====================
# 社交关系智能提取器会定期扫描这些 Skill 的审计日志，
# 从中提取涉及其他玩家的交互，自动累加社交关系强度
# The social relation extractor periodically scans these Skills' audit logs,
# extracts player-to-player interactions, and automatically accumulates social relation strength
social:
  # 参与社交关系计算的 Skill 白名单
  # 填写 Skill 的 getName() 返回值（区分大小写）
  # 新增 SPI Skill 后在此处添加即可，修改后执行 /kilacraft reload 生效
  # Skill whitelist for social relation calculation
  # Use the exact value returned by Skill.getName() (case-sensitive)
  # Add new SPI Skills here, run /kilacraft reload to apply
  skill_whitelist:
    - "market_action"    # 市场操作（转账等涉及其他玩家的交易） / Market operations (transactions involving other players such as transfers)
    - "cmi"              # CMI 操作（TPA 传送请求等） / CMI operation (TPA transmission request, etc.)
    - "AFKTask"          # 挂机任务（监控其他玩家上线/下线） / Hanging task (monitoring other players online/offline)
