# ==================== Kilacraft-AI 数据库配置 / Database Configuration ====================
# 独立配置文件，修改后执行 /kilacraft reload 即时生效
# Standalone config file, run /kilacraft reload to apply changes

# 数据库类型: H2, MYSQL
# Database type: H2, MYSQL
type: H2

# H2 配置（type=H2 时生效）
# H2 Configuration (effective when type=H2)
h2:
  # 数据文件存储路径（相对于插件目录）
  # Data file storage path (relative to plugin directory)
  file: "data/kilacraft"

# MySQL 配置（type=MYSQL 时生效）
# MySQL Configuration (effective when type=MYSQL)
mysql:
  host: "localhost"
  port: 3306
  database: "kilacraft_ai"
  username: "root"
  password: "password"
  # 表名前缀（不同插件共用DB时区分，如 kca_ / other_）
  # Table name prefix (for distinguishing when multiple plugins share the same DB)
  table_prefix: "kca_"

# ==================== 群组服配置 / Group Server Configuration ====================
# 群组服场景下，多个子服共享同一个 MySQL 数据库
# 每个子服需要配置唯一的 server_id 以区分数据
# 单机服留空即可（默认值）
# server_id 仅影响隔离表（conversation / server_event / skill_log）的数据过滤
# player_profile 和 social_relation 为共享表（无 server_id 字段），天然跨服共享
# In group server setups, multiple sub-servers share the same MySQL database
# Each sub-server needs a unique server_id to distinguish data
# Leave empty for single-server setups (default)
# server_id only affects data filtering of isolated tables (conversation / server_event / skill_log)
# player_profile and social_relation are shared tables (no server_id field), naturally cross-server
group:
  # 本服唯一标识（群组服中区分不同子服，如 survival / minigame / rpg）
  # 单机服或独立 H2 数据库无需修改
  # 修改后执行 /kilacraft reload 即时生效（仅影响新写入的数据）
  # Unique identifier for this sub-server (e.g., survival / minigame / rpg)
  # No need to change for single-server or standalone H2 database
  # Run /kilacraft reload to apply (only affects newly written data)
  server_id: ""

# 连接池配置（HikariCP，自适应策略）
# 不配置时自动根据 CPU 核数和服务端类型计算最优值
# Connection pool (HikariCP, adaptive strategy)
# Leave unset to auto-calculate based on CPU cores and server type
pool:
  # 最大连接数（0=自适应，H2 自动 max(2,CPU), MySQL 自动 min(max(4,CPU*2),20)）
  # Maximum pool size (0=adaptive, H2 auto max(2,CPU), MySQL auto min(max(4,CPU*2),20))
  maximum_pool_size: 0
  # 最小空闲连接数（0=自适应，H2 自动 1, MySQL 自动 max(2,CPU/2)）
  # Minimum idle connections (0=adaptive, H2 auto 1, MySQL auto max(2,CPU/2))
  minimum_idle: 0
  # 连接超时（毫秒）
  # Connection timeout (milliseconds)
  connection_timeout: 10000
  # 空闲超时（毫秒）
  # Idle timeout (milliseconds)
  idle_timeout: 300000
  # 最大存活时间（毫秒）
  # Maximum lifetime (milliseconds)
  max_lifetime: 1800000

# ==================== 数据保留策略 / Data Retention Policy ====================
retention:
  # 对话历史保留天数（0=永久保留，建议30-90）
  # Conversation history retention days (0=keep forever, recommended 30-90)
  conversation_retention_days: 60
  # 服务器事件保留天数（0=永久保留，建议30-180）
  # Server event retention days (0=keep forever, recommended 30-180)
  event_retention_days: 90
  # 技能审计日志保留天数（0=永久保留，建议30-90）
  # Skill audit log retention days (0=keep forever, recommended 30-90)
  skill_log_retention_days: 60

# ==================== 对话历史加载策略 / Conversation History Loading Strategy ====================
conversation:
  # 是否在玩家触发AI对话时从数据库加载历史到缓存
  # true: 玩家每次登录后首次对话会恢复最近N条历史（体验好，但每次对话携带历史，token消耗增加）
  # false: 每次登录从零开始，不加载历史（节省token，适合token预算有限的服务器）
  # 无论此开关如何设置，对话记录始终会写入数据库（持久化不中断）
  # Whether to load conversation history from database to cache when player triggers AI
  # true: Restores recent N history entries on first chat after login (better experience, higher token usage)
  # false: Starts fresh each login, no history loaded (saves tokens, suitable for budget-limited servers)
  # Regardless of this setting, conversation records are always persisted to database
  load_history_on_login: true

# ==================== 玩家画像分析配置 / Player Profile Analysis Configuration ====================
profile:
  # 分析触发间隔天数（玩家距离上次分析至少间隔N天才再次触发）
  # Minimum days between profile analyses (trigger only if N days passed since last analysis)
  analysis_interval_days: 1
  # 触发分析所需最少消息数（新消息数低于此值不触发）
  # Minimum number of new messages required to trigger analysis
  min_messages_to_trigger: 10
  # LLM 分析超时时间（秒）
  # LLM analysis timeout in seconds
  analysis_timeout_seconds: 120

  # 画像分析系统提示词
  # Profile analysis system prompt
  analysis_system_prompt: |
    你是一个玩家行为分析助手。根据玩家的对话历史，分析该玩家的游戏风格、偏好和行为特征。
    请输出一个 JSON 对象，包含以下字段（如果没有足够信息则留空字符串）：
    {
      "playstyle": "游戏风格描述（如：探索型、建造型、战斗型、社交型等）",
      "personality": "从对话中观察到的性格特征（如：友好、幽默、直接、内向等）",
      "interests": "玩家感兴趣的领域和喜欢的活动（如：建筑、市场经济、红石等）",
      "boundaries": "玩家的交互禁忌或反感（如：不要称呼名字、不喜欢被催促等，无则留空）",
      "communication": "玩家期望的AI回复方式（如：简短直接、不用emoji、不要太热情等）",
      "spatial": "玩家提到的地点、基地位置、常去之处（如：主世界(1200,64,-800)附近有城堡，无则留空）",
      "facts": "玩家明确声明的事实（如：Steve是好友、我的家在沙漠神殿旁，无则留空）",
      "notes": "其他值得注意的观察"
    }
    注意：
    1. 只分析对话中明确体现的信息，不要推测
    2. 每个字段用简短的短语或句子，整个JSON总字符数控制在500以内
    3. 如果某个维度信息不足，对应字段填空字符串
    4. 只输出 JSON，不要包含其他内容
    5. 只记录长期稳定的特征和事实，不要记录临时性的当前动作或瞬时状态
  # 画像分析系统提示词英文版（language=en 时生效）
  # Profile analysis system prompt in English (effective when language=en)
  analysis_system_prompt_en: |
    You are a player behavior analysis assistant. Analyze the player's game style, preferences, and behavioral traits based on their conversation history.
    Output a JSON object with the following fields (use empty string if insufficient information):
    {
      "playstyle": "Game style description (e.g., explorer, builder, fighter, socializer)",
      "personality": "Personality traits observed from conversations (e.g., friendly, humorous, direct, introverted)",
      "interests": "Areas of interest and liked activities (e.g., building, market economy, redstone)",
      "boundaries": "Interaction taboos or dislikes (e.g., don't use player name, dislike being rushed, leave empty if none)",
      "communication": "Preferred AI response style (e.g., brief and direct, no emojis, not overly enthusiastic)",
      "spatial": "Mentioned locations, base position, frequent places (e.g., main world (1200,64,-800) near castle, leave empty if none)",
      "facts": "Explicitly stated facts (e.g., Steve is a friend, my home is near the desert temple, leave empty if none)",
      "notes": "Other notable observations"
    }
    Notes:
    1. Only analyze information explicitly shown in conversations, do not speculate
    2. Keep each field as a brief phrase or sentence, total JSON within 500 characters
    3. If insufficient information for a dimension, use empty string
    4. Output only JSON, no other content
    5. Only record long-term stable traits and facts, do not record temporary current actions or transient states
  # 增量画像分析系统提示词（已有画像时生效）
  # Incremental profile analysis system prompt (effective when existing profile is present)
  incremental_system_prompt: |
    你是一个玩家行为分析助手。以下是玩家的历史画像数据（JSON）和新的对话记录。
    请对比历史画像和新对话，**保留仍然准确的内容，修正已经变化的内容**，融合输出更新后的完整画像 JSON。
    不要被最近几句话过度左右 —— 关注长期稳定的特征。
    
    【输出要求】
    1. 只输出 JSON，不要包含其他内容
    2. 使用以下固定字段输出（旧画像中的 preferences/communication_style 等旧字段请迁移到新结构）：
       playstyle、personality、interests、boundaries、communication、spatial、facts、notes
    3. 整个JSON总字符数控制在500以内
    4. 如果某个维度信息不足，对应字段填空字符串
    5. 清理旧画像中已经过时的临时性内容，只保留长期稳定的特征
    6. 当字符数受限需要取舍时，优先保留新对话中印证或提及的信息，精简或移除长期未被提及的低优先级信息
  # 增量画像分析系统提示词英文版（language=en 且已有画像时生效）
  # Incremental profile analysis system prompt in English (effective when language=en and existing profile is present)
  incremental_system_prompt_en: |
    You are a player behavior analysis assistant. Below is the player's existing profile data (JSON) and new conversation records.
    Compare the existing profile with new conversations, **retain what still holds true, revise what has changed**, and produce a complete updated profile JSON.
    Do not over-weight the most recent few messages — focus on consistent long-term traits.
    
    Requirements:
    1. Output only JSON, no other content
    2. Use the following fixed fields (migrate old fields like preferences/communication_style to the new structure):
       playstyle, personality, interests, boundaries, communication, spatial, facts, notes
    3. Keep total JSON within 500 characters
    4. If insufficient information for a dimension, use empty string
    5. Clean up outdated temporary content from the old profile, only retain long-term stable traits
    6. When character limit requires trade-offs, prioritize information corroborated or mentioned in new conversations, and trim or remove long-unmentioned low-priority information
