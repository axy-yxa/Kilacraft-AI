# ==================== Kilacraft-AI 语言配置文件 ====================
# 本配置文件用于管理插件直接展示给玩家的消息文本
# 管理员可以自定义这些消息来适配服务器风格
# 支持颜色代码（§ + 数字/字母）和变量占位符（如 {player}、{seconds}）
#
# 说明：此文件仅控制"玩家在游戏中看到的消息"
# - AI 回复内容（由 LLM 生成）：由 config.yml 的 agent.prompts 控制
# - 内部错误消息（如守护系统异常）：保持硬编码，不在此配置
# - 控制台日志：由下方 logs 段控制
#
# 修改后使用 /kila reload 热重载即可生效，无需重启服务器

# ==================== 命令帮助消息 ====================
# 统一格式： §b/命令 §7[可选参数] <必填参数> §8- §f说明
# §b = 命令名  §7 = 参数  §8 = 分隔符  §f = 说明
help:
  # 标题与基础用法（每行一条，所有玩家可见）
  messages:
    - "§b▌§f Kilacraft-AI §7— §f使用 /kila <消息> 与 AI 对话"
    - "§7也可使用 /kilacraft、/ai、/zm"
    - " §b/kila chat §8- §f进入/退出连续对话模式"

  # 重载配置（kilacraft.reload 权限）
  reload: " §b/kila reload §8- §f热重载全部配置"

  # 清除历史（kilacraft.clear.self / .other 权限）
  clear-self: " §b/kila clear §8- §f清除自己的对话历史"
  clear-other: " §b/kila clear §7<玩家名> §8- §f清除指定玩家的历史"

  # 知识库/人格管理（kilacraft.knowledge / .personalities 权限）
  knowledge: " §b/kila knowledge reload §8- §f重载知识库"
  personalities: " §b/kila personalities reload §8- §f重载人格配置"

  # 守护系统（kilacraft.guardian 权限）
  guardian: " §b/kila guardian §7<on|off|status> §8- §fAI 主动守护"

  # 对话推荐（全体可用）
  suggestion: " §b/kila suggestion §7<on|off|status> §8- §f管理对话推荐"

  # 性能采样（kilacraft.admin.health 权限）
  profile: " §b/kila profile start §7[秒数] §8- §f启动性能采样 (30~120s)"
  profile-subcommands: " §b/kila profile stop | status §8- §f中断采样 / 查看状态"
  # 外部通知（kilacraft.admin.health 权限）
  notify: " §b/kila notify test §8- §f测试外部通知渠道"

  # 查询命令（kilacraft.query.self 权限，查他人需 .usage.other 等）
  usage: " §b/kila usage §7[玩家|all] [时间] §8- §f查看 AI 用量"
  history: " §b/kila history §7[玩家] [页码] [-f] §8- §f查看对话历史（-f 显示完整内容）"
  memory: " §b/kila memory §7[玩家] §8- §f查看玩家画像"

  # 技能命令（全体可用）
  skills: " §b/kila skills §7[页码] §8- §f列出可用技能"
  run: " §b/kila run §7<技能> <提示词> §8- §f强制指定技能执行"

  # 自检与版本（kilacraft.admin.info 权限）
  doctor: " §b/kila doctor §8- §f配置自检"
  about: " §b/kila about §8- §f版本与更新检查"

  # 定时任务（kilacraft.tasks 权限）
  tasks: " §b/kila tasks §8- §f查看定时任务状态"

  # 大模型缓存统计（kilacraft.admin.cache 权限）
  cache: " §b/kila cache §7[页码] §8- §f查看大模型缓存统计"
  cache-reset: " §b/kila cache reset §8- §f重置缓存统计"

# ==================== 权限相关消息 ====================
# 以下配置控制玩家执行没有权限的命令时的提示
permissions:
  # 执行 /kila reload 但没有 kilacraft.reload 权限
  reload: "§c你没有权限重载配置！"
  # 执行 /kila clear 但没有 kilacraft.clear.self 权限
  clear-self: "§c你没有权限清除自己的对话历史记录！"
  # 执行 /kila clear <玩家> 但没有 kilacraft.clear.other 权限
  clear-other: "§c你没有权限清除其他玩家的历史记录！"
  # 执行 /kila knowledge 但没有 kilacraft.knowledge 权限
  knowledge: "§c你没有权限管理知识库！"
  # 执行 /kila personalities 但没有 kilacraft.personalities 权限
  personalities: "§c你没有权限管理人格配置！"

# ==================== 功能状态消息 ====================
# 以下配置控制玩家使用连续对话模式（/kila chat）时的提示
features:
  # config.yml 中 chat_mode_enabled=false 时，玩家尝试通过 @ai 触发聊天模式
  chat-mode-disabled: "§c连续对话模式已被禁用！"
  
  # 控制台尝试使用聊天模式
  chat-mode-player-only: "§c只有玩家才能使用连续对话模式！"
  
  # 玩家执行 /kila chat 进入连续对话模式
  chat-mode-enter: "§a已进入连续对话模式！现在你说的每句话都会发送给 Kilacraft-AI。"
  # 进入连续对话模式时的副标题（Subtitle）
  chat-mode-enter-subtitle: "§7输入 §b/kila chat§7 退出连续对话模式"
  
  # 玩家再次执行 /kila chat 退出连续对话模式
  chat-mode-exit: "§7已退出连续对话模式"

# ==================== 命令执行结果消息 ====================
# 以下配置控制各种命令执行成功/失败后显示给玩家的反馈
commands:
  # /kila reload 重载成功（统一提示，涵盖所有子模块重载）
  reload-success: "§a配置已重载！"
  
  # /kila reload 重载失败
  reload-failure: "§c配置重载失败："
  
  # /kila clear 清除自己的对话历史成功
  clear-self-success: "§a已清除你的对话历史记录！"
  
  # /kila clear <玩家> 清除他人历史成功 — 变量: {player}=目标玩家名
  clear-other-success: "§a已清除玩家 {player} 的对话历史记录！"
  
  # 控制台执行 /kila clear 但没有指定玩家名
  clear-console-hint: "§c请在命令中添加玩家名称来清除其历史记录：/kila clear <玩家名称>"
  
  # /kila knowledge reload 重载成功
  knowledge-reload-success: "§a知识库已重载！"
  
  # /kila knowledge reload 重载失败
  knowledge-reload-failure: "§c知识库重载失败："
  
  # /kila personalities reload 重载成功
  personalities-reload-success: "§a人格配置已重载！"
  
  # /kila personalities reload 重载失败
  personalities-reload-failure: "§c人格配置重载失败："
  
  # /kila <子命令> 输入了未知的子命令
  unknown-subcommand: "§c未知的子命令："
  
  # /kila knowledge 或 personalities 输入未知子命令时提示
  available-subcommands: "§b可用子命令：reload"
  
  # 玩家发送消息但在冷却时间内 — 变量: {seconds}=剩余秒数
  cooldown-warning: "§c请等待 {seconds} 秒后再试！"
  
  # 第三方插件通过控制台命令调用 AI，但该玩家还在冷却中
  # 变量: {player}=玩家名, {seconds}=剩余秒数
  plugin-command-cooldown-warning: "§c玩家 {player} 正在冷却中，请等待 {seconds} 秒后再试！"
  
  # 玩家在 config.yml 的 banned_worlds 世界中发送消息
  # 变量: {ai_name}=AI 名称（来自 config.yml 的 ai_name）
  world-banned-hint: "§c当前世界禁止使用 {ai_name}！"

  # ==================== /kila cache 大模型缓存统计 ====================
  cache-no-permission: "§c你没有权限查看大模型缓存统计。"
  cache-reset-success: "§a大模型缓存统计已重置。"
