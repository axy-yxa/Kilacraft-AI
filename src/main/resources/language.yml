# ==================== 插件命令专用消息 ====================
# 以下配置控制第三方插件通过 /kila plugins 命令调用 AI 时的提示
# 此命令为控制台专用，普通玩家不可使用
plugins-command:
  # 普通玩家尝试执行 /kila plugins 命令
  player-blocked: "§c请使用 /kila <消息>"
  
  # 控制台执行但参数不足
  insufficient-args: "§c参数不足！使用方法：/kila plugins <人格> <内容> <玩家 UUID> [回调命令...]"
  
  # 参数不足时显示的使用示例
  usage-example: "§b示例：/kila plugins 严厉教师 你好 069a79f4-44e9-4726-a5be-fca90e38aaf5"
  
  # 回调命令说明
  callback-hint: "§7可选：在末尾添加回调命令，AI 完成后自动执行"
  
  # 带回调命令的使用示例
  callback-example: "§b带回调：/kila plugins mm_ai 你好 UUID testai handleAI {response} mm_ai"
  
  # {response} 占位符的说明
  callback-placeholder-hint: "§7{response} 会被替换为实际的 AI 回复内容"
  
  # 提供的玩家 UUID 格式无效
  invalid-uuid: "§c无效的玩家 UUID 格式："
  
  # UUID 格式提示
  uuid-format-hint: "§b请确保 UUID 格式正确，例如：069a79f4-44e9-4726-a5be-fca90e38aaf5"
  
  # 指定的人格名称在 personalities.yml 中不存在
  personality-not-found: "§c未找到人格配置："
  
  # 人格不存在时显示可用列表
  personality-list-hint: "§b可用的人格列表："
  
  # 插件命令执行过程中发生错误
  error: "§c发生错误："

