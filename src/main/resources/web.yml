# ==================== Web 搜索与抓取配置 / Web Search & Fetch Configuration ====================
web:
  # ==================== 联网搜索 / Web Search ====================
  search:
    # 是否启用联网搜索技能（默认: true）
    # Enable web search skill (default: true)
    enabled: true

    # 搜索供应商：auto(按语言自动选国内/国际) / Search provider: auto(select by language)
    # zhipu / baidu_qianfan / volcengine_doubao / qiniu_baidu / alibaba_iqs / tavily / brave / exa / you_com
    provider: auto

    # 每次搜索返回的默认结果条数，用户未明确指定数量时使用（范围: 1-10，默认: 5）
    # Default result count per search, used when player doesn't specify (range: 1-10, default: 5)
    result_count: 5

    # 单次搜索最多返回的结果条数，硬上限（范围: 1-20，默认: 10）
    # Hard cap on max results per search (range: 1-20, default: 10)
    max_result_count: 10

    # 每条搜索结果摘要的最大字符数，超长截断（默认: 800）
    # Max snippet chars per search result, truncate if exceeded (default: 800)
    max_snippet_chars: 800

    # ---- 国内供应商（按优先级自动选择首个已配置的） ----

    # 智谱AI(https://open.bigmodel.cn)
    zhipu:
      api_key: ""
      # 搜索引擎：search_std(标准) / search_pro(增强) / search_pro_sogou(搜狗) / search_pro_quark(夸克)
      search_engine: search_std

    # 百度千帆(https://console.bce.baidu.com/qianfan)
    baidu_qianfan:
      api_key: ""

    # 火山引擎豆包 独立联网搜索(https://console.volcengine.com/search-infinity/api-key)
    # 注意：此 Key 非火山方舟 Ark API Key，需在联网搜索控制台获取
    volcengine_doubao:
      api_key: ""

    # 七牛云百度搜索(https://portal.qiniu.com)
    qiniu_baidu:
      api_key: ""

    # 阿里云百炼IQS(https://iqs.console.aliyun.com)
    alibaba_iqs:
      api_key: ""

    # ---- International Providers (auto-select first configured by priority) ----

    # Tavily (https://tavily.com) — AI Agent ecosystem standard
    tavily:
      api_key: ""

    # Brave Search (https://brave.com/search/api/)
    brave:
      api_key: ""

    # Exa (https://exa.ai) — neural semantic search
    exa:
      api_key: ""

    # You.com (https://you.com)
    you_com:
      api_key: ""

  # ==================== 网页抓取 / Web Fetch ====================
  fetch:
    # 是否启用网页抓取技能（默认: true，零配置，无需 API Key）
    # Enable web fetch skill (default: true, zero-config, no API key required)
    enabled: true

    # HTTP 响应 body 最大字节数（MB），超限截断后仍解析（默认: 2）
    # Max HTTP response body size in MB, truncated on overflow but still parsed (default: 2)
    max_body_size_mb: 2

    # 提取文本最大字符数，留给 LLM 上下文空间（默认: 8000）
    # Max extracted text chars, reserve LLM context space (default: 8000)
    max_text_chars: 8000

    # HTTP 请求超时（秒），取决于目标网站所在网络（默认: 15）
    # HTTP request timeout in seconds; depends on target network (default: 15)
    timeout_seconds: 15

    # SSRF 防护：拒绝访问内网地址
    # SSRF protection: deny access to private/internal addresses
    ssrf_protection: true
