# ==================== AI 登录问候配置 ====================
# AI Login Greeting Configuration
# 独立配置文件，修改后执行 /kilacraft reload 即时生效
# Standalone config file, run /kilacraft reload to apply changes

greeting:
  # 是否启用 AI 登录问候
  # Whether to enable AI login greeting
  enabled: true

  # 问候延迟（ticks，20 ticks = 1秒）
  # 登录后等待多少 tick 再发送问候（等待玩家加载完毕）
  # Delay before sending greeting (in ticks, 20 ticks = 1 second)
  delay_ticks: 100

  # 首次登录问候模板提示词（留空使用内置默认）
  # First login greeting prompt template (leave empty for built-in default)
  # 支持占位符: {player} {server_info}
  # Supported placeholders: {player} {server_info}
  first_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手，{player} 第一次来到服务器。
    请直接对 {player} 说话，像朋友一样自然地表示欢迎。
    要求：
    1. 简短介绍自己能做什么：回答问题、查物品、操作市场、挂机任务等，玩家用 /ai 就能找你
    2. 如果有服务器信息，顺便提一下；没有就不提
    3. 不超过 120 个汉字，像朋友聊天一样自然
    
    {server_info}

  # 回归问候模板提示词（留空使用内置默认）
  # Returning login greeting prompt template (leave empty for built-in default)
  # 支持占位符: {player} {offline_duration} {own_events_section} {friend_events_section} {online_friends_section} {last_location} {summary_section}
  # Supported placeholders: {player} {offline_duration} {own_events_section} {friend_events_section} {online_friends_section} {last_location} {summary_section}
  returning_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手。{player} 回来了，距离上次登录已经过去了 {offline_duration}。
    请直接对 {player} 说话，像朋友一样自然地打招呼。
    
    {own_events_section}
    {friend_events_section}
    {online_friends_section}
    {last_location}
    {summary_section}
    
    要求：
    1. 根据离线事件自然地提及重要的事，没有则跳过，不要编造
    2. 根据好友动态提及好友的重要动态（如好友击杀了BOSS、完成了袭击、宠物战死、被雷劈等趣事），没有则跳过
    3. 在线好友列表为空时，绝对不要提及任何好友相关内容，不要说"好友们在忙"之类的话
    4. 玩家数据中只有出现有趣的数值（如666、888等吉利数字、整数里程碑、顺子数字）时才提及，无意义的零值（如0小时、0天）必须忽略；上次游玩亮点若有则提及，没有则跳过
    5. 如果离线时间很短（如"刚刚"），不要说"好久不见"或"休息了很久"之类的话，简单打招呼即可
    6. 不超过 200 个汉字，像朋友聊天一样自然
    7. 不要列举所有事件，挑选最有价值的 1-5 件提及
    8. 上次位置仅供参考，除非在特殊世界（末地/下界），否则不要提及

  # 玩家自己离线事件最大条数（分类一）
  # Max own offline events to include in returning greeting (Category 1)
  max_own_offline_events: 20

  # 好友离线事件最大条数（分类二，好友动态）
  # Max friend offline events to include (Category 2: friend dynamics)
  max_friend_offline_events: 10

  # 上次游玩亮点最大条数（分类三，用于其他摘要）
  # Max last session highlights to include (Category 3: summary stats)
  max_summary_events: 5

  # 问候冷却时间（分钟），0 表示不限制
  # 玩家在此时间内重复登录不触发问候（防止掉线重连反复打扰）
  # Greeting cooldown in minutes, 0 means no limit
  greeting_cooldown_minutes: 30

  # 是否在 AI 对话和问候中注入玩家画像分析结果
  # 启用后 AI 能感知玩家游戏风格、性格、偏好等信息，提供更个性化的回复
  # Whether to inject player profile analysis into AI conversations and greetings
  profile_injection_enabled: true

  # 服务器介绍信息（用于首次登录问候，留空则不包含）
  # Server introduction info (used in first login greeting, leave empty to exclude)
  # 服主可在此填写自己服务器的特色介绍（如服务器名称、玩法特色、规则等）
  # 如果留空，AI 只会简要介绍自己作为 AI 助手的能力
  # Server owners can fill in their server's unique features here
  # If left empty, AI will only briefly introduce its own capabilities
  server_info: ""
