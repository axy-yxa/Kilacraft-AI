# ==================== AI 登录问候配置 ====================
# 独立配置文件，修改后执行 /kila reload 即时生效

greeting:
  # 是否启用 AI 登录问候
  enabled: true

  # 问候延迟（ticks，20 ticks = 1秒）
  # 登录后等待多少 tick 再发送问候（等待玩家加载完毕）
  delay_ticks: 100

  # 首次登录问候模板提示词
  # 支持占位符: {player} {server_info}
  first_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手，{player} 第一次来到服务器。
    以平实自然的语气对 {player} 表示欢迎。
    规则：
    1. 简短介绍自己能做什么：回答问题、查物品、操作市场、挂机任务等，玩家用 /kila 就能找你
    2. 如果有服务器信息，顺便提一下；没有就不提
    3. 控制在 120 汉字以内
    
    {server_info}

  # 回归问候模板提示词
  # 支持占位符: {player} {offline_duration} {own_events_section} {friend_events_section} {online_friends_section} {last_location} {summary_section}
  returning_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手。{player} 登录了，距上次离线 {offline_duration}。
  
    {own_events_section}
    {friend_events_section}
    {online_friends_section}
    {last_location}
    {summary_section}
  
    以平实的语气欢迎 {player} 回来。
  
    规则：
    1. 空内容分类（"没有""暂无"等）完全跳过，不提。不用"一切如故""没什么事""挺安静的"等概括句填充。
    2. 无好友时禁止提任何与好友在线状态相关的表述。
    3. 玩家数据仅在满足以下任一硬性条件时，才可用具体数字提及：(a)达到有意义的里程碑，(b)与本次离线事件有直接因果关联。不满足则完全不提任何玩家数据。提到时必须说出具体数字，禁止用"很长""相当多""打了不少""飞了好远"等模糊描述。
    4. 上次位置仅作背景参考。除非在上次位置发生了离线事件，否则不提及。提及时不报坐标，不说世界名。
    5. 不以疑问句结尾。
    6. 若提示词开头有「Kilacraft-AI 插件新版本可用」等版本更新提醒段落，则问候不受下方字数限制，先完整转达更新信息再常规问候；否则控制在200汉字以内，若无可提内容，说"欢迎回来，有什么需要随时找我。"即可。

  # 玩家自己离线事件最大条数
  max_own_offline_events: 20

  # 好友离线事件最大条数
  max_friend_offline_events: 10

  # 上次游玩亮点最大条数
  max_summary_events: 5

  # 问候冷却时间（分钟），0 表示不限制
  # 玩家在此时间内重复登录不触发问候（防止掉线重连反复打扰）
  greeting_cooldown_minutes: 30

  # 是否在 AI 对话和问候中注入玩家画像分析结果
  # 启用后 AI 能感知玩家游戏风格、性格、偏好等信息，提供更个性化的回复
  profile_injection_enabled: true

  # 服务器介绍信息（用于首次登录问候，留空则不包含）
  # 服主可在此填写自己服务器的特色介绍（如服务器名称、玩法特色、规则等）
  # 如果留空，AI 只会简要介绍自己作为 AI 助手的能力
  server_info: ""
