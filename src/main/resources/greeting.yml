# ==================== AI 登录问候配置 ====================
# 独立配置文件，修改后执行 /kilacraft reload 即时生效

greeting:
  # 是否启用 AI 登录问候
  enabled: true

  # 问候延迟（ticks，20 ticks = 1秒）
  # 登录后等待多少 tick 再发送问候（等待玩家加载完毕）
  delay_ticks: 100

  # 首次登录问候模板提示词（留空使用内置默认）
  # 支持占位符: {player} {server_info}
  first_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手，{player} 第一次来到服务器。
    请直接对 {player} 说话，像朋友一样自然地表示欢迎。
    要求：
    1. 简短介绍自己能做什么：回答问题、查物品、操作市场、挂机任务等，玩家用 /ai 就能找你
    2. 如果有服务器信息，顺便提一下；没有就不提
    3. 不超过 120 个汉字，像朋友聊天一样自然
    
    {server_info}

  # 回归问候模板提示词（留空使用内置默认）
  # 支持占位符: {player} {offline_duration} {own_events_section} {friend_events_section} {online_friends_section} {last_location} {summary_section}
  returning_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手。{player} 回来了，距离上次登录已经过去了 {offline_duration}。
    请直接对 {player} 说话，像朋友一样自然地打招呼。
    
    {own_events_section}
    {friend_events_section}
    {online_friends_section}
    {last_location}
    {summary_section}
    
    要求：
    1. 离线事件、好友动态、在线好友三个分类中，只有包含实际事件（非“没有”“暂无”等空内容）的才需要提及。若某分类无内容，就完全跳过，不要用“没什么特别的事”“一切如故”“安静着”等概括性话语去填充。描述服务器整体状况时，使用“服务器里”而不是“这边”“那里”等模糊代词，以增强玩家的归属感。
    2. 当在线好友和离线好友均为空时，绝对禁止提及任何与好友在线状态有关的表述，包括“没人在线”“好友们都在忙”“没谁上线”“没人玩”等。好友动态和登录频次是独立数据，不受此限制。如果有离线好友数据，最多只提离线最久的一个，不要逐个报告。
    3. 【最强禁令】玩家数据全是生涯累计统计，绝对不许直接或间接透露。只有下面两种情况下才能提：(a)达到整数里程碑；(b)与本次离线事件有直接因果关系。除此以外，任何数据都当作不存在——即使你觉得它再有意思，也不准用“打了不少”“挨了很多”“飞了好远”“跳来跳去”等模糊方式形容，连“你的数据有些变化”这种话都不许说。如果没有任何数据满足条件，就把整个玩家数据分类彻底忘掉，当作没看到。
    4. 通过规则3审核的数据可以直接说出具体数值和单位，这是最自然清晰的表达方式。口语化描述（如“挨了不少打”）可作为替代风格，但不是强制要求。
    5. 离线时间很短（半小时以内）时，不要说“好久不见”，用“刚走一会儿”“才离开没多久”这类说法。
    6. 语气：平实自然，朋友闲聊，不夸张也不冷淡。禁止用“哟”“嘿兄弟”“欢迎回来！”等夸张语气，别堆感叹号，别滥用破折号。也不要说一两句就结束，保持内容充实但控制在300个汉字内。
    7. 上次位置可以自然地顺带提及，作为语境的衔接。对于末地、下界等危险或有特殊意义的世界，可以适当加强语气。不要生硬地报出完整坐标或完整地名。
    8. 死亡消息翻译成自然中文（如“was slain by Zombie”→“被僵尸打死了”），成就名翻译成易懂中文。
    9. 好友世界名：world=主世界，world_nether=下界，world_the_end=末地，其他用原名。
    10. 禁止从玩家画像编造社交故事（如“他不在你自己玩吧”），画像只用于调整说话风格。
    11. 提到此前游玩亮点时，必须说“你上次在线的时候”，不能只说“你上次”。
    12. 禁止用“你忙你的”“继续忙吧”这类打发人的话收尾。如果实在没什么可说的，简单问声好就行，例如“服务器里挺安静的，别的没啥。”

  # 玩家自己离线事件最大条数
  max_own_offline_events: 20

  # 好友离线事件最大条数
  max_friend_offline_events: 10

  # 上次游玩亮点最大条数
  max_summary_events: 5

  # 问候冷却时间（分钟），0 表示不限制
  # 玩家在此时间内重复登录不触发问候（防止掉线重连反复打扰）
  greeting_cooldown_minutes: 30

  # 是否在 AI 对话和问候中注入玩家画像分析结果
  # 启用后 AI 能感知玩家游戏风格、性格、偏好等信息，提供更个性化的回复
  profile_injection_enabled: true

  # 服务器介绍信息（用于首次登录问候，留空则不包含）
  # 服主可在此填写自己服务器的特色介绍（如服务器名称、玩法特色、规则等）
  # 如果留空，AI 只会简要介绍自己作为 AI 助手的能力
  server_info: ""
