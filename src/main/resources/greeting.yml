# ==================== AI 登录问候配置 / AI Login Greeting Configuration ====================
# 独立配置文件，修改后执行 /kila reload 即时生效
# Standalone config file, run /kila reload to apply changes

greeting:
  # 是否启用 AI 登录问候
  # Whether to enable AI login greeting
  enabled: true

  # 问候延迟（ticks，20 ticks = 1秒）
  # 登录后等待多少 tick 再发送问候（等待玩家加载完毕）
  # Delay before sending greeting (in ticks, 20 ticks = 1 second)
  # Wait this many ticks after login before sending greeting (wait for player to fully load)
  delay_ticks: 100

  # 首次登录问候模板提示词（支持占位符：player、server_info）
  # First login greeting prompt template (supported placeholders: player, server_info)
  # 中文提示词（language=zh 时使用）
  first_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手，{player} 第一次来到服务器。
    以平实自然的语气对 {player} 表示欢迎。
    规则：
    1. 简短介绍自己：你是 AI 助手，玩家用 /kila 或 /ai 就能随时找你——游戏问题、查信息、或任何需要帮忙的事，都可以找我
    2. 如果有服务器信息，顺便提一下；没有就不提
    3. 控制在 120 汉字以内

    {server_info}

  # English prompt (used when language is not zh)
  first_login_prompt_en: |
    You are the AI assistant of this Minecraft server. {player} has just joined for the first time.
    Welcome {player} in a calm, natural tone.
    Rules:
    1. Briefly introduce yourself: you're the server AI assistant. Players can reach you anytime with /kila or /ai — questions, info lookup, or anything they need help with in-game
    2. If there is server info, mention it briefly; if not, skip it
    3. Keep it under 120 words

    {server_info}

  # 回归问候模板提示词（支持占位符：player、offline_duration、own_events_section、friend_events_section、online_friends_section、last_location、summary_section）
  # Returning login greeting prompt template (placeholders: player, offline_duration, own_events_section, friend_events_section, online_friends_section, last_location, summary_section)
  # 中文提示词（language=zh 时使用）
  returning_login_prompt: |
    你是这个 Minecraft 服务器的 AI 助手。{player} 登录了，距上次离线 {offline_duration}。

    {own_events_section}
    {friend_events_section}
    {online_friends_section}
    {last_location}
    {summary_section}

    以平实的语气欢迎 {player} 回来。

    规则：
    1. 空内容分类（"没有""暂无"等）完全跳过，不提。不用"一切如故""没什么事""挺安静的"等概括句填充。
    2. 无好友时禁止提任何与好友在线状态相关的表述。
    3. 玩家数据仅在满足以下任一硬性条件时，才可用具体数字提及：(a)达到有意义的里程碑，(b)与本次离线事件有直接因果关联。不满足则完全不提任何玩家数据。提到时必须说出具体数字，禁止用"很长""相当多""打了不少""飞了好远"等模糊描述。
    4. 上次位置仅作背景参考。除非在上次位置发生了离线事件，否则不提及。提及时不报坐标，不说世界名。
    5. 不以疑问句结尾。
    6. 若提示词包含「Kilacraft-AI 插件新版本可用」或「服务器异常告警」等高优先级段落，则问候不受下方字数限制，必须完整转达这些段落的所有信息后再收尾；否则控制在200汉字以内，若无可提内容，说"欢迎回来，有什么需要随时找我。"即可。

  # English prompt (used when language is not zh)
  returning_login_prompt_en: |
    You are the AI assistant of this Minecraft server. {player} just logged in, after being offline for {offline_duration}.

    {own_events_section}
    {friend_events_section}
    {online_friends_section}
    {last_location}
    {summary_section}

    Welcome {player} back in a calm, natural tone.

    Rules:
    1. Skip empty categories ("none", "nothing", etc.) entirely. Do not pad with phrases like "nothing special", "all quiet", or "everything's normal".
    2. If the player has no friends, do not mention anything about friend online status.
    3. Only mention player stats if they meet one of these HARD criteria: (a) reaches a meaningful milestone, (b) has a direct causal link to an offline event this session. If nothing qualifies, do not mention any stats at all. When mentioning, you MUST state exact numbers — do NOT use vague phrases like "quite a lot", "a long way", or "quite a few".
    4. Last location is for background context only. Do not mention it unless an offline event occurred there. When mentioned, do not reveal coordinates or world name.
    5. Do not end with a question.
    6. If the prompt contains high-priority sections such as "Kilacraft-AI plugin new version available" or server anomaly alerts, the greeting is exempt from the word limit below — you must fully convey all info from these sections before wrapping up; otherwise keep it under 120 words. If there is nothing worth mentioning, just say "Welcome back, let me know if you need anything."

  # 玩家自己离线事件最大条数
  # Max own offline events to include in returning greeting
  max_own_offline_events: 20

  # 好友离线事件最大条数
  # Max friend offline events to include
  max_friend_offline_events: 10

  # 上次游玩亮点最大条数
  # Max last session highlights to include
  max_summary_events: 5

  # 问候冷却时间（分钟），0 表示不限制
  # 玩家在此时间内重复登录不触发问候（防止掉线重连反复打扰）
  # Greeting cooldown in minutes, 0 means no limit
  # Prevents repeated greetings on rapid reconnects
  greeting_cooldown_minutes: 30

  # 是否在 AI 对话和问候中注入玩家画像分析结果
  # 启用后 AI 能感知玩家游戏风格、性格、偏好等信息，提供更个性化的回复
  # Whether to inject player profile analysis into AI conversations and greetings
  # When enabled, AI can perceive player game style, personality, preferences for more personalized responses
  profile_injection_enabled: true

  # 服务器介绍信息（用于首次登录问候，留空则不包含）
  # 服主可在此填写自己服务器的特色介绍（如服务器名称、玩法特色、规则等）
  # 如果留空，AI 只会简要介绍自己作为 AI 助手的能力
  # Server introduction info (used in first login greeting, leave empty to exclude)
  # Server owners can fill in their server's unique features here
  # If left empty, AI will only briefly introduce its own capabilities
  server_info: ""
