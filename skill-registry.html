<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilacraft-AI Skill Registry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-built-in {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .badge-third-party {
            background: #fff3e0;
            color: #f57c00;
        }
        
        .badge-verified {
            background: #e8f5e9;
            color: #388e3c;
        }
        
        .badge-unverified {
            background: #ffebee;
            color: #d32f2f;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #7f8c8d;
        }
        
        .footer a {
            color: #1976d2;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kilacraft-AI Skill Registry</h1>
        <div class="subtitle" id="subtitle">Data Source: bStats Real-time Statistics</div>
        
        <div id="content">
            <div class="loading">Loading data from bStats...</div>
        </div>
        
        <div class="footer">
            <p>
                🟢 Official = Built-in Skills by KilacraftAI | 
                🟢 Verified = Passed code security review | 
                🔴 Unverified = Potential security risks, use with caution
            </p>
            <p style="margin-top: 10px;">
                <a href="https://github.com/axy-yxa/Kilacraft-AI" target="_blank">GitHub</a> | 
                <a href="https://bstats.org/plugin/bukkit/Kilacraft-AI/30853" target="_blank">bStats</a> |
                Last Updated: <span id="lastUpdate">-</span>
            </p>
        </div>
    </div>

    <script>
        // Whitelist configuration (manually maintained by project maintainers)
        const WHITELIST_URL = 'https://raw.githubusercontent.com/axy-yxa/Kilacraft-AI/master/verified-skills.json';
        
        // bStats API endpoint
        const BSTATS_API = 'https://bstats.org/api/v1/plugins/30853/charts/all_skills/data';
        
        /**
         * Fetch verified skills whitelist
         */
        async function fetchWhitelist() {
            try {
                const response = await fetch(WHITELIST_URL);
                if (!response.ok) return {};
                return await response.json();
            } catch (error) {
                console.warn('Failed to load whitelist:', error);
                return {};
            }
        }
        
        /**
         * Fetch Skill data from bStats API
         * bStats SimplePie API returns format: [{"name": "jsonString", "y": serverCount}, ...]
         */
        async function fetchSkillData() {
            const response = await fetch(BSTATS_API);
            if (!response.ok) {
                throw new Error('bStats API request failed');
            }
            const rawData = await response.json();

            // Return empty array when no data
            if (!Array.isArray(rawData) || rawData.length === 0) {
                return [];
            }

            // Parse SimplePie format: [{name: JSON string, y: server count}]
            const allSkills = [];
            for (const item of rawData) {
                try {
                    const skills = JSON.parse(item.name);
                    skills.forEach(skill => {
                        allSkills.push({
                            ...skill,
                            serverCount: item.y
                        });
                    });
                } catch (e) {
                    console.warn('Failed to parse Skill entry:', e);
                }
            }
            return allSkills;
        }
        
        /**
         * Merge Skill data reported from multiple servers (accumulate serverCount).
         *
         * Merge key: skill.name.
         * When the same skill name is reported by different servers with different
         * sourcePlugin values, KilacraftAI/Kilacraft-AI always wins for the identity
         * fields (type, sourcePlugin). Non-official entries only contribute to
         * serverCount. This prevents a renamed fork from hijacking the registry
         * display just by being the first entry in the API response.
         */
        function parseAndMergeSkills(rawSkills) {
            const skillMap = new Map();

            for (const skill of rawSkills) {
                const existing = skillMap.get(skill.name);
                if (!existing) {
                    skillMap.set(skill.name, {
                        name: skill.name,
                        type: skill.type,
                        sourcePlugin: skill.sourcePlugin,
                        serverCount: skill.serverCount
                    });
                } else {
                    // Accumulate server count regardless of source
                    existing.serverCount += skill.serverCount;

                    // If the existing entry is NOT official but the incoming one IS,
                    // promote the identity fields to the official source.
                    const isOfficial = function (sp) {
                        return sp === 'KilacraftAI' || sp === 'Kilacraft-AI';
                    };
                    if (!isOfficial(existing.sourcePlugin) && isOfficial(skill.sourcePlugin)) {
                        existing.type = skill.type;
                        existing.sourcePlugin = skill.sourcePlugin;
                    }
                }
            }

            return Array.from(skillMap.values());
        }
        
        /**
         * Get security status
         */
        function getStatus(skillName, type, whitelist) {
            if (type === 'built_in') {
                return { text: '🟢 Official', class: 'badge-verified' };
            }
            
            if (whitelist[skillName]) {
                return { text: '🟢 Verified', class: 'badge-verified' };
            }
            
            return { text: '🔴 Unverified', class: 'badge-unverified' };
        }
        
        /**
         * Render registry table
         */
        function renderTable(skills, whitelist) {
            // Sort by server count in descending order
            skills.sort((a, b) => b.serverCount - a.serverCount);

            document.getElementById('content').innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Skill Name</th>
                            <th>Type</th>
                            <th>Source Plugin</th>
                            <th>Servers</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${skills.map(skill => {
                const status = getStatus(skill.name, skill.type, whitelist);
                const typeBadge = skill.type === 'built_in'
                    ? '<span class="badge badge-built-in">Official</span>'
                    : '<span class="badge badge-third-party">SPI</span>';

                return `
                                <tr>
                                    <td><strong>${skill.name}</strong></td>
                                    <td>${typeBadge}</td>
                                    <td>${skill.sourcePlugin}</td>
                                    <td>${skill.serverCount}</td>
                                    <td><span class="badge ${status.class}">${status.text}</span></td>
                                </tr>
                            `;
            }).join('')}
                    </tbody>
                </table>
            `;
        }
        
        /**
         * Main function
         */
        async function main() {
            const now = new Date();
            try {
                // Fetch whitelist and bStats data in parallel
                const [whitelist, bstatsData] = await Promise.all([
                    fetchWhitelist(),
                    fetchSkillData()
                ]);
                
                // Parse and merge data
                const skills = parseAndMergeSkills(bstatsData);

                if (skills.length === 0) {
                    document.getElementById('content').innerHTML = `
                        <div class="error">
                            <strong>No Data Available</strong><br>
                            bStats has not received any Skill reporting data yet. After the plugin's first startup, it takes approximately 30 minutes for bStats to collect data.<br>
                            You can <a href="javascript:void(0)" onclick="main()">click to refresh</a> or try again later.
                        </div>
                    `;
                    document.getElementById('lastUpdate').textContent = now.toLocaleString('en-US');
                    return;
                }
                
                // Render table
                renderTable(skills, whitelist);
                
                // Update last update time
                document.getElementById('lastUpdate').textContent = now.toLocaleString('en-US');
                document.getElementById('subtitle').textContent = 
                    `Data Source: bStats Real-time Statistics | Total Skills Discovered: ${skills.length}`;
                
            } catch (error) {
                console.error('Load failed:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Load Failed</strong><br>
                        Unable to retrieve data from bStats, please try again later.<br>
                        Error: ${error.message}
                    </div>
                `;
                document.getElementById('lastUpdate').textContent = now.toLocaleString('en-US');
            }
        }
        
        // Execute on page load
        main();
        
        // Auto refresh every 30 minutes
        setInterval(main, 30 * 60 * 1000);
    </script>
</body>
</html>
